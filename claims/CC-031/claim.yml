  - id: CC-031A
    text: "Vision of Gozo becoming the first climate-neutral region in Malta"
    said_by: "Camilleri (quoted) [1]"
    finding: "A statement of intent. The quoted words give no target year, baseline or boundary (plan not read; it may). Rated\
      \ as a pledge, on those words only."
    rating: "Not measurable (pledge)"
    tone: grey
  - id: CC-031B
    text: "Gozo already has a fully electric public transport fleet"
    said_by: "Camilleri, paraphrased by Gozo Today [1]"
    finding: "TVM News: all Gozo buses electric since late May 2026, end of diesel buses (operator and government statements)\
      \ [3, 4]. No independent fleet record read."
    rating: "Largely accurate"
    tone: green
  - id: CC-031C
    text: "Gozo has begun its transition (fleet, renewables, mobility, water)"
    said_by: "Camilleri, paraphrased [1]"
    finding: "Only the fleet could be tested. The renewables, rehabilitation and water items are named without figures in\
      \ the report we read and are not tested here."
    rating: "Not tested"
    tone: grey
  - id: CC-031D
    text: "Scale of the fleet change (our check)"
    said_by: "Not claimed"
    finding: "About 1.3 kt CO2 a year, roughly 2.6% of a proportional Gozo road-transport estimate: a small part of the total,\
      \ and not something the statement asserts otherwise."
    rating: "Context"
    tone: amber
