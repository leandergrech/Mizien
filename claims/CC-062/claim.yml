id: CC-062
title: Construction is 9-14% of the economy
category: Planning & Housing
subtopic: Development & construction
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'KPMG (Steve Stivala, Director, Advisory Services), foreword to the Construction Industry and Property Market Report
    2025, commissioned by the Malta Development Association (Dec 2025): construction and real estate account for around 9%
    of gross value added on direct effects alone, and approximately 14% once indirect linkages are factored in.'
  speaker: KPMG
  date: 2025-12
  wording_status: Verbatim found
  sources:
  - title: Construction Industry and Property Market Report 2025 (foreword, PDF p. 10; Tables 1.1-1.3, pp. 23-30)
    publisher: KPMG for the Malta Development Association
    date: Dec 2025
    url: https://assets.kpmg.com/content/dam/kpmgsites/mt/pdf/2025/12/kpmg-mda-construction-industry-and-property-market-report-2025.pdf
    note: The claim, in the foreword. Read 8 Oct 2026 (foreword, executive summary, Chapter 1); not committed (copyright);
      SHA-256 in data/cc-062/source_hash.txt.
  quote: Construction and real estate collectively account for around 9% of Gross Value Added (GVA) when considering direct
    effects alone, rising to approximately 14% once indirect linkages are factored in.
counter_evidence: 'Both figures reproduce: 9.1% (KPMG Table 1.1; Eurostat 9.6% for 2024, same definition) and 14.04% (Table
  1.3; output inputs match Eurostat). They are not on one basis: the 9% excludes imputed rents and the 14% includes them;
  on KPMG''s own figures the direct share with imputed rents is 12.3%, so indirect linkages add 1.7 points, not 5. The multipliers
  (0.55, 0.78; Central Bank of Malta, 2015 table, second-hand) could not be re-derived: Eurostat''s Malta input-output table
  covers 72% of value added.'
tests: KPMG Tables 1.1-1.3; Eurostat nama_10_a64 (GVA and output by industry); Eurostat naio_10_cp1750 (tools/cc-062-report/calc.py).
why_low_hanging: 'Done: Claim Check 062 report and flyer.'
