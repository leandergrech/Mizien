claim:
  text: 'ERA (11 Aug 2026): 54 protected trees will be removed, with 10 new indigenous trees planted for each (540).
    Of 678 trees and shrubs to be removed, 92% are classified as non-protected; 348 more are to be transplanted.'
  speaker: Environment and Resources Authority (ERA)
  date: '2026-08-11'
