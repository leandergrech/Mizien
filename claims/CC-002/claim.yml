caveats: This check assesses the scientific meaning of the reported tree counts and proposed mitigation only. It
  does not assess permit validity or any tribunal proceedings. The tree works and planting had not been independently
  verified as completed at the 3 October 2026 cut-off. ERA and secondary reporting differ by one oleander in the
  breakdown of the 624 non-protected specimens (467 versus 468); the permit annex should be checked before treating
  that species count as settled. Right of reply not sought, at the maintainer’s direction.
