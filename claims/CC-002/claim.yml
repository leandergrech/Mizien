evidence_shown:
- ERA's 7 and 11 August 2026 clarifications: 624 non-protected and 54 protected specimens scheduled for removal;
    348 scheduled for transplant; 540 new indigenous trees stipulated for the 54 protected trees removed.
- Mifsud, Pavon and Médail (2026), Comino flora inventory: local species, endemic and protected plant context, and
    evidence that some introduced woody species can affect native habitats.
- D'Agostino et al. (2024): review of 178 plant-translocation cases analysed in Italy; success varied with site,
    material, methods and aftercare. This is not an estimate for the Comino trees.
- Dror et al. (2020): controlled field comparison of eight transplanted mature olive trees and eight controls over
    two years; transplanting produced measurable physiological stress despite pruning, irrigation and fertilisation.
- Heleno et al. (2010): controlled restoration study on the Azores showing alien-plant removal can benefit native
    food-web indicators, with immediate disturbance effects and context-dependent outcomes.
