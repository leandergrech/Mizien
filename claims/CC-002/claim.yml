counter_evidence: The published figures describe proposed interventions and planting conditions, not completed work
  or measured ecological replacement. Studies show that transplant outcomes vary with species, source, site suitability
  and aftercare; tree counts alone do not establish survival, habitat recovery or equivalent ecological function.
tests: Recalculate ERA's count and ratio; distinguish the removal, transplantation and pruning categories; compare
  species-level local ecological evidence with plant-translocation and mature-tree studies; identify what monitoring
  would demonstrate survival and recovery. Do not assess the permit's legal merits.
why_low_hanging: ERA's direct statement gives verifiable counts; the ecological outcome needs independent, species-specific
  follow-up data.
