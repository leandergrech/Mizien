id: CC-016
title: 'Shore-to-ship: 90% less harbour pollution'
category: Air
subtopic: Port & power emissions
status: Drafted
verdict: Misleading
verdict_confidence: Moderate
claim:
  text: 'Infrastructure Malta (Shore-to-Ship project page, 1 Dec 2023): the Grand Harbour shore-to-ship initiative
    promises to slash 90% of air pollution in the Grand Harbour. Repeated at the inauguration (10 Jul 2024, cost given
    as EUR 33 million): completion means a 90% reduction, with 17,000 families around the harbour benefiting from
    cleaner air.'
  speaker: Infrastructure Malta; Prime Minister Robert Abela; Ministry for Transport
  date: '2023-12-01'
  wording_status: Verbatim found
  sources:
  - title: Shore-to-Ship
    publisher: Infrastructure Malta
    date: 1 Dec 2023
    url: https://www.infrastructuremalta.com/projects/shore-ship
    note: The claim, verbatim. Read in full 3 Oct 2026.
  - title: Grand Harbour shore-to-ship project completed, to cut down emissions by 90%
    publisher: TVMnews
    date: 10 Jul 2024
    url: https://tvmnews.mt/en/news/shore-to-ship-project-in-grand-harbour-completed-to-cut-down-emissions-by-90/
    note: Inauguration; reported speech (90%, 17,000 families, EUR 33m).
  - title: Cruise Ships Plugged in Grand Harbour Onshore Power Supply Only 9% of Time in First Year
    publisher: Amphora Media
    date: 17 Oct 2025
    url: https://www.amphora.media/2025/10/cruise-ships-shore-to-ship-power-malta
    note: 67 of 373 berths connected Jul 2024-Jul 2025, from Transport Malta FOI records (second-hand).
  - title: Grand Harbour Clean Air Project gets underway
    publisher: Infrastructure Malta
    date: 30 Nov 2020
    url: https://www.infrastructuremalta.com/news/grand-harbour-clean-air-project-gets-underway
    note: 'Basis of the 90%, read 5 Oct 2026: "will cut over 90% of the air pollution that cruise liners and Ro-Ro
      ships produce"; per liner on shore power NO2 -93%, PM -92.6%, SO2 -99.6%, CO2 -39.6%; EUR 49.9m (EUR 37m
      phase 1); NSO 372 cruise liners in 2019.'
  - title: First Grand Harbour Clean Air Project frequency converters in place
    publisher: Infrastructure Malta
    date: 19 Feb 2022
    url: https://www.infrastructuremalta.com/news/first-grand-harbour-clean-air-project-frequency-converters-place
    note: Read 5 Oct 2026. Repeats the scoped 90% ("cutting 90% of their air pollution"), EUR 49.9m and the
      per-liner cuts.
  quote: This initiative promises to slash 90% of air pollution in the Grand Harbour.
counter_evidence: 'Connection is voluntary until 1 Jan 2030 (Regulation (EU) 2023/1805 Art. 6); Transport Malta:
  connecting ''remains the prerogative of the shipping line''. Transport Malta FOI records (via Amphora Media):
  67 of 373 cruise berths (18%) plugged in from Jul 2024 to Jul 2025, 9% of berth time; MSC World Europa made 35
  of the 67; no stay of 2-4 days plugged in. Cruise calls rose from 357 (2024) to 385 (2025; calendar years, while
  uptake runs Jul-Jul). Infrastructure Malta''s own 2020-2023 pages scope the 90% to the pollution cruise liners and
  Ro-Ro ships produce, with per-liner cuts on shore power of NO2 -93%, PM -92.6%, SO2 -99.6%, CO2 -39.6% (study not
  cited); the 2023 project page dropped that scope. Research context: hotelling is >90% of cruise CO2 in port
  (Mocerino et al. 2026); manoeuvring emissions remain (Gagic et al. 2022). Cost stated as EUR 33m (launch), 37m
  (phase 1) and 49.9m (whole project). No harbour air-quality study before and after.'
tests: Transport Malta connection records (FOI, via Amphora Media); Valletta Cruise Port traffic; FuelEU Maritime
  Art. 6; peer-reviewed cruise emission inventories.
why_low_hanging: 'Done: Claim Check 016 report and flyer.'
tags:
- Conditional-turned-unconditional
tags_provisional: false
priority: Done (v1.1)
data_readiness: Medium
caveats: Right of reply to Infrastructure Malta and Transport Malta not yet sent. Connection figures second-hand
  (FOI reply not public); no later data than Jul 2025; no air-quality measurement either way. The per-liner cuts
  are Infrastructure Malta's own estimates. v1.1 (5 Oct 2026) made corrections only; verdict unchanged.
