claim:
  text: 'UNESCO World Heritage Committee (Decision 47 COM 7B.114, City of Valletta, 47th session, 2025): notes with concern that the current planning policies and regulations do not sufficiently safeguard the setting of the property; requests revision of the Views and Vistas Analysis and three planning documents to establish effective height controls within and around the property, further development of the buffer zone proposal, and an updated state of conservation report by 1 December 2026.'
  speaker: UNESCO World Heritage Committee
  date: 2025-07
  wording_status: 'Verbatim found'
