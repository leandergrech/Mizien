counter_evidence: "No evidence against the claim: ten phrases of the claim are in the adopted decision, and the adopted text equals the draft in the Committee's document apart from one comma (data/cc-116/checks.csv). The decision has no request about the List of World Heritage in Danger (0 mentions). The Opposition's message that status was at risk and the Ministry's message that there was no other cause for concern (both second-hand) each go beyond the text. Malta's planning policies were not tested against the finding."
tests: "Decision text and the Committee's working document (tools/cc-116-report/calc.py). Not done: the 2014 Floor Area Ratio guide, local plans and ICOMOS's review of the Views and Vistas Analysis (the Planning Authority site refuses automated access; the review is not published with the document)."
