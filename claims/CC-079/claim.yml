claim:
  text: 'WasteServ (ECOHIVE news, 26 Jun 2023): the Magħtab waste-to-energy plant "will be treating around 192,000 tonnes
    of non-recyclable waste generated locally" and "is expected to meet around 4.5% of Malta''s total energy needs". In
    October and November 2020 WasteServ wrote that the plant would add "an impressive 4.5% as green energy to Malta''s
    total energy demand".'
