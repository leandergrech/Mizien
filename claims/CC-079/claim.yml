data_readiness: 'High: Eurostat API, WasteServ''s ECOHIVE site and the Commission-hosted NECP readable; gov.mt, parlament.mt,
  ERA and MaltaToday return 403.'
caveats: 'Misleading: pending right of reply from WasteServ; must not be circulated beyond the site before the reply
  deadline. The claim record''s earlier text joined figures from several documents; the rated wording is WasteServ''s own
  (26 Jun 2023, with the 2020 wording for "green energy" and the project page for 126 GWh and 40%). WasteServ published no
  method for the 4.5%; every plausible reading was tested. The plant has not been built and its design may change; its EIA
  was not read (no readable copy found), so the calorific value and heat use come from the NECP, whose heat-input figure
  does not say whether it is per line (both readings tested). The Minister''s January 2025 parliamentary answer, reported
  by Amphora Media, is the outlet''s paraphrase and is not rated. Journal studies were read as abstracts; the Swiss
  biogenic shares are context only. The NECP''s Figure 120 legend is ambiguous: only the total of its slices is used.'
