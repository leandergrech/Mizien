counter_evidence: 'WasteServ''s own output figure for the plant is 126 GWh of electricity a year (project page); the NECP
  design (2 lines x 12 t/h, 14-16 MW net) gives 112-128 GWh at the 8,000 full-load hours that 192,000 t implies, and a net
  efficiency of 23.6% (design calorific value 10 GJ/t, read per line), within the 20-24% Lombardi et al. (2015) give for
  small-medium plants. 126 GWh was 4.4-4.7% of Malta''s electricity use in 2022 (inland demand 2,880 GWh; final
  consumption 2,698 GWh) and 4.1-4.4% in 2024, but 1.5% of final energy consumption (FEC_EED, 8,136 GWh), 1.8% of final
  energy use without international aviation, 1.2% of primary energy consumption and of gross inland consumption, and 0.4%
  of gross available energy (2022; 2024: 1.5%, 1.8%, 1.2%, 1.1%, 0.4%). On the NECP''s 2030 projections it is 3.2% of
  electricity supply (3,951 GWh), 1.3% of final and 1.1% of primary energy consumption. 126 GWh is exactly 4.5% of
  2,800 GWh (241 ktoe), against Malta''s 964 ktoe gross inland consumption in 2024. The only total-energy reading near
  4.5% counts the waste''s whole energy content (533 GWh): 5.0-5.2% of primary energy consumption 2022-2024, though the
  plant would deliver under a quarter of it as electricity and no heat user is named. EU law counts only the
  biodegradable fraction of waste as renewable (Directive 2018/2001, Art. 2(24)), and the NECP says the plant "is not
  expected to contribute to Malta''s RES share". In the speaker''s favour: the tonnage matches the NECP design and the
  Commission''s 190,000 t; Malta landfilled 255 kt of municipal waste in 2024 (192 kt = 75%); 4.5% is a fair figure for
  electricity. Against the capacity: meeting the 2035 recycling target (65%) at 2024 generation would leave at most 124 kt
  of municipal waste for burning or landfill. The project page''s "40% of non-recyclable waste" implies 480 kt, which
  no published statistic matches (192 kt is 67-75% of waste landfilled, 32% of all non-mineral waste generated in 2022).'
tests: Eurostat nrg_bal_c and nrg_cb_e (Malta, 2010-2024) for every reading of "total energy needs" (electricity, final,
  primary, gross inland, gross available energy); the NECP's design figures and 2030 projections; env_wasmun, env_wastrt
  and env_wasgen for the tonnage; literature on electrical efficiency and the biogenic share of burnt waste. Recomputed in
  tools/cc-079-report/calc.py (data/cc-079/checks.csv).
