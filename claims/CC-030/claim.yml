verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Malta International Airport: it has reached carbon neutrality (ACA Level 3+) and its EUR 12.5m airfield
    electrification will avoid 1,000 tonnes of CO2 a year.'
  speaker: Malta International Airport plc
  date: '2026-05-25'
  wording_status: Verbatim found
  sources:
  - title: Airfield electrification at MIA set to avoid 1,000 tonnes of carbon dioxide emissions every year
    publisher: The Malta Independent
    date: 25 May 2026
    url: https://www.independent.com.mt/articles/2026-05-25/local-news/Airfield-electrification-at-MIA-set-to-avoid-1-000-tonnes-of-carbon-dioxide-emissions-every-year-6736289990
    note: Locates the claim (not readable from the cloud network; the company's own release was used).
  - title: Airfield electrification at MIA set to avoid 1,000 tonnes of CO2 emissions annually
    publisher: Malta International Airport plc
    date: 25 May 2026
    url: https://maltairport.com/corporate-news/airfield-electrification-at-mia-set-to-avoid-1000-tonnes-of-co2-emissions-annually/
    note: Primary text (press release, read in full 5 Oct 2026).
  - title: Sustainability Report 2025
    publisher: Malta International Airport plc
    date: '2026'
    url: https://maltairport.com/app/uploads/2026/10/Final_MIA26-Sustaibability.pdf
    note: Scope 1-3 tables, 5,450 t of credits, PwC Malta limited assurance on Scope 1 and 2 (read, 5 Oct 2026).
  quote: Malta International Airport is implementing a €12.5 million Airfield Electrification Programme, which is set to avoid the emission of an average of 1,000 tonnes of carbon dioxide annually.
counter_evidence: Level 3+ covers Scope 1, Scope 2 and business travel only, so 99.3% of the reported 2025 footprint (738,308 t,
  mostly aircraft) is outside the neutral boundary; credits cover 0.74% of it. Scope 1 + 2 is 22% below 2015 and rose
  8% in 2025 (company target -65% by 2030). The avoided tonnes fall in Scope 3, and the release gives no method, baseline
  or grid-emissions treatment, so gross or net is unknown. Padhra (2018) shows the saving depends on what is replaced.
tests: ACA scope definitions; MIA Sustainability Report 2025 (GRI 102 tables, assurance statement, offset appendix); order-of-magnitude inversion of the 1,000 t figure; Crossref-verified ground-power literature.
why_low_hanging: A specific, attributable statement that public data can test.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: Company-reported figures; only Scope 1 and 2 carry limited assurance (PwC Malta). The ACA directory and the carbon-credit
  registries were behind bot walls and not consulted; credit quality not assessed. Aircraft movements for 2025 (65,470) are
  second-hand. Emission rates in the plausibility figure are illustrative assumptions. The Malta Independent article was not
  readable from the cloud network.
