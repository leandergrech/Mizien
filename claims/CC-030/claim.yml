id: CC-030
title: Carbon-neutral airport
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Malta International Airport plc, across several of its own documents: its EUR 12.5 million Airfield Electrification
    Programme "is set to avoid the emission of an average of 1,000 tonnes of carbon dioxide annually" (press release,
    25 May 2026); and it has reached carbon neutrality, moving up to ACA "Level 3+ (neutrality)" in 2025 (At a Glance
    page and company announcements, 2026; Sustainability Report 2025, p. 31), as its Facts and Figures page had set
    as a target ("Reaching carbon neutral status in 2025"). The 25 May release itself does not mention neutrality or ACA.'
  speaker: Malta International Airport plc
  date: '2026-05-25'
  wording_status: Verbatim found
  sources:
  - title: Airfield electrification at MIA set to avoid 1,000 tonnes of carbon dioxide emissions every year
    publisher: The Malta Independent
    date: 25 May 2026
    url: https://www.independent.com.mt/articles/2026-05-25/local-news/Airfield-electrification-at-MIA-set-to-avoid-1-000-tonnes-of-carbon-dioxide-emissions-every-year-6736289990
    note: Locates the claim (not readable from the cloud network; the company's own release was used).
  - title: Airfield electrification at MIA set to avoid 1,000 tonnes of CO2 emissions annually
    publisher: Malta International Airport plc
    date: 25 May 2026
    url: https://maltairport.com/corporate-news/airfield-electrification-at-mia-set-to-avoid-1000-tonnes-of-co2-emissions-annually/
    note: Primary text for the programme and the 1,000 t (press release, read in full 5 Oct 2026). Does not mention
      neutrality or ACA.
  - title: Facts and Figures
    publisher: Malta International Airport plc
    date: 18 Aug 2025
    url: https://maltairport.com/corporate/our-airport/facts-and-figures/
    note: 'Webpage (last modified 18 Aug 2025; read 5 Oct 2026). Lists two interim targets of the Net Zero Carbon Plan:
      "Reaching carbon neutral status in 2025" and "Reducing its emissions by 65% by 2030 when compared to 2015".'
  - title: At a Glance
    publisher: Malta International Airport plc
    date: 2 Sep 2026
    url: https://maltairport.com/corporate/our-airport/at-a-glance/
    note: 'Webpage (last modified 2 Sep 2026; read 5 Oct 2026): efforts to reduce direct emissions and offsets "allowed
      Malta International Airport to move up a level of ... (ACA) programme, to Level 3+ (neutrality)". The same
      sentence is in company announcements, e.g. 495/2026 of 24 Aug 2026.'
  - title: Company announcement 495/2026 (share buyback, week ended 21 August)
    publisher: Malta International Airport plc
    date: 24 Aug 2026
    url: https://maltairport.com/app/uploads/2026/08/MIA-CoAnn-495-2026-Buyback-Week-Ended-21-August.pdf
    note: Company description carries the "Level 3+ (neutrality)" sentence (read 5 Oct 2026).
  - title: Sustainability Report 2025
    publisher: Malta International Airport plc
    date: '2026'
    url: https://maltairport.com/app/uploads/2026/10/Final_MIA26-Sustaibability.pdf
    note: 'p. 31: progression to Level 3+ "having satisfied criteria related to the reduction of direct emissions and
      the offsetting of residual emissions, namely 5,450 tonnes of carbon dioxide". Scope 1-3 tables pp. 124-127,
      criteria pp. 90-91 and 96-97, PwC Malta limited assurance on Scope 1 and 2 pp. 112-113, offset certificate
      pp. 140-141 (read in full, 5 Oct 2026). Never says "carbon neutral".'
  quote: Malta International Airport is implementing a €12.5 million Airfield Electrification Programme, which is set to avoid the emission of an average of 1,000 tonnes of carbon dioxide annually.
counter_evidence: 'v1.1: Neutrality holds as ACA defines it and is independently confirmed (ACA directory entry and
  notice; 3,780 of the 5,450 t of credits retired for MIA in the Gold Standard and Rainbow registries; third block
  not found), but covers Scope 1, Scope 2 and business travel only: 0.7% of the reported 2025 footprint (Scope 3 is
  99.3%; 95.3% on the 2024 basis). The 1,000 t a year has no published method, baseline or grid treatment. On the one
  sourced diesel GPU rate (about 25 kg CO2 an hour; Fleuti 2006 via Padhra 2018, second-hand) it needs about 40,500
  GPU-hours a year (74 min at every turnaround); a GPU at every turnaround for 22.5 min gives about 300 t gross. 1,000 t
  needs APU or e-bus/equipment savings MIA has not shown. Scope 1 + 2 is 22% below 2015 (target -65% by 2030);
  Scope 1 rose 94% in 2025 while fuel use rose 30%.'
tests: ACA Level 3+ rules, directory entry and notice; Gold Standard and Rainbow registries; CINEA AFIF list of selected
  projects; MIA Sustainability Report 2025 (GRI 102-103 tables, reporting criteria, assurance, offset certificate);
  inversion of the 1,000 t against Padhra (2018) and IPCC default fuel factors (tools/cc-030-report/calc.py).
why_low_hanging: A specific, attributable statement that public data can test.
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.1)
data_readiness: Medium
caveats: Company-reported figures; only Scope 1 and 2 carry limited assurance (PwC Malta). ACA's directory and notice
  were read through the website's public interface, not the certificate; credit quality not assessed; one of three
  credit blocks (1,670 t, Canada) not found in the registries. The only sourced diesel GPU rate (7.74 kg of fuel an
  hour) is second-hand (Fleuti 2006 via Padhra 2018) and from one airport in 2004, so the 1,000 t inversion is
  indicative. The Malta Independent article was not readable from the cloud network.
