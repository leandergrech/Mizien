id: CC-141
title: 'Pre-Budget Document: Malta has the lowest fertility rate in the EU'
category: Tourism & Population
subtopic: Population & labour
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'Ministry for Finance, Pre-Budget Consultation Document 2027 (September 2026, launched 30 Sep 2026), Minister''s foreword,
    p. 6 (PDF p. 8): ''Malta''s fertility rate is the lowest in the EU27, while an ageing population will continue to place
    pressure on pensions, healthcare and long-term care in the years ahead.'' Section 5.2 (p. 97) adds: ''Malta registered
    the lowest total fertility rate among the European Union Member States in 2024, at 1.01 live births per woman, compared
    with the EU average of 1.34''.'
  speaker: Ministry for Finance (Pre-Budget Document 2027)
  date: '2026-09-30'
  wording_status: Verbatim found
  sources:
  - title: Pre-Budget Consultation Document 2027
    publisher: Ministry for Finance
    date: '2026-09-30'
    url: https://finance.gov.mt/wp-content/uploads/2026/09/PRE-BUDGET-2027-DOC.pdf
    note: The claim. finance.gov.mt refuses scripts; full PDF (156 pp.) read from the maintainer's browser copy on 16-17 Nov
      2026 (sha256 in archive/manifest.csv). Foreword signed by Clyde Caruana, Minister of Finance.
  quote: Malta's fertility rate is the lowest in the EU27
counter_evidence: 'Eurostat demo_find (updated 13 Nov 2026): Malta''s total fertility rate was 1.01 in 2024, the lowest of
  the 27 Member States (Spain 1.10, Lithuania 1.11), and Malta has been lowest in every year from 2017 to 2024 (gap to second
  0.03-0.09). From 2001 to 2016 it ranked 3rd to 18th from the bottom. Eurostat Statistics Explained gives the EU-27 rate
  as 1.34 in 2024 (the API flags the EU-27 value for 2022-2024 as not for publication). The foreword gives no year; the
  document''s section 5.2 gives 2024 and figures that match Eurostat.'
tests: Eurostat demo_find (total fertility rate) for all Member States, 2000-2024, ranked by year; Eurostat Statistics Explained
  for the EU-27 figure. The second half of the sentence (ageing and pressure on services) is not tested.
why_low_hanging: A single ranking against one Eurostat table.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: Eurostat API reachable; the document from the maintainer''s browser copy.'
caveats: 'Supported: no right of reply needed. Only the ranking is tested. Eurostat''s 2024 figures may be revised and 2025
  is not yet published. The total fertility rate is a period measure.'
