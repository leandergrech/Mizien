caveats: Draft pending right of reply (Environment Ministry; WasteServ). The ministry may hold operational data
  that explain the 412 figure; 2025 statistics not yet published. The link between the deposit refund scheme and
  the 2023 packaging jump is our inference; the scheme's 78% collected and 74% recycled (2023) are reported by the
  Commission from ERA and were not recomputed.
