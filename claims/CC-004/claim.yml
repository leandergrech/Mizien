claim:
  text: 'Ministry for the Environment (19 Jan 2026): Malta continues to make strong progress in waste management;
    mixed waste down over 30% to 95.5 million kg; about 412 million kg diverted from landfill over five years; the
    Long-Term Waste Management Plan is working.'
