id: CC-004
title: '''Strong progress'' in waste separation'
category: Waste
subtopic: Recycling & separation
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Ministry for the Environment (19 Jan 2026): Malta continues to make strong progress in waste management;
    mixed waste down over 30% to 95.5 million kg; about 412 million kg diverted from landfill over five years; the
    Long-Term Waste Management Plan is working.'
  speaker: Ministry for the Environment, Energy and Public Cleanliness (Minister Dalli); WasteServ
  date: '2026-01-19'
  wording_status: Verbatim found
  sources:
  - title: Malta records strong progress in waste separation
    publisher: gov.mt press release
    date: 19 Jan 2026
    url: https://www.gov.mt/en/Government/DOI/Press%20Releases/Pages/2026/01/19/PR260072en.aspx
    note: The claim. Read in full in a browser on 2 Oct 2026 (site blocks automated access).
  - title: Malta records strong progress in waste separation (Public Service)
    publisher: publicservice.gov.mt
    date: 23 Jan 2026
