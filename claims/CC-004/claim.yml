  quote: Malta continues to make strong progress in waste management
counter_evidence: Municipal recycling rate 16.7% in 2024 (EU 48.1%; 2025 target 55%); 79% of treated municipal waste
  landfilled. The EU Environmental Implementation Review 2025 says Malta missed the 2020 target by a large margin
  and is on course to miss 2025. The 412 million kg cannot be reconciled with Eurostat (271 kt recycled or recovered,
  2020-24); the 141 million kg baseline has no year. (ERA's 68% figure is explicitly for construction waste and
  is not part of this claim.)
tests: Eurostat cei_wm011, env_wasmun, cei_wm020; NSO releases; Directive (EU) 2018/851 Art 11a.
