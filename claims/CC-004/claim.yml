  quote: Malta continues to make strong progress in waste management
counter_evidence: Municipal recycling rate 16.7% in 2024 (EU 48.1%; 2025 target 55%), second-lowest of the 20
  states with 2024 data; 79% of treated municipal waste landfilled. The Commission's 2023 early-warning report lists
  Malta among 10 states at risk of missing both 2025 targets and 13 far from the 2035 landfill target; its 2025
  review says Malta missed the 2020 target by a large margin and is on course to miss 2025. Malta notified a
  postponement in December 2023 and renounced it in November 2024. Treated biowaste is used for landscaping and
  landfill remediation and reported as landfilled. The 412 million kg cannot be reconciled with Eurostat (271 kt
  recycled or recovered, 2020-24); the 141 million kg baseline has no year. In fairness, the rate rose 7.6 points
  2019-2024 (4th-largest rise of 20 EU states) and packaging recycling rose from 30.8% to 43.4% in 2023. (ERA's 68%
  figure is explicitly for construction waste and is not part of this claim.)
tests: Eurostat cei_wm011 (Malta and all EU-27), env_wasmun, cei_wm020; NSO releases; Directive (EU) 2018/851
  Art 11a; Commission COM(2023) 304, SWD(2023) 195 and SWD(2025) 318.
