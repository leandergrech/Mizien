priority: Queue
data_readiness: 'Medium: The Shift is readable; PA application registers may be browser-only; NSO and Eurostat are reachable.'
caveats: Candidate from the weekly intake of 11 Oct 2026. The claimant is a news outlet reporting its own analysis; its method
  is not stated in the text read. Applications are not approvals. Related to CC-085, CC-089 and CC-083 in subject.
