    text: "Context: 2022 Deloitte study, 4.7 million tourists a year by 2027 at under seven nights"
    finding: "The outlet’s paraphrase of a study checked in CC-085, which found 4.7 million is a bed-filling scenario at 2019 occupancy; not rated here."
    rating: "Not rated"
    tone: grey
