id: CC-152
title: 'ERA: Malta at significant risk of missing its 2030 nitrogen-oxide ceiling'
category: Air
subtopic: Air quality & health
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'Environment and Resources Authority, draft First Update of Malta''s National Air Pollution Control Programme (consultation
    5 Jun-17 Jul 2026), section 3.1 (PDF p. 14): ''Currently, Malta meets all the emission reduction commitments for 2020
    based on the estimated emissions for the year 2023. However, projections reported in 2025 indicate a significant risk
    of non-compliance with the NOx ceiling for 2030.'' Table 4 (PDF p. 63): NOx projected at 3.88 kt in 2030 (With Measures)
    against a 2030 ceiling of 1.98 kt; road transport 42.6% and national navigation 15.5% of NOx in 2023. Reported by Italpress/Malta
    News Agency on 17 Jul 2026.'
  speaker: Environment and Resources Authority (ERA)
  date: '2026-06-05'
  wording_status: Verbatim found
  sources:
  - title: First Update of Malta's National Air Pollution Control Programme (NAPCP), consultation draft
    publisher: Environment and Resources Authority
    date: '2026-06-05'
    url: https://era.org.mt/first-update-of-maltas-national-air-pollution-control-programme-napcp/
    note: The claim in ERA's own words. era.org.mt refuses scripts; 102-page draft and the consultation page read from the
      maintainer's browser copies on 17 Nov 2026 (sha256 in archive/manifest.csv).
  - title: Malta at risk of missing 2030 NOx emissions target, ERA warns
    publisher: Italpress (Malta News Agency)
    date: '2026-07-17'
    url: https://www.italpress.com/?p=716573
    note: Reports the programme in the agency's own words (its quotation marks are not ERA's).
  quote: projections reported in 2025 indicate a significant risk of non-compliance with the NOx ceiling for 2030
counter_evidence: 'Directive (EU) 2016/2284 Annex II (EUR-Lex, read 17 Nov 2026): Malta NOx -42% (2020-2029) and -79% (from
  2030) on 2005, the second-steepest after Luxembourg (83%); on ERA''s 2005 base of 9.45 kt the 2030 ceiling is 1.98 kt (Eurostat''s
  later base 9.62 kt gives 2.02). ERA''s With Measures projection 3.88 kt is 1.96 times the ceiling; the With Additional Measures
  scenario still leaves NOx ''almost double''. Eurostat env_air_emis: NOx fell from 9.70 kt (2008) to 4.59 kt (2017) and has
  stayed at 4.12-4.58 kt since (4.43 kt in 2024); road transport 41.4% and national navigation 15.3% of NOx in 2023 (ERA:
  42.6% and 15.5%). A regulator''s warning against its own country''s interest.'
tests: Directive (EU) 2016/2284 Annex II; ERA's draft NAPCP Tables 1 and 4; Eurostat env_air_emis NOx total and by sector.
why_low_hanging: A legal ceiling and ERA's own projection can both be read and recomputed.
tags: []
