    rating: "Consistent with research"
    tone: green
  - id: CC-001C
    text: "Concrete directly on the roots has since been removed"
    said_by: "Times of Malta / Ambjent"
    finding: "The photo and caption show concrete cleared from directly around the trunk, leaving a mound of loose soil and stone. Root and bark condition after removal is not reported."
    rating: "Partly verified"
    tone: amber
  - id: CC-001D
    text: "Ambjent made every effort to save old trees"
    said_by: "FWA (Times of Malta)"
    finding: "No method statement, root-protection plan or arborist report seen."
    rating: "Unverified"
    tone: grey
