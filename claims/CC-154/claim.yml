id: CC-154
title: 'Commission: Malta''s finch-trapping derogation ''remains in breach of EU law'''
category: Nature & Wildlife
subtopic: Hunting & birds
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'European Commission (DG Environment, letter to BirdLife Malta, Ref. Ares(2025)8980114, signed by Nicola Notaro, e-signed
    24 Oct 2025; Italpress dates it 27 Oct): the Commission ''did not endorse'' Malta''s finch-trapping derogation framework; its
    February 2025 request that Malta implement the Court ruling in C-23/23 ''still stands''; its services are ''currently
    assessing'' the new ''research derogation'' adopted on 17 Oct 2025; and it ''may decide to take additional enforcement
    steps such as referring Malta back to the Court of Justice''. Italpress headline: the derogation ''remains in breach of
    European Union law'' (the outlet''s wording, not in the letter).'
  speaker: European Commission
  date: '2025-10-27'
  wording_status: Verbatim found
  sources:
  - title: EU Commission, Malta's finch trapping still breaches EU law
    publisher: Italpress (MNA)
    date: '2025-11-02'
    url: https://www.italpress.com/?p=598716
    note: 'Locates the claim; indirect speech. The words ''remains in breach of European Union law'', ''remains valid'' and ''may refer the case back to the ECJ'' are the outlet''s, not the letter''s. Read in full 9 Nov 2026.'
  - title: Letter to BirdLife Malta, Ref. Ares(2025)8980114 (DG Environment, Nicola Notaro)
    publisher: European Commission (copy published by BirdLife Malta)
    date: '2025-10-24'
    url: https://birdlifemalta.org/wp-content/uploads/2025/10/Ares20259162948.pdf
    note: 'The speaker''s own words. Full text read 9 Nov 2026; e-signed 24 Oct 2025.'
  - title: 'Case C-23/23, Commission v Malta, judgment of 19 Sep 2024'
    publisher: Court of Justice of the EU (EUR-Lex)
    date: '2024-09-19'
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62023CJ0023
    note: Operative part read.
  quote: That request still stands.
counter_evidence: 'The letter does not say the derogation "remains in breach"; it says the Commission did not endorse the framework,
  that the new derogation "seems similar" to the 2024 one, and that it is "currently assessing" it. The Government''s reasoning for
  the 17 Oct 2025 rules was not read. BirdLife Malta reports a new formal notice INFR(2025)2128 of 21 Nov 2025 (second-hand);
  not read.'
tests: 'Done: letter compared word for word with Italpress and BirdLife Malta; CJEU C-23/23 operative part read. Not tested - the 17 Oct 2025 rules against Art. 9 of Directive 2009/147/EC (rules not read).'
why_low_hanging: The letter, the judgment and the infringement register are public documents.
tags:
- Conditional-turned-unconditional
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: Italpress readable; EUR-Lex may be refused (use curia/ec.europa.eu or the Representation in Malta pages);
  the Commission''s own letter is not published, so the check rests on Italpress''s direct quotation unless BirdLife supplies
  the letter.'
caveats: 'Rated on the Commission''s own letter, read in BirdLife Malta''s published copy (not a Commission copy; the PDF file name carries
  a different Ares number from the reference printed in the letter). The record''s quoted phrases came from Italpress, not the letter;
  the claim was restated. Letter date: signature line 24 Oct 2025, Italpress 27 Oct (unexplained). The 17 Oct 2025 rules, the
  Government''s position and the November 2025 formal notice (known only from BirdLife Malta) were not read. Hunting-related: the
  statement is rated, not hunters or NGOs. No right of reply needed.'
