counter_evidence: "Table 1 gives 457,403 (end 2025) and 460,648 (end Mar 2026): +3,245 over 90 days = 36.06 a day, by NSO\
  \ note 7. Categories sum to totals in all 13 quarters. Gross: 5,680 newly licensed (63 a day), 6,963 restricted, 4,140 restrictions\
  \ ended; NSO's note-6 flow identity gives +2,857 (31.7 a day), 388 below the stock difference (cut-off dates). Pace is recent:\
  \ 9 and 8 a day in H1 2024, 19 in Q1 2025, then 37, 36, 35, 36; 32 a day over calendar 2025. Commission's 35 matches Q4\
  \ 2025 (35.5). The claim record's Newsbook link reports Q3 2025 (454,138; also 36 a day)."
