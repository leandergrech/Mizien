caveats: 'Supported verdict: no right of reply needed. The claim text was restated from the Commission''s own wording;
  "missing its target" (the intake''s paraphrase) is not rated. Projections are Malta''s March 2025 submission as held
  by the EEA; 2024 emissions are approximated. Whether Malta will buy allocations, and at what cost, is not public.'
