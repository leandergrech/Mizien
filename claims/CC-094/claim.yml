  quote: Malta’s gap to target is 49 and 61 percentage points, exceeding its 19% reduction target. This means Malta
    is projected to emit more in 2030 than in 2005.
counter_evidence: 'Reproduced. Malta''s March 2025 projections (EEA) give 1,323.8 kt with planned measures and 1,450.1
  kt with existing ones in 2030, against the legal 2005 level of 1,020.6 kt: +29.7% and +42.1%, gaps of 48.7 and 61.1
  points to -19%. Above 2005 against every 2005 figure (EEA estimate 1,007.4 kt; 2013-2020 base year 1,116.1 kt: +18.6%
  at least) and with projections re-based on reviewed 2023 emissions (+26% / +38%). 2024 approximated emissions +40.8%
  (1,437 kt); over the yearly limit by 220, 257 and 301 kt in 2022-2024. Gap ranking with planned measures: Malta 48.7,
  Ireland 20.3, Germany 13.2 points (in tonnes Malta 0.5 Mt, Germany 64 Mt). Context and the other side: 2021-2030 balance
  -2.09 Mt (planned measures); the ETS flexibility (0.51 Mt) and the maximum land-use credit (0.03 Mt) leave 1.55 Mt to
  buy from other Member States (about 1% of the 125-175 Mt EU surplus) or cut; no safety reserve for Malta (Decision
  2023/863). The Commission says it "cannot, at this stage, conclude" that Member States are not making sufficient
  progress. Malta''s plan says
  the target rests on 2005 forecasts overtaken by population growth (the -19% was in fact set in 2018 on the basis of
  GDP per capita, with 2005 as the base year; population +41% to 2024; effort-sharing emissions per person flat at 2.53
  t), and EU law (Regulation 2023/857) accepts the target is above Malta''s cost-effective potential. "Missing
  its target" was the intake''s paraphrase, not the Commission''s wording.'
tests: EEA effort-sharing emissions 2005-2024 and GHG projections (2025 and 2023 submissions) for Malta and all EU-27;
  2005 levels, targets, allocations and flexibilities from Regulations (EU) 2018/842 and 2023/857 and Implementing Decisions
  (EU) 2020/2126, 2024/1884 and 2026/895; Commission SWD Tables 25-26; recomputed in tools/cc-094-report/calc.py.
