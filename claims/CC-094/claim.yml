id: CC-094
title: 'Commission: Malta to emit more in 2030 than in 2005'
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'European Commission (EU Climate Action Progress Report 2025, COM(2025) 668, 6 Nov 2025): before any use of
    flexibilities, Malta''s projected 2030 effort-sharing emissions leave a gap of 49 and 61 percentage points to its
    19% reduction target, so Malta "is projected to emit more in 2030 than in 2005"; Malta is among the Member States
    with the largest projected gaps and (after banking, borrowing and the ETS flexibility) is projected to have excess
    emissions in 2026-2030. The Commission adds that, given the EU-wide surplus, it "cannot, at this stage, conclude"
    that Member States, taken together, are not making sufficient progress.'
  speaker: European Commission
  date: '2025-11-06'
  wording_status: Verbatim found
  sources:
