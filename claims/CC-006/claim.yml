counter_evidence: A peer-reviewed analysis finds more birds are taken in autumn than spring, and the spring
  take equals about 2.4-4.4% of Europe's turtle doves. EU Court rulings (2018, 2024) concern illegal trapping
  and hunting.
tests: The legal 'no satisfactory alternative' and 'small numbers' tests against IUCN and population data.
why_low_hanging: Rich peer-reviewed literature; recurs every spring. Publish before the 2027 decision.
