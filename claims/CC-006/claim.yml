id: CC-006
title: Spring hunting derogation
category: Nature & Wildlife
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: Malta’s 2026 spring-hunting derogation met the Birds Directive’s “small numbers” and strict-supervision
    conditions, with quotas of 2,400 Quail and 1,500 Turtle-doves.
  speaker: Government of Malta, applying Directive 2009/147/EC
  date: '2026-03-30'
  wording_status: Verbatim found
  sources:
  - title: 'Environmental Implementation Review 2025: Malta'
    publisher: European Commission (OP)
    date: '2025'
    url: https://op.europa.eu/webpub/env/eir-country-reports-summaries/en/malta.html
  - title: Malta greenlights 2026 spring hunting season
    publisher: CABS (Committee Against Bird Slaughter)
    date: 1 Apr 2026
    url: https://www.komitee.de/en/latest-news/news/malta-green-light-spring-hunting/
  - title: Spring hunting for turtle dove set to return after Ornis votes in favour
    publisher: MaltaToday
    date: n/d
    url: https://www.maltatoday.com.mt/environment/environment/115708/spring_hunting_for_turtle_dove_set_to_return_after_ornis_votes_in_favour
  - title: The importance of spring hunting in Malta on European Turtle-Dove and Common Quail populations
    publisher: Humboldt-Universität zu Berlin (edoc)
    date: n/d
    url: https://edoc.hu-berlin.de/18452/26405
  - title: Conservation of Wild Birds (Declaration on a Derogation for a 2026 Spring Hunting Season for Quail)
      Regulations, 2026 (L.N. 80 of 2026)
    publisher: Government of Malta
    date: 30 March 2026
    url: https://legislation.mt/eli/ln/2026/80/eng
    note: Regulation 3 defines small numbers; regulation 4 calculates 1% of total annual mortality as 2,416.
  - title: Conservation of Wild Birds (Declaration on a Derogation for a 2026 Spring Hunting Season for Turtle Dove)
      Regulations, 2026 (L.N. 81 of 2026)
    publisher: Government of Malta
    date: 30 March 2026
    url: https://legislation.mt/eli/ln/2026/81/eng
    note: Regulation 3 defines small numbers; regulation 4 calculates 1% of total annual mortality as 2,510.
  - title: Directive 2009/147/EC on the conservation of wild birds, Article 9(1)(c)
    publisher: European Parliament and Council
    date: 30 November 2009
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0147
  - title: Conservation Status of Common Quail and European Turtle-dove, March 2026
    publisher: Wild Birds Regulation Unit
    date: March 2026
    url: https://wbru.gov.mt/wp-content/uploads/2026/04/Conservation-Status-of-Common-Quail-and-Turtle-Dove-Mar-2026.pdf
    note: Official status report presented to the Malta Ornis Committee on 30 March 2026; Article 12 submissions were provisional at publication.
  - title: Spring Hunting Derogations
    publisher: Wild Birds Regulation Unit
    date: '2026-10-03'
    url: https://wbru.gov.mt/en/resources/reports-and-statistics/sprin-hunting-derogations/
    note: Checked 3 October 2026; the latest listed season outcome report is for 2025. No 2026 outcome report is listed.
  - title: Ornis Committee
    publisher: Wild Birds Regulation Unit
    date: '2026-10-03'
    url: https://wbru.gov.mt/en/the-department/ornis-committee/
    note: Checked 3 October 2026; the public minutes archive lists meetings only through 2024, so 2026 minutes were not available there.
  quote: “Under strictly supervised conditions and on a selective basis ... in small numbers.”
counter_evidence: The 2025 WBRU outcome report documents enforcement activity and offences, but it cannot
  establish how the 2026 season was supervised. The 2026 season outcome report was not available at review.
tests: Compare each 2026 quota with the mortality benchmark calculated in the legal notices; assess what the
  rules and available enforcement evidence show about supervision; keep legal benchmark compliance separate
  from ecological sustainability.
why_low_hanging: 'Drafted: statutory benchmarks recomputed and report/flyer produced. Right of reply remains
  for the maintainer.'
