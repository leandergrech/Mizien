claim:
  text: The Ornis committee recommended a 2026 spring season (quail 13 Apr-3 May; turtle dove 20 Apr-3
    May) with bag limits of 1,500 turtle doves and 2,400 quail. Hunters describe it as strictly supervised
    and very small.
