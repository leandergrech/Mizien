claim:
  text: 'Climate Change Performance Index 2026, Malta country page (ccpi.org, read 18 Oct 2026): Malta ''ranks 25th in the
    CCPI, up nine spots and a medium performer'', with medium ratings for GHG emissions, energy use and climate policy and
    a low rating for renewable energy. The page says the country experts criticise ''the lack of concrete efforts to reduce
    greenhouse (GHG) emissions'', that automobile use ''has not decreased'' although public transport has been free since
    October 2022 for tallinja card holders, and that offshore wind has ''not moved beyond the planning stage''.'
  speaker: Climate Change Performance Index (CCPI)
  date: '2026'
  wording_status: Verbatim found
  sources:
  - title: 'Malta: Climate Performance Ranking 2026'
    publisher: Climate Change Performance Index (ccpi.org)
    date: '2026'
    url: https://ccpi.org/country/mlt/
    note: The claim. Country page read in full on 18 Oct 2026 (HTTP 200 to a scripted request). The page is undated; the 2026
      edition is the ranking year. National experts are anonymous (the page says they chose to remain anonymous).
  - title: Malta climbs nine places in climate change index but progress remains slow
    publisher: MaltaToday
    date: '2026'
    url: https://www.maltatoday.com.mt/category/national/535/
    note: Locates the claim (listing page; 403 to scripts). Not evidence.
  quote: Malta climbs nine places in climate change index but progress remains slow
counter_evidence: The index is a composite of emissions, renewables, energy use and a survey of anonymous national experts,
  so a rank change depends on other countries as well as Malta (not yet checked). MaltaToday reported that Malta had fallen
  five places to 34th in the 2025 index (reported; search summary). The page itself notes progress in solar and an increase
  in electric vehicles, and credits the 2024 founding of the Climate Action Authority. No Maltese government response to the
  2026 ranking was found.
tests: CCPI country page and methodology (ccpi.org/methodology); Eurostat road-vehicle stock and NSO licensed vehicles since
  2022 (is car use up or down?), NSO public transport passengers (CC-069); Eurostat nrg_ind_ren (renewable share) and EEA
  greenhouse-gas data for Malta; status of the offshore floating wind tender (CC-029); the energy-subsidy comparison in CC-022,
  CC-095 and CC-113.
why_low_hanging: A foreign index's own text with several parts that can be tested against Eurostat, NSO and EEA series.
