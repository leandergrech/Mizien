caveats: Candidate from the weekly intake of 18 Oct 2026. Claim made ABOUT Malta by a foreign research and advocacy index.
  The producers are not named on the country page read; confirm them on ccpi.org/about before reporting. The checkable parts
  are the sub-claims on car use, renewables and offshore wind; the rank itself is the index's own computation and can only
  be checked against its published method and scores. Related in subject to CC-018, CC-022, CC-024, CC-029, CC-119.
