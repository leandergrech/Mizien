id: CC-124
title: 'CCPI 2026: Malta 25th, car use not down'
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Climate Change Performance Index 2026, Malta country page (ccpi.org, read 18 Oct 2026): Malta ''ranks 25th in the
    CCPI, up nine spots and a medium performer'', with medium ratings for GHG emissions, energy use and climate policy and
    a low rating for renewable energy. The page says the country experts criticise ''the lack of concrete efforts to reduce
    greenhouse (GHG) emissions'', that automobile use ''has not decreased'' although public transport has been free since
    October 2022 for tallinja card holders, and that offshore wind has ''not moved beyond the planning stage''.'
  speaker: Climate Change Performance Index (CCPI)
  date: '2026'
  wording_status: Verbatim found
  sources:
  - title: 'Malta: Climate Performance Ranking 2026'
    publisher: Climate Change Performance Index (ccpi.org)
    date: '2026'
    url: https://ccpi.org/country/mlt/
    note: The claim. Country page read in full on 18 Oct 2026 (HTTP 200 to a scripted request). The page is undated; the 2026
      edition is the ranking year. National experts are anonymous (the page says they chose to remain anonymous).
  - title: Malta climbs nine places in climate change index but progress remains slow
    publisher: MaltaToday
    date: '2026'
    url: https://www.maltatoday.com.mt/category/national/535/
    note: Locates the claim (listing page; 403 to scripts). Not evidence.
  quote: Malta ranks 25th in the CCPI, up nine spots and a medium performer.
counter_evidence: 'Per head, car use is flat to slightly lower: cars per 1,000 residents fell from 585 (2022) to 571 (2025) and
  Eurostat''s estimated car share of passenger-km from 82.9% to 80.3% (2022 to 2024; estimates). Greenhouse-gas emissions per resident fell 11.6%
  from 2022 to 2024 (4.3 to 3.8 t CO2e, excluding LULUCF). Renewables rose 9.0 points from 2019 to 2024 (EU-27 5.4), and battery-electric cars are
  2.9% of the fleet, the same as the EU-27. The rank (34th to 25th, second-hand) depends on other countries and on an expert survey and was not
  reproduced.'
tests: CCPI country page and methodology (ccpi.org/methodology); Eurostat road-vehicle stock and NSO licensed vehicles since
  2022 (is car use up or down?), NSO public transport passengers (CC-069); Eurostat nrg_ind_ren (renewable share) and EEA
  greenhouse-gas data for Malta; status of the offshore floating wind tender (CC-029); the energy-subsidy comparison in CC-022,
  CC-095 and CC-113.
why_low_hanging: A foreign index's own text with several parts that can be tested against Eurostat, NSO and EEA series.
tags: []
tags_provisional: false
priority: Done (v1.0)
caveats: 'Claim made ABOUT Malta by a foreign research and advocacy index (CCPI, Germanwatch copyright notice on the page; authors not named on the
  country page; the national experts are anonymous). Mixed check: the testable statements (renewables, cars and road energy, electric cars, offshore wind) are rated;
  the rank, the experts'' judgement of "lack of concrete efforts" and the CCPI''s scores are not tested (the report PDF is behind a terms-of-use form). The 2025 rank
  (34th) is second-hand (Wikipedia, marked in the report). Car use is measured by proxies (cars registered, road-transport energy, Eurostat modal-split estimates),
  not vehicle-kilometres. No right of reply needed (verdict Largely supported). Related in subject to CC-018, CC-022, CC-024, CC-029, CC-119.'
