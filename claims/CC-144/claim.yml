priority: Queue
data_readiness: 'Medium: Mongabay readable; FACE and WBRU figures may need a browser.'
caveats: Candidate from the top-up intake of 26 Oct 2026. Foreign media. Test the density ranking only; make no claim about
  hunters as people.
