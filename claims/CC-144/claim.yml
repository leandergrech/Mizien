id: CC-144
title: 'Mongabay: Malta has the highest hunter density in Europe'
category: Nature & Wildlife
subtopic: Hunting & birds
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Mongabay (Spoorthy Raman, 5 Oct 2026), in the outlet''s own voice (not a quotation), reporting the shooting of migratory
    birds after the storm of 14 Sep 2026: ''Malta has the highest density of hunters in all of Europe.'' The sentence does
    not say density per what; it links to a 2015 paper in Biological Conservation (Veríssimo & Campbell, doi:10.1016/j.biocon.2015.07.018).
    The next sentence quotes Antonia Micallef of BirdLife Malta: ''Over 10,000 hunters [are] active at any one time.'''
  speaker: Mongabay
  date: '2026-10-05'
  wording_status: Verbatim found
  sources:
  - title: Hunters reportedly kill hundreds of migratory birds stranded by thunderstorm in Malta (Spoorthy Raman)
    publisher: Mongabay
    date: '2026-10-05'
    url: https://news.mongabay.com/short-article/2026/10/hunters-reportedly-kill-hundreds-of-migratory-birds-stranded-by-thunderstorm-in-malta/
    note: The claim. Read in full with curl on 26 Oct 2026 (HTTP 200); last modified 23 Oct 2026. The density sentence is
      the outlet's own, with a link to the 2015 paper; the incident figures are attributed to BirdLife Malta.
  quote: Malta has the highest density of hunters in all of Europe.
counter_evidence: 'Per km2 the claim holds: on FACE''s 2009-10 table (35 countries) Malta has 47.5 hunters per km2 (15,000
  hunters; Eurostat area 316 km2), 9.5 times the next country (Ireland 5.0); it stays first at 10,000 (31.6) or 5,000 (15.8)
  hunters. Per inhabitant it does not: 5th of 35 (36.2 per 1,000) behind Ireland 83.3, Finland 59.2, Cyprus 56.2, Norway 40.4;
  about 17.7 per 1,000 at 10,000 hunters. FACE''s table is 2009-10; no current official count was readable (WBRU reports 403).
  The WBRU 2025 figure of 10,091 land licences and a 2018 Statista/DJV per-capita chart are second-hand. The cited 2015 paper
  is closed access and was not read.'
tests: The 2015 Biological Conservation paper (verify via Crossref); FACE hunter census figures; Malta's Wild Birds Regulation
  Unit annual reports (hunting licences issued) and Eurostat land area and population; compute hunters per km2 and per 1,000
  people for EU and other European countries.
why_low_hanging: A ranking that can be recomputed from licence counts and land area.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium: Mongabay readable; FACE and WBRU figures may need a browser.'
caveats: 'No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading or
  Contradicted). Density ranking only; nothing about hunters as people or the legality of any shooting. The sentence does
  not state its denominator: per area is supported, per head is not. Comparison table is from 2009-10; Malta''s current count
  is NGO-sourced (BirdLife Malta via Mongabay) or second-hand.'
