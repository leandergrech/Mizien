claim:
  text: 'BirdLife Malta (LIFE Arċipelagu Garnija project page): Malta''s Yelkouan shearwater population is estimated at around
    1,600-1,800 pairs, about 10% of the global population.'
  speaker: BirdLife Malta
  date: n/d
  wording_status: Verbatim found
  sources:
    - title: LIFE Arċipelagu Garnija
      publisher: BirdLife Malta
      date: n/d
      url: https://birdlifemalta.org/arcipelagugarnija/
      note: The claim. Undated page (project 2016-2020); read 5 Oct 2026.
    - title: Malta Yelkouan Shearwater Species Action Plan 2022-2030 (page)
      publisher: Environment and Resources Authority
      date: n/d
      url: https://era.org.mt/malta-yelkouan-shearwater-species-ap-2022-2030/
      note: 1,795-2,635 pairs, 'around 10%'. Live site 403; Internet Archive copy of 8 Aug 2025.
    - title: 'The endemic Mediterranean yelkouan shearwater Puffinus yelkouan: distribution, threats and a plea for more data'
      publisher: Oryx 42:187-194
      date: '2008'
      url: https://doi.org/10.1017/S0030605308006467
      note: 'Peer-reviewed review: global 11,355-54,524 pairs, probably overestimated.'
    - title: Yelkouan shearwater (seabird guide)
      publisher: CIESM
      date: n/d
      url: https://ciesm.org/seabird-guide/yelkouan-shearwater/
      note: Global 21,000-36,000 pairs; no source given (second-hand).
  quote: Malta's population is estimated to be around 1,600 – 1,800 pairs, constituting approximately 10% of the global population.
counter_evidence: "ERA's Species Action Plan 2022-2030 gives 1,795-2,635 pairs (above the page's undated 1,600-1,800) and\
  \ also says 'around 10%'. Global estimates: 11,355-54,524 pairs (Bourgeois & Vidal 2008, probably overestimated); 21,000-36,000\
  \ pairs (CIESM guide, second-hand). Malta's share is 4.4-8.6% (central 6.0%) with the page's own count and 5.0-12.5% (central\
  \ 7.8%) with ERA's count. Tavolara (Sardinia) holds over half the world population (Pezzo et al. 2021)."
tests: ERA Species Action Plan; Bourgeois & Vidal (2008) Oryx; CIESM guide; shares computed in tools/cc-106-report/calc.py.
