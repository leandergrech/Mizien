caveats: No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading or Contradicted).
  The speaker is PwC Malta; the Malta Chamber carried the release as sponsored content and added no wording of its own. PwC's report
  was not readable, so its model, definitions and base populations are unchecked. Electricity for 2025 is provisional and Malta's
  2023 hospital-bed value carries a break flag. Two indicators (beds, electricity) were tested; other infrastructure was not. The
  foreign-resident share (31%, 38% by 2030) is tested in CC-099 and not rated here.
