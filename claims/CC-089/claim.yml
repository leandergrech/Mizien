counter_evidence: Eurostat demo_gind gives 588,254 on 1 Jan 2026, +14,004 (+2.44%) in 2025, the fastest of 27 (EU-27 +0.16%; Cyprus
  +1.38%); +34.1% since 2015 (EU +2.1%). EUROPOP2025 for 1 Jan 2030, 621,470 (baseline) and 650,230 (higher migration), so PwC's
  636,000 is within range. Hospital beds per 100,000 in 2024, 391 (18th of 27; EU-27 507); PwC says 397, 17th, EU 511. Beds to hold
  the rate at 636,000 residents, +262 to +303 (Eurostat's rate or PwC's 397), against PwC's +329; parity +1,028 against PwC's
  +1,054. Malta's median age is 40.0 (EU-27 44.9). Electricity imports 970 GWh in 2024 (equal to PwC); PwC's 1,304 is reproduced
  exactly, but 970 to 1,304 is +34%, not "circa 25%". Density 1,865 and 2,016 on Eurostat's area (PwC 1,862 and 2,013). World
  Bank 2023 has Malta 8th of 263 entries, 5th among sovereign states (1,754 vs Maldives 1,765), so "fourth" was not reproduced.
tests: Eurostat demo_gind, proj_25np, hlth_rs_bds1, nrg_cb_e, demo_r_d3area, demo_pjanind; World Bank EN.POP.DNST; recomputed with
  tools/cc-089-report/calc.py.
