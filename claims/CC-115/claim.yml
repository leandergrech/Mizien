claim:
  text: 'The Malta Chamber of Commerce, Enterprise and Industry (LEAD proposals for the 2026-2031 legislature, 14 May 2026):
    traffic congestion cost the economy an estimated EUR 770 million in 2025, equivalent to 3.4% of GDP.'
  speaker: The Malta Chamber of Commerce, Enterprise and Industry
  date: 2026-05-14
  wording_status: Verbatim found
  sources:
    - title: LEAD - The Malta Chamber Proposals for the 2026-2031 Legislature
      publisher: The Malta Chamber of Commerce, Enterprise and Industry
      date: '2026-05-14'
      url: https://maltachamber.org.mt/wp-content/uploads/2026/05/LEAD-The-Malta-Chamber-Proposals-for-2026-2031-Legislature.pdf
      note: The claim, page 3; footnote 2 cites Transport Master Plan 2030 p. 124. Read in full 5 Oct 2026.
    - title: National Transport Master Plan 2030
      publisher: Ministry for Transport / Transport Malta
      date: Jan 2026
      url: https://infrastructure.gov.mt/wp-content/uploads/2026/01/NATIONAL-TRANSPORT-MASTERPLAN-2030.pdf
      note: "The cited source, p. 124: EUR 917m by 2030 'up from EUR 770 million in 2025'; no derivation for 2025. Read from\
        \ the Internet Archive copy of 21 Mar 2026 (live site 403)."
    - title: 'Chamber tells political parties: Malta must address productivity crisis or face structural decline'
      publisher: Lovin Malta
      date: '2026-05-14'
      url: https://lovinmalta.com/news/general-election-2026/chamber-tells-political-parties-malta-must-address-productivity-crisis-or-face-structural-decline/
      note: 'Locator: reports the proposals in its own words.'
    - title: GDP and main components (nama_10_gdp)
      publisher: Eurostat
      date: updated 2 Oct 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table
      note: Primary data, retrieved 5 Oct 2026 (data/cc-115/).
  quote: In 2025, traffic congestion imposed an estimated cost of €770 million on the Maltese economy, equivalent to 3.4%
    of GDP.
counter_evidence: 'The EUR 770m is quoted accurately from the National Transport Master Plan 2030 (p. 124), which projects
  EUR 917m by 2030 and excludes EUR 195.4m of environmental costs, but the plan publishes no derivation for 2025 (its appraisal
  annex models 2030 and 2060 only). EUR 770m is 3.12% of 2025 GDP at current prices (Eurostat EUR 24,664m); 3.34% of 2024
  GDP; 3.8-3.9% of real GDP. 3.4% would need GDP of EUR 22.6bn. Marco Cremona''s EUR 1.13bn estimate (MNA, 3 Jun 2026) is
  second-hand.'
tests: Chamber's LEAD document and the National Transport Master Plan 2030; Eurostat nama_10_gdp (tools/cc-115-report/calc.py).
