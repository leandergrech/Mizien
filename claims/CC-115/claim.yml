claim:
  text: 'The Malta Chamber of Commerce, Enterprise and Industry (2026 election proposals): traffic congestion alone cost
    the economy an estimated EUR 770 million in 2025, equivalent to 3.4% of GDP.'
  speaker: The Malta Chamber of Commerce, Enterprise and Industry
  date: n/d
