    url: https://lovinmalta.com/news/general-election-2026/chamber-tells-political-parties-malta-must-address-productivity-crisis-or-face-structural-decline/
    note: News report quoting the Chamber's 'LEAD' proposals, read 5 Oct 2026; page undated in the text read. Locate the
      Chamber's own document and the date.
  quote: Traffic congestion alone cost the economy an estimated €770 million in 2025, equivalent to 3.4% of GDP.
counter_evidence: 'Engineer Marco Cremona (presentation to Momentum, Malta News Agency 3 Jun 2026) estimated EUR 1.13 billion
  a year from 60.8 million hours lost at EUR 10 an hour plus fuel. The same Chamber text gives 2025 GDP as EUR 20.40 billion,
  and EUR 770 million is about 3.8% of that, so the 3.4% depends on which GDP series is used (nominal versus chain-linked
  volume): to check.'
tests: Chamber's own document and method; time-cost and fuel-cost components (value of time, commuter numbers, Transport
  Malta/NSO traffic data); NSO nominal GDP 2025; compare with the Cremona estimate and earlier Maltese estimates; European
  congestion-cost literature (e.g. Commission handbook on external costs).
why_low_hanging: A business-side claim with a euro figure and a GDP share that can be recomputed and compared against two
  other estimates.
