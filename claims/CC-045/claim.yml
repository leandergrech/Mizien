             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-045A
    text: "16 km in use, 20 km as the planned total (department’s own figures)"
    finding: "Stated as 16 km in use, 4 km planned, 20 km total (department, 4 Jul 2025) [1]; about 16 km in 2020 [4]. The\
      \ MaltaToday headline’s “20 km … helped” is headline wording, not rated."
    rating: "Not rated"
    tone: grey
  - id: CC-045B
    text: "They are designed to reduce flooding"
    finding: "65 km², 5-year storm, 165,000 expected beneficiaries (Commission, 2013) [3]."
    rating: "Supported"
    tone: green
  - id: CC-045C
    text: "The infrastructure is in use “to reduce flooding” (department, as summarised by TVM)"
    finding: "Plausible from design; no before-and-after incident data found in the sources searched. Flooding reported in\
      \ project localities in 2020 [4] and new tunnels planned in 2022 [2]. The Agency’s own comparison is not published in\
      \ what we read [9]."
    rating: "Not shown"
    tone: grey
  - id: CC-045D
    text: "The systems “avoid flooding … every time it rains” (attributed to Ellul, “particularly for the Birkirkara localities”)"
    finding: "A 5-year design is exceeded by larger storms; no source shows how often flooding is prevented [1, 3, 4, 8]."
    rating: "Overstated"
    tone: orange
