             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-045A
    text: "Some 20 km of tunnels"
    finding: "16 km in use and 4 km planned (department, 4 Jul 2025) [1]; about 16 km in 2020 [4]. 20 km is the planned total."
    rating: "Overstated"
    tone: orange
  - id: CC-045B
    text: "They are designed to reduce flooding"
    finding: "65 km², 5-year storm, 165,000 expected beneficiaries (Commission, 2013) [3]."
    rating: "Supported"
    tone: green
  - id: CC-045C
    text: "They have helped Malta manage flooding"
    finding: "Plausible from design; no before-and-after incident data published. Flooding reported in project localities in 2020 [4] and new tunnels planned in 2022 [2]."
    rating: "Not shown"
    tone: grey
  - id: CC-045D
    text: "They “avoid flooding … every time it rains”"
    finding: "A 5-year design is exceeded by larger storms; no source shows how often flooding is prevented [1, 3, 4]."
    rating: "Overstated"
    tone: orange
