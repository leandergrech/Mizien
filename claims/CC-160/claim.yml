claim:
  text: 'Joint press release of ten NGOs including BirdLife Malta, Din l-Art Ħelwa, Friends of the Earth Malta, Moviment Graffitti
    and the Astronomical Society of Malta (4 Feb 2026): ''Permitting lighting until midnight at Dwejra is utterly incompatible
    with the Gozo and Comino Local Plan, whose policy on Dark Sky Heritage Areas (GZ-DARK-1) states unambiguously that there
    should be no lighting in this site.'''
  speaker: Joint NGO statement on Dwejra (BirdLife Malta, Din l-Art Ħelwa and others)
  date: '2026-02-04'
  wording_status: Verbatim found
  sources:
  - title: 'Dwejra is to be lit up: Government''s ''Protection'' Law Is a Blatant Betrayal of Dwejra and a Fraud on the Public
      (joint press release)'
    publisher: BirdLife Malta (on behalf of ten signatory organisations)
    date: '2026-02-04'
    url: https://birdlifemalta.org/wp-content/uploads/2026/02/Dwejra-is-to-be-lit-up_Governments-Protection-Law-Is-a-Blatant-Betrayal-of-Dwejra-and-a-Fraud-on-the-Public.pdf
    note: The claim in the signatories' own words; PDF text extracted and read in full 8 Nov 2026.
