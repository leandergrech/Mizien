  quote: Permitting lighting until midnight at Dwejra is utterly incompatible with the Gozo and Comino Local Plan, whose policy
    on Dark Sky Heritage Areas (GZ-DARK-1) states unambiguously that there should be no lighting in this site.
counter_evidence: 'Context, not tested: the release also says the draft law prohibits ''new permanent external lighting fixtures''
  unless permitted by the Authority and allows certain types of lighting; it does not quote the draft text. The Government''s
  reasoning and the final text of the legal notice are not in this source. The release is strongly worded; only the checkable
  statement (what the Local Plan policy and the draft provide) is tested.'
tests: Gozo and Comino Local Plan policy GZ-DARK-1 (text) and the draft Dwejra protection regulations / legal notice and ERA's
  consultation (what lighting is allowed, until what hour); shearwater light-attraction literature and dark-sky measurements
  for context (CC-053).
why_low_hanging: Two public texts can be compared line by line.
