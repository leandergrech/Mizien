claim:
  text: 'National Statistics Office: Malta''s population rose to 588,254 at the end of 2025 (+2.4%), with net migration of
    13,906 the main driver.'
  speaker: National Statistics Office (NSO)
  date: 2026-07-09
  wording_status: 'Verbatim found'
  sources:
    - title: 'World Population Day: 11 July 2026, News Release NR 120/2026'
      publisher: National Statistics Office, Malta
      date: '2026-07-09'
      url: https://nso.gov.mt/world-population-day-11-july-2026/
      note: The claim. nso.gov.mt refuses scripts; full text read from the Internet Archive copy on 5 Oct 2026. Also says
        net migration of 13,906 'was the main contributor to population growth in 2025'.
    - title: Population change - demographic balance (demo_gind)
      publisher: Eurostat
      date: updated 30 Sep 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/demo_gind/default/table
      note: Cross-check, retrieved 5 Oct 2026; data supplied by the NSO, so not independent. Extract and checks in data/cc-088/.
  quote: The estimated total population of Malta and Gozo stood at 588,254 at the end of 2025. This is an increase of 2.4
    per cent when compared to the previous year.
counter_evidence: 'Eurostat demo_gind reproduces every figure: population 588,254 on 1 Jan 2026 (574,250 a year earlier, +2.44%),
  net migration 13,906 (+31.0% on 10,614), natural increase 98 (193 in 2024, -49.2%), births -0.8%, deaths +1.4%. 98 + 13,906
  = 14,004 = change in stock; migration is 99.3% of growth. Eurostat data come from the NSO, so this is not an independent
  count. National density figures (1,731 vs 1,838 per km2) are not in the release (locality densities only); Eurostat gives
  1,817.4 for 2024; source of the other two not found.'
tests: NSO release NR 120/2026 recomputed against Eurostat demo_gind (tools/cc-088-report/calc.py, data/cc-088/checks.csv).
