caveats: 'Not substantiated: pending right of reply (to be sought by the maintainer from BirdLife Malta). Shown for Labour,
  not for the PN. The minister''s and Mr Borg''s words are second-hand (news); the ORNIS presentation is not public; the PN
  programme was read as web chapters. The release''s body text is hedged (''appears'', ''statements indicating''); the headline
  is not.'
