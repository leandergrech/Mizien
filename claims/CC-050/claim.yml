  quote: BirdLife Malta condemns dangerous political race to weaken environmental enforcement
counter_evidence: Labour's manifesto (items 63-64) commits only to defend EU-permitted derogations and safeguard hunting and
  trapping; it has nothing on fines or licences. The fine cuts (EUR 5,000 to 3,000 first offence; 10,000 to 6,000 repeat,
  -40%) and licence reapplication come from a minister's campaign statement and an ORNIS Committee proposal of 23 Sep 2026,
  known only through Newsbook and BirdLife Malta. For the PN, Alex Borg said hunting and trapping 'will be safeguarded' (Lovin
  Malta); the 16 chapters of the PN programme have no hunting item, and no PN proposal to cut fines or restore licences was
  found. The reading that the pledge overrides the Birds Directive is BirdLife Malta's inference. The consolidated S.L. 549.42
  has no 2026 amendment.
tests: Labour manifesto PDF and PN programme (16 chapters) searched; S.L. 549.42 consolidated text; reduction computed in
  tools/cc-050-report/calc.py.
why_low_hanging: 'Done: Claim Check 050 report and flyer.'
