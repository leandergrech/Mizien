  response: null
evidence_shown: 'The PQ 29696 annex and transcribed dataset show 23 annual means, all below the 25 µg/m³ EU limit
  applicable in 2020-2024 and above the WHO 5 µg/m³ guideline; two St Paul''s Bay entries are n/a. EEA validated
  station files independently cross-check 11 station-years: ten match the annex to one decimal and Attard 2024 differs
  (12.122 vs 11.9 µg/m³). The data, formulas, valid-day coverage and source file hashes are included.

  '
