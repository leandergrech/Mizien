caveats: 'Only the quoted paragraph of the statement was read (supplied by the maintainer); the rest may add context. The statement gives no year, scope or GDP basis. Largely supported: no right of reply needed. The speaker is attributed to the Government of Malta; the person who read the statement is not named in the document.'
