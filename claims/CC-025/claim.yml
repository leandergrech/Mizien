id: CC-025
title: Per-capita emissions down 44% since 2005
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Government of Malta (COP30 national statement): Malta has reduced per-capita emissions by over 44% since
    2005 and emissions per unit of GDP by more than 80%.'
  speaker: Government of Malta
  date: 2025-11
  wording_status: Verbatim found
  quote: Malta has already reduced its per capita emissions by over 44% compared to 2005 and emissions per unit of GDP by more than 80%, demonstrating our commitment to decoupling growth from emissions.
  sources:
  - title: Statement of Malta, COP30 High-Level Segment
    publisher: UNFCCC
    date: Nov 2025
    url: https://unfccc.int/sites/default/files/resource/MALTA_cop30cmp20cma7_HLS_ENG.pdf
    note: "The claim. Delivered on the Minister's behalf. A Word file behind the .pdf address; paragraph supplied by the maintainer on 5 Oct 2026 (literature/CC-025/primary-source.md). Our own download was refused by a bot check (still an HTML page on 6 Oct 2026), so only the quoted paragraph was read and the wording is not independently verified."
  - title: Greenhouse gas emissions by source sector (env_air_gge); GDP (nama_10_gdp); population (nama_10_pe)
    publisher: Eurostat
    date: retrieved 5 Oct 2026
    url: https://ec.europa.eu/eurostat/databrowser/view/nama_10_gdp/default/table
    note: 'Primary data; extract and checks in data/cc-025/.'
  - title: Malta strengthens its contribution toward the EU's climate goals (CC-003)
    publisher: Climate Action Authority
    date: 13 Nov 2025
    url: https://climateaction.gov.mt/press/malta-strengthens-its-contribution-toward-the-eus-climate-goals/
    note: 'Same 44% figure and 81.6% (EU 61.9%) per unit of GDP, from a different speaker; read in CC-003 (Wayback copy).'
counter_evidence: 'More than 80% per unit of GDP holds only at current prices (-82% to 2023, -84% to 2024). In chain-linked volumes the fall is -70% (2023) and -72% (2024); no year reaches -80%. The gap is a price effect (Malta GDP deflator +72% since 2005). The per-person fall (-46% / -48.5%) is the figure CC-003 checked; about half is population growth, total emissions fell 27% (EU 33%) and have risen 18% since the 2016 low. In the statement''s favour: real GDP +161% with total emissions -27% is absolute decoupling, and Malta''s fall exceeds the EU''s on both intensity bases. On the residence basis (env_ac_ainah_r2: Malta-resident units, including international aviation fuel bought abroad) per-person emissions rose 69% from 2013 to 2024, rank 27 of 27 (EU-27 -21%); the claim is on the territorial (UNFCCC) basis and says so, so this is context (CC-114).'
tests: Eurostat env_air_gge, nama_10_gdp (current prices and chain-linked volumes) and nama_10_pe for Malta and the EU-27, recomputed with tools/cc-025-report/calc.py; CC-003 for the per-person figure.
why_low_hanging: 'Done: Claim Check 025 report and flyer.'
tags:
- Selective metric
tags_provisional: false
priority: Done (v1.1)
data_readiness: Medium
caveats: 'The wording is the paragraph supplied by the maintainer; our own download of the UNFCCC file was refused by a bot check, so it is not independently verified, and the rest of the statement may add context. The statement gives no year, scope or GDP basis; the choice of 2023 and 2024 is the report''s assumption. A roughly ten-point overstatement on the usual (volumes) basis is a minor caveat because the 44% figure is right, the decoupling holds and current prices are a computable basis. On the residence basis (Eurostat air emissions accounts, env_ac_ainah_r2: Malta-resident units, including international aviation fuel bought abroad) per-person emissions rose 69% from 2013 to 2024, the largest rise of the 27 Member States (EU-27 -21%); the Government''s claim uses the territorial (UNFCCC) basis, so this is context, not a contradiction (see CC-114, which differs because it draws a causal inference the data contradict). Largely supported: no right of reply needed. The speaker is attributed to the Government of Malta; the person who read the statement is not named in the document.'
