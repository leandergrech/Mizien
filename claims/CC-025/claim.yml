subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-025A
    text: "Per-capita emissions down over 44% since 2005"
    said_by: "Govt of Malta [1]"
    finding: "Reproduced from Eurostat: −46% to 2023, −48.5% to 2024; Malta passed −44% in 2016. The same figure was checked in CC-003. About half of it is population growth."
    rating: "Accurate"
    tone: green
  - id: CC-025B
    text: "Emissions per unit of GDP down more than 80%"
    said_by: "Govt of Malta [1]"
    finding: "Holds at current prices (−82% to 2023, −84% to 2024). In chain-linked volumes it is −70% and −72%; no year reaches −80%. The statement names neither basis."
    rating: "True only at current prices"
    tone: amber
  - id: CC-025C
    text: "…demonstrating our commitment to decoupling growth from emissions"
    said_by: "Govt of Malta [1]"
    finding: "Real GDP +161%, total emissions −27%: absolute decoupling over 2005–2024. A statement of commitment is not itself testable; the data show the decoupling it refers to."
    rating: "Supported"
    tone: green
