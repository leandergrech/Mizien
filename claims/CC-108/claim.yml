priority: Queue
data_readiness: 'Medium: Eurostat and EEA reachable; WSC and EWA pages are browser-only (bot challenge).'
caveats: 'Candidate added 5 Oct 2026 at the maintainer''s request, as the speaker-level counterpart to CC-009 (no quoted
  speaker there claims recovery). Wording is from search summaries: read the WSC pages and the Green Paper in a browser
  and record the verbatim text before any report. Check whether "net-zero impact" is a target (pledge) or a claim of
  achievement.'
