claim:
  text: 'Energy and Water Agency (Green Paper on groundwater abstraction, Nov 2023): the proposed Groundwater Abstraction
    Licensing Framework will not apply to groundwater sources operated by the Water Services Corporation, given that the Corporation
    is moving towards a net-zero impact on the groundwater environment; its annual groundwater abstraction will be capped
    at 14 Mm3 up to 2030.'
  speaker: Energy and Water Agency (EWA)
  date: 2023-11
  wording_status: Verbatim found
  sources:
  - title: Green Paper on the Regulation of Groundwater Abstraction in the Maltese Islands
    publisher: Energy and Water Agency
    date: 2023-11
    url: https://energywateragency.gov.mt/wp-content/uploads/2023/11/GREEN-PAPER.pdf
    note: Primary wording, p. 12 (printed spread numbers). Read in full 11 Oct 2026; PDF sha256 c75845a6...ed447.
  - title: Integrated Water Resources Management in the Maltese Islands (Sapiano 2020, p. 31)
    publisher: Acque Sotterranee 9(3)
    date: '2020'
    url: https://doi.org/10.7343/as-2020-477
    note: Agency author's description of the net-zero impact concept (give back at least as much water as is abstracted).
  - title: European Commission Endorses WSC's 'Net Zero-Impact' Utility Project
    publisher: Water Services Corporation
    date: '2019-04-02'
    url: https://www.wsc.com.mt/european-commission-endorses-wscs-net-zero-impact-utility-project/
    note: Read live 11 Oct 2026. Context (4 billion litres; 7 billion litres of recycled water). Does not contain the "equivalent
      volume" wording.
  - title: 'Towards a Net Zero-Impact Utility: new EUR 100 million EU-funded project'
    publisher: Water Services Corporation
    date: '2018-04-16'
    url: https://www.wsc.com.mt/towards-a-net-zero-impact-utility-new-e100-million-eu-funded-project-set-to-improve-water-quality-to-all-new-highs/
    note: Read live 11 Oct 2026. Context; no give-back wording.
  - title: Closing the water loop
    publisher: Sustain Europe (unsigned)
    date: '2018-11-06'
    url: https://www.sustaineurope.com/closing-the-water-loop-%E2%80%93-improving-the-sustainability-of-malta%E2%80%99s-water-resources-20181105.html
    note: Carries the "at least an equivalent volume" wording without naming a speaker; not rated.
  quote: given that the Corporation is moving towards the achievement of a net-zero impact on the groundwater environment
    through its operations
counter_evidence: WSC groundwater production was 11.5 million m3 in 2025 (82% of the proposed 14 cap) and 13.5 in 2016 (96%);
  the cap sits 4% above the highest year read. New Water (treated wastewater) was 1.6 million m3 in 2022 (13% of WSC's abstraction,
  meant for crop irrigation); no recharge figure found. The Green Paper says good quantitative status 'will not be achieved'
  for the main sea-level aquifers and that WSC's falling abstraction partly reflects aquifer degradation; 4 of 15 groundwater
  bodies are in poor quantitative status (EEA WISE, assessed 2021).
tests: WSC annual reports (groundwater production); Green Paper; Sapiano 2020; Eurostat env_wat_abs and env_wat_res; EEA WISE
  groundwater-body status.
why_low_hanging: Follows directly from CC-009 (maintainer request, 5 Oct 2026); most data are already in data/cc-009/. The
  question is whether "net-zero impact" is defined and measured, and whether the balance holds.
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium: Eurostat and EEA reachable; WSC and EWA pages are browser-only (bot challenge).'
caveats: 'Pending right of reply (Energy and Water Agency; Water Services Corporation). The Green Paper is a consultation
  proposal; whether the cap and exemption were adopted was not found. The candidate record''s ''give back at least as much
  natural freshwater'' wording (from a search summary) is not on either WSC page read and is not rated as WSC''s statement.
  WSC production for 2017-2021 not read; 2022-25 values are chart values transcribed for CC-009. Related: CC-039 (WSC''s 4
  billion litre pledge), CC-009.'
