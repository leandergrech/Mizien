  quote: Malta’s population rose by 25 percent over a decade, largely due to immigration.
counter_evidence: NSO reports a population of 588,254 at the end of 2025, up 2.4% in the year (CC-088); the 25% depends
  on the start and end years chosen. Whether 'largely due to immigration' holds depends on net migration versus natural
  change.
tests: Eurostat demo_pjan / demo_gind (population and components of change); NSO population statistics; compute growth for
  each 10-year window up to 2025 and the migration share of change.
why_low_hanging: A single percentage and a causal share that Eurostat and NSO series test directly.
