claim:
  text: 'International Monetary Fund staff (Selected Issues, Feb 2026): Malta''s population rose by 25 percent over a decade,
    largely due to immigration.'
  speaker: International Monetary Fund
  date: 2026-02
  wording_status: Verbatim found
  sources:
    - title: 'Malta: Selected Issues (IMF Country Report No. 26/30), Growth-at-Risk paper, para. 6'
      publisher: International Monetary Fund
      date: Feb 2026
      url: https://www.imf.org/-/media/files/publications/cr/2026/english/1mltea2026002-source-pdf.pdf
      note: The claim. imf.org refuses automated downloads; read in full from the Internet Archive copy of 17 May 2026. Selected
        Issues papers carry staff views.
    - title: Population change - demographic balance (demo_gind)
      publisher: Eurostat
      date: updated 30 Sep 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/demo_gind/default/table
      note: Primary data, retrieved 5 Oct 2026; extract and checks in data/cc-112/.
  quote: Malta’s population rose by 25 percent over a decade, largely due to immigration.
counter_evidence: 'Eurostat demo_gind: growth was 24.4-24.6% over the decades ending 1 Jan 2020, 2021 and 2022, but 30.9%
  over 1 Jan 2015-2025 (the latest decade available in Feb 2026) and 30.8% over 2016-2026. The paper gives no years. Net migration
  was 93-97% of growth in every decade since 2010-2020. EU-27 grew 1.9% over 2015-2025.'
tests: Eurostat demo_gind for Malta and the EU-27; growth over every ten-year window to 2026 and the migration share (tools/cc-112-report/calc.py).
