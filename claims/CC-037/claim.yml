id: CC-037
title: Highest share reporting pollution
category: Air
subtopic: Air quality & health
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'Amphora Media (2026 Election Guidebook): 35% of people in Malta reported exposure to pollution in 2023, the highest
    share in the EU.'
  speaker: Amphora Media
  date: '2026-05-12'
  wording_status: Verbatim found
  sources:
    - title: '2026 Election Guidebook: The Environment'
      publisher: Amphora Media
      date: 12 May 2026
      url: https://www.amphora.media/2026/05/2026-election-guidebook-the-environment
      note: The claim. Read in full on 5 Oct 2026. No source named or linked.
    - title: Pollution, grime or other environmental problems (ilc_mddw02)
      publisher: Eurostat
      date: updated 13 Aug 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/ilc_mddw02/default/table
      note: Primary evidence. Retrieved 5 Oct 2026, with Eurostat's flags.
    - title: Quality of life indicators – natural and living environment (Statistics Explained)
      publisher: Eurostat
      date: last edited 14 Aug 2025
      url: https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Quality_of_life_indicators_-_natural_and_living_environment
      note: Likely source of Amphora's three statements (34.7%, 'by far the highest share', Malta 5.5 points lower for people
        at risk of poverty). Read 5 Oct 2026.
    - title: 12% of EU population reported pollution in their area
      publisher: Eurostat
      date: 1 Sep 2025
      url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20250901-1
      note: News release; the 12% EU headline; data from a module 'collected every 3 years'. Read 5 Oct 2026.
  quote: 35% of people in Malta reported exposure to pollution in 2023 — the highest share in the EU.
counter_evidence: Eurostat ilc_mddw02 counts people living in households where the respondent reports pollution, grime or
  other environmental problems in the area; it records reported problems, not measured exposure. "Reporting exposure" is Eurostat's
  own wording, so this is context, not a flaw in the claim. Amphora's income sentence holds for 2023 (35.6% above vs 30.1%
  below 60% of median income) but the "above" group is 83.4% of people, the direction reversed in 6 of 17 years, and EU-wide
  it runs the other way. No data for 2021 and 2022 (three-yearly module since 2021; next 2026).
tests: Eurostat ilc_mddw02 (EU-SILC) by country, year and income group, with flags, and ilc_li02 (at-risk-of-poverty rate),
  recomputed with tools/cc-037-report/calc.py; Eurostat's methodology note, 2025 article and news release; Regulation (EU)
  2019/1700 and Delegated Regulations (EU) 2020/256 and 2022/29 for the survey's periodicity.
why_low_hanging: 'Done: Claim Check 037 report and flyer.'
