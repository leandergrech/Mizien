caveats: 'Statement is accurate as a statement about reports, in Eurostat''s own words. The indicator is self-reported; it
  does not measure pollution. Amphora names no source; the match to Eurostat ilc_mddw02 and Eurostat''s 2025 article and release
  is ours. Supported verdict: no right of reply needed.'
