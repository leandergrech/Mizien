  - title: 9th report on the state of the energy union (page)
    publisher: European Commission, DG ENER
    date: '2025-01-29'
    url: https://energy.ec.europa.eu/strategy/energy-union/ninth-report-state-energy-union_en
    note: 'Read 6 Oct 2026 (modified 30 Jul 2026). Lists the energy subsidies report (COM/2025/17) and the subsidy
      database (xl file), and links to the CIRCABC file.'
  - title: Report on energy subsidies in the EU, COM(2026) 472 final (Council document ST 13343/26)
    publisher: European Commission
    date: 17 Sep 2026
    url: https://data.consilium.europa.eu/doc/document/ST-13343-2026-INIT/en/pdf
    note: Read in full 6 Oct 2026. EU fossil fuel subsidies 2023 revised to EUR 121bn (2024 prices); Malta first per
