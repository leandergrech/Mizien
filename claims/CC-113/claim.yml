id: CC-113
title: 'EEA: Malta among highest fossil-fuel subsidies relative to GDP'
category: Climate & Energy
subtopic: Electricity & grid
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'European Environment Agency (indicator page, 29 Jan 2025): in 2023 fossil-fuel subsidies represented the highest
    shares of GDP in Malta, Poland and Slovakia, all at or above 1.5%.'
  speaker: European Environment Agency
  date: '2025-01-29'
  wording_status: Verbatim found
  sources:
  - title: Fossil fuel subsidies in Europe
    publisher: European Environment Agency
    date: '2025-01-29'
    url: https://www.eea.europa.eu/en/analysis/indicators/fossil-fuel-subsidies
    note: 'The claim. Read in full 6 Oct 2026 (page published 29 Jan 2025, modified 29 Jul 2025). Same sentence, word
      for word, in the EEA''s browser-printed copy of 3 Feb 2025 and in the 8th EAP monitoring report 2025 PDF (26 Nov
      2025). Wayback and archive.today refused connections from this network.'
  - title: Fossil fuel subsidies as a share of GDP 2023 (chart) and the indicator's chart data packages
    publisher: European Environment Agency
    date: '2025-01-29'
    url: https://www.eea.europa.eu/en/analysis/indicators/fossil-fuel-subsidies/fossil-fuel-subsidies-as
    note: 'Malta 3.37%, Poland 2.09%, Slovakia 1.51%, EU-27 0.66% (2023, provisional: 2022 values used for about 7%
      of the total). Downloaded 6 Oct 2026 (data/cc-113/).'
  - title: Inventory of energy subsidies in the EU27, 2024 edition (subsidy database)
    publisher: European Commission (DG ENER; Enerdata, Trinomics)
    date: 6 Sep 2024
    url: https://circabc.europa.eu/ui/group/8f5f9424-a7ef-4dbf-b914-1af1d12ff5d2/library/4e6f2b2c-702b-429b-bb19-7aeb48f28f58/details
    note: 'Primary evidence: the database behind the EEA indicator, published with COM(2025) 17 (file modified 9 Apr
      2025; SHA-256 recorded). Every EEA share reproduced to two decimals (tools/cc-113-report/calc.py). The workbook
      is (c) Enerdata: only country totals and five Malta figures are committed; the measure rows are rebuilt locally.'
  - title: 2024 Report on Energy subsidies in the EU, COM(2025) 17 final
    publisher: European Commission
    date: 28 Jan 2025
    url: http://publications.europa.eu/resource/cellar/7150e5a9-dd6f-11ef-be2a-01aa75ed71a1.0017.03/DOC_1
    note: 'Read 6 Oct 2026 from the EU Publications Office (EUR-Lex refused scripts). Figure 16, "Fossil fuel subsidies
