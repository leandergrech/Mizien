      2023, 15th of 27.
  quote: In 2023, fossil fuel subsidies represented the highest shares of gross domestic product (GDP) in Malta, Poland,
    and Slovakia (all at or above 1.5%).
counter_evidence: 'The ranking reproduces exactly from the Commission''s subsidy database (2024 edition) that the EEA
  used, and holds with Eurostat GDP (as of 6 Oct 2026, which the EEA could not have had) and, as a lower bound, with
  the unconfirmed items set to zero; but Slovakia''s "at or above 1.5%" holds only on the EEA''s basis (1.507%; 1.49%
  with Eurostat GDP; 1.39% with the unconfirmed items set to zero). Malta''s 2023 figure (EUR 605m, or 633m with a
  stand-in) is 96% one line, compensation to Enemalta for frozen energy prices, booked as actual costs and wholly to
  natural gas; it is 2.1 times the IMF Article IV energy-subsidy cost for 2023 (1.4% of GDP, CR 26/29) and 1.7 times
  the Government''s expected cost (1.7% of GDP, DBP 2024, other basic commodities included), a gap we could not
  reconcile. For 2022 the database was lower (1.71% of GDP, the line EUR 246.6m) than the Government (2.5%, about EUR
  451m) and the IMF (1.8%, about EUR 325m); over 2022-23 the line (EUR 826.5m) is close to the Government''s expected
  cost (about EUR 806m), which points to timing or basis; the 2024 gap (about 1.8% against 0.87%) persists. The IMF''s
  price-gap database records no explicit subsidy for Malta; the OECD/IISD tracker has no OECD or IEA estimate for
  Malta. Malta was 0.08-0.10% of GDP in 2015-2020 (24th-27th of 27) and is first again for 2024 in COM(2026) 472. In
  euros Malta''s EUR 0.63bn is 19th of 27.'
tests: Commission subsidy inventory 2024 edition (CIRCABC) rebuilt measure by measure (locally); EEA chart data;
  COM(2025) 17 Figure 16 (read by pixel); Eurostat nama_10_gdp, gov_10a_main and nrg_cb_e; Malta Draft Budgetary Plans
  2024 and 2025; IMF CR 26/29 Table 2 (read for CC-018/CC-022); IMF Fossil Fuel Subsidies Data 2023 update; OECD/IISD
  Fossil Fuel Subsidy Tracker; COM(2026) 472; ECFIN Discussion Paper 214 for definitions (tools/cc-113-report/calc.py).
