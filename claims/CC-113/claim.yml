subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-113A
    text: "In 2023 the highest shares of GDP were in Malta, Poland and Slovakia"
    finding: "Rebuilt from the Commission database: Malta 3.37%, Poland 2.09%, Slovakia 1.51%, then Croatia 1.15% [3, 4]; the Commission’s own chart of 28 Jan 2025 shows the same [19]. The same three lead with Eurostat’s GDP and, as a lower bound, with the unconfirmed items set to zero [5]."
    rating: "Accurate"
    tone: green
  - id: CC-113B
    text: "“all at or above 1.5%”"
    finding: "True on the EEA’s basis (Slovakia 1.507%). With Eurostat’s GDP of 6 Oct 2026 (later than the EEA could have used) Slovakia is 1.49%; with the unconfirmed items set to zero (a lower bound), 1.39%. Malta and Poland clear the line in every version [4, 5]."
    rating: "Largely accurate"
    tone: lime
  - id: CC-113C
    text: "Malta’s share, 3.37% of GDP, the highest (the EEA’s linked chart)"
    finding: "Reproduced exactly; 3.03% with Eurostat’s GDP of 6 Oct 2026; first in the Commission’s 2024 data too [8]. 96% is one EUR 580m line; the total is 2.1 times the IMF Article IV estimate of the 2023 cost and 1.7 times the Government’s, though in 2022 the database was lower than both [10, 12]."
    rating: "Largely accurate"
    tone: lime
  - id: CC-113D
    text: "Malta’s support is a fossil-fuel subsidy"
    finding: "Yes under the EU reporting method, which the EEA states; the IMF’s price-gap database records none, and the OECD/IISD tracker has no OECD or IEA estimate for Malta [9, 13, 14]. The database books Malta’s main line wholly to natural gas, although 21.7% of the 2023 electricity supply was imported [4, 20]; the rank does not change."
    rating: "Accurate (official method)"
    tone: green
