caveats: 'Statement by an EU agency about EU data; the EEA states its definition (WTO categories, EU inventory method).
  The claim is about shares of GDP (in euros Malta is 19th of 27). 2023 values are provisional for the items still to be
  confirmed (about 7-8% of the EU total; in Malta only the EUR 28.2m excise cut); Malta''s EUR 580m line is booked as
  actual costs and is not reconciled with other sources. Versions C and D (unconfirmed items set to zero) are a lower
  bound, not equally valid versions; B and D use Eurostat GDP as of 6 Oct 2026, which the EEA could not have had.
  COM(2025) 17 (28 Jan 2025) was read from the EU Publications Office: its Figure 16 gives the same top four as the
  CIRCABC file, which was modified on 9 Apr 2025. The Commission workbook is (c) Enerdata (reproduction prohibited
  without written permission): measure rows are not committed. The original 29 Jan 2025 page could not be opened; the
  earliest copy read is 3 Feb 2025. IMF CR 26/29 figures are from the CC-018/CC-022 record (read in full 5 Oct 2026).
  Largely supported verdict: no right of reply needed.'
