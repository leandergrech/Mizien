claim:
  text: 'Ministry for the Environment (Environment Minister''s reply to a parliamentary question, reported by The Malta Independent
    on 9 Feb 2026): the BCRS (beverage container refund scheme) machines recorded a collection rate of over 85% in 2025, up
    from about 84% in 2024.'
  speaker: Ministry for the Environment
  date: '2026-02-09'
  wording_status: 'Paraphrase: locate quote'
  sources:
  - title: Environment Minister says BCRS machines recorded collection rate of over 85% in 2025
    publisher: The Malta Independent
    date: '2026-02-09'
    url: https://www.independent.com.mt/articles/2026-02-09/local-news/Environment-Minister-says-BCRS-machines-recorded-collection-rate-of-over-85-in-2025-6736287096
    note: The claim as reported; figure seen in a search summary only (403 on 1 Nov 2026). The parliamentary question text
      (parlament.mt) not yet found.
counter_evidence: A deposit-return collection rate is containers returned divided by containers placed on the market, so the
  numerator and the denominator both need a source. "Machines" may exclude manual or bring-site returns. It measures collection,
  not recycling. The EU Single-Use Plastics Directive target is 90% separate collection of plastic bottles by 2029.
tests: BCRS Malta annual report (containers placed on market and returned); the parliamentary question and reply; Eurostat/EEA
  beverage-container collection comparisons; Directive (EU) 2019/904 Article 9.
why_low_hanging: A ratio of two published counts, with an EU benchmark.
