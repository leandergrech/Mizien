id: CC-075
title: Seventh in the EU for cars
category: Transport
subtopic: Cars & traffic
status: Drafted
verdict: Misleading
verdict_confidence: Moderate
claim:
  text: 'Lovin Malta (21 Sep 2024), describing a Eurostat dataset "as of 2023": Malta is ranked seventh in the EU, between
    Germany and Poland, with 585 passenger cars per 1,000 inhabitants. The article gives conflicting year signals: the dataset "as of 2023", a graphic "up to the year 2022".'
  speaker: Lovin Malta (reporting Eurostat)
  date: '2024-09-21'
  wording_status: Verbatim found
  sources:
    - title: Malta Ranked Number Seven On Eurostat's 'Passenger Cars Per 1,000 Inhabitants' Dataset
      publisher: Lovin Malta (J. Darmanin)
      date: 21 Sep 2024
      url: https://lovinmalta.com/malta/malta-ranked-number-seven-on-eurostats-passenger-cars-per-1000-inhabitants-dataset/
      note: The claim, in the outlet's own words. Read in full on 6 Oct 2026 (page and WordPress API, post 148257). Calls
        Eurostat's dataset 'as of 2023' and dates its graphic (Paula Lago, The European Correspondent) 'up to the year
        2022'; the sentence with the 585 and the rank carries no year of its own.
    - title: Passenger cars in the EU (Statistics Explained), revision 647912
      publisher: Eurostat
      date: 19 Aug 2024 (live until 5 Nov 2024)
      url: https://ec.europa.eu/eurostat/statistics-explained/api.php?action=query&prop=revisions&revids=647912&rvprop=content|timestamp&rvslots=main&format=json
      note: What Eurostat had published on the article's date. 'Data extracted in July 2024'; Figure 3 'Motorisation rate,
        2023' (all 27 Member States; Malta about 575, 12th); text Italy 694, EU 571. Read through the MediaWiki API on
        6 Oct 2026.
    - title: Passenger cars per 1 000 inhabitants reached 560 in 2022
      publisher: Eurostat
      date: 17 Jan 2024
      url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20240117-1
      note: Eurostat's release of the 2022 figures; its chart puts Malta sixth at about 602 (later revised to 585). Read
        6 Oct 2026.
    - title: Passenger cars - per thousand inhabitants (road_eqs_carhab)
      publisher: Eurostat
      date: updated 30 Jul 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/road_eqs_carhab/default/table?lang=en
      note: Today's data, retrieved 6 Oct 2026 with flags; 2022 Malta 585, 7th; rebuilt from road_eqs_carmot and demo_gind.
  quote: Malta is ranked number seven, just between Germany and Poland … with 585 cars per 1,000 inhabitants.
counter_evidence: 'By 25 Jul 2024, about two months before the article, Eurostat had published 2023 figures for all 27 Member
  States (Statistics Explained "Passenger cars in the EU", revision 647912, live 19 Aug to 5 Nov 2024): Malta about 575,
  12th; EU 571. The article gives conflicting year signals (dataset "as of 2023", graphic "up to the year 2022") and
  states the rank in the present tense without mentioning the 2023 figures. Its 585 and seventh place are 2022 figures in data revised after January 2024 (Eurostat''s
  January 2024 release had Malta sixth at about 602). Today''s data: 11th for 2023, 14th for 2025 (571, below the EU''s 584);
  the population grew faster than the car stock. Side remarks: one car per 1.7 people, not per two; 246 km2 is Malta island
  (country 313 km2; still the most cars per km2 in the EU). NSO licensed-vehicle figures are second-hand.'
tests: Eurostat road_eqs_carhab (all countries and years, with flags), rebuilt from road_eqs_carmot (stock at 31 Dec) and
  demo_gind (population on 1 Jan of the next year) for all 27 Member States; Eurostat's earlier publications (release of
  17 Jan 2024 and its chart; Statistics Explained revisions 627098 and 647912 with their Figure 3 charts, via the MediaWiki
  API), charts read by pixel measurement (tools/cc-075-report/read_charts.py, within 1.2 of every printed value); reg_area3
  land area; calc.py.
why_low_hanging: 'Done: Claim Check 075 report and flyer.'
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: 'The 585 and seventh place are right for 2022 in Eurostat''s revised data, but Eurostat''s published 2023 figures
  put Malta 12th when the article appeared, and the article presents seventh as current. Earlier Eurostat values are read
  from Eurostat''s own charts by pixel measurement; the article''s own data source (a third-party graphic) was not found.
  NSO figures are second-hand. For September 2024 only the Statistics Explained revision and its figure were seen,
  not the database tables as then published; Malta''s 2023 rank (12th) is read from a chart, so 11th or 12th is within
  reading error. Confidence Moderate: the article''s own dates conflict, so what readers take from them is open.
  Misleading verdict: draft, pending right of reply.'
