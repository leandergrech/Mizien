             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-075A
    text: "Malta has 585 cars per 1,000 inhabitants"
    finding: "Right for 2022 in data revised after January 2024: 585, no flag; rebuilt from 317,234 cars and 542,051 people [2–4]. Eurostat’s January 2024 release had about 602 [6]."
    rating: "Accurate (2022, revised data)"
    tone: green
  - id: CC-075B
    text: "Ranked number seven, between Germany and Poland"
    finding: "Seventh of 27 for 2022 in today’s data, between Germany 587 (b) and Poland 584 (i) [2]. In the January 2024 release Malta was sixth and Poland 11th [6]."
    rating: "Accurate (2022, revised data)"
    tone: green
  - id: CC-075C
    text: "Presented as current: dataset “as of 2023”, Malta “is ranked” seventh"
    finding: "The article gives conflicting year signals (dataset “as of 2023”, graphic “up to the year 2022”) and states the rank in the present tense. Eurostat had published 2023 figures by 25 Jul 2024: Malta about 575, 12th [13]. Separately, in today’s revised data Malta is 11th for 2023 [2]."
    rating: "Out of date when published"
    tone: red
  - id: CC-075D
    text: "Italy top at 682, Latvia lowest at 409"
    finding: "Italy 682 matches today’s 2022 data (684 in January 2024); Latvia is lowest in every version (406 now, 414 then) [2, 6]."
    rating: "Largely accurate"
    tone: lime
  - id: CC-075E
    text: "“Approximately 1 car for every 2 people”"
    finding: "585 per 1,000 is one car for every 1.71 people [2]; the rounding understates the rate."
    rating: "Loosely worded"
    tone: lime
  - id: CC-075F
    text: "246 km² of land; among the highest car density in Europe"
    finding: "246 km² is Malta island; the country has 313 km² of land [5]. With 1,014 cars per km² of land Malta is first in the EU, 3.9 times the Netherlands [3, 5]."
    rating: "Largely accurate"
    tone: lime
