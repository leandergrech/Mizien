claim:
  text: 'Lovin Malta (21 Sep 2024), citing a Eurostat dataset: Malta is ranked seventh in the EU, between Germany and
    Poland, with 585 passenger cars per 1,000 inhabitants. The article gives no year for the figure.'
  speaker: Lovin Malta (reporting Eurostat)
  date: '2024-09-21'
  wording_status: Verbatim found
  sources:
    - title: Malta Ranked Number Seven On Eurostat's 'Passenger Cars Per 1,000 Inhabitants' Dataset
      publisher: Lovin Malta (J. Darmanin)
      date: 21 Sep 2024
      url: https://lovinmalta.com/malta/malta-ranked-number-seven-on-eurostats-passenger-cars-per-1000-inhabitants-dataset/
      note: The claim, in the outlet's own words. Read in full on 6 Oct 2026 (page and WordPress API, post 148257). Names
        Eurostat and a graphic by Paula Lago via The European Correspondent 'up to the year 2022'; no year for the 585.
    - title: Passenger cars - per thousand inhabitants (road_eqs_carhab)
      publisher: Eurostat
      date: updated 30 Jul 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/road_eqs_carhab/default/table?lang=en
      note: Primary evidence. Retrieved 6 Oct 2026 with Eurostat's flags; rebuilt from road_eqs_carmot and demo_gind.
    - title: Passenger cars per 1 000 inhabitants reached 560 in 2022
      publisher: Eurostat
      date: 17 Jan 2024
      url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20240117-1
      note: Eurostat's release of the 2022 figures (EU 560; Italy 684; Latvia 414); does not mention Malta. Read 6 Oct 2026.
  quote: Malta is ranked number seven, just between Germany and Poland respectively, with 585 cars per 1,000 inhabitants.
counter_evidence: 'The figures are 2022''s, which the article does not say (it calls the dataset "as of 2023"). In Eurostat''s
  2023 figures as now published Malta is 11th (575); in 2025 it is 14th (571), below the EU-27 (584). The rate fell because
  the population grew faster than the car stock (end 2012 to end 2025: +39.6% against +34.5%); the number of cars rose every
  year. Side remarks: 585 per 1,000 is one car per 1.7 people, not one per two; 246 km2 is Malta island, the country has 313
  km2 of land (still the most cars per km2 in the EU). Malta''s count appears to be NSO''s licensed stock (second-hand),
  while other registers may include inactive cars.'
tests: Eurostat road_eqs_carhab (all countries and years, with flags), rebuilt from road_eqs_carmot (stock at 31 Dec) and
  demo_gind (population on 1 Jan of the next year) for all 27 Member States; reg_area3 land area; Eurostat's release of 17 Jan
  2024 and its Statistics Explained articles; recomputed with tools/cc-075-report/calc.py.
why_low_hanging: 'Done: Claim Check 075 report and flyer.'
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: 'The figure and rank are right for 2022, the year of the graphic the article used; the article gives no year.
  We could not see Eurostat''s dataset as it stood on 21 Sep 2024 (Wayback unreachable from our network), so whether any
  2023 values were already published is open. NSO figures are second-hand. Largely supported verdict: no right of reply
  needed.'
