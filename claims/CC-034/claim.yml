caveats: 'Draft verdict Not substantiated (moderate), pending right of reply from ERA. Missing evidence, not evidence
  against: flat PM10 does not prove the measures did nothing (car numbers +31%, 2013-2025). Wording rated: the six
  measures the plan names (our reading); read as any action that worked, the power-sector reform alone would meet the
  claim. No weather normalisation or traffic data; the 2023 PM10 count and the +8.1 µg/m³ after free public transport
  are single-site, single-year comparisons; the Msida monitor moved about 300 m in January 2024, so 2024-25 are not
  compared with earlier years, and the Msida Creek works lie 112 m from the old point (when work near it began is not
  verified). The plan''s Figure 26 was read off the PDF (±1 µg/m³ at the peaks) and its hour convention is not stated.
  ERA''s page and plan were read from Wayback copies saved on 5 Oct 2026 (plan pages 3, 21-67, 91 and 95 read; pp. 4-20,
  68-90 and 96-104 skimmed for effect estimates of the six measures, none found); ERA''s consultation report was not
  read. Scerri et al. (2016) and the EEA''s UTC+1 convention for hourly times are second-hand.'
