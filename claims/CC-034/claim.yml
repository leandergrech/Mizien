subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-034A
    text: "The reform in the power generation sector has contributed to improvements in air quality"
    finding: "Power-station sulphur oxides −99.8% and nitrogen oxides −90%, 2014 to 2018 (−99.9% and −95% from 2008; 55% of the sulphur fall came before 2015) [5]; SO₂ in the air −83% at Żejtun (2008–12 to 2018–23); Kordin already 2.6 µg/m³ in 2014 [3]; nickel down at Kordin (plan) [2]."
    rating: "Supported"
    tone: green
  - id: CC-034B
    text: "Grants for more sustainable transport have contributed"
    finding: "The plan gives uptake, not effect [2]. NO₂ at Msida −22%, matching the modelled −23% in road exhaust NOx from a newer fleet, which grants are one cause of [3, 5]; cars +31% [6]."
    rating: "Plausible, not shown"
    tone: amber
  - id: CC-034C
    text: "Free school transport (from 2018) has contributed"
    finding: "The plan’s NO₂ fall of “around 10 µg/m³” at rush hour does not reproduce: peak to peak −1.0 in the EEA data, and its 2014–17 baseline cannot be matched; autumn 2018 had the highest morning NO₂ of 2013–2023; a sustained fall of 11.5 came from 2019 and cannot be tied to the measure; the term-time change matches the Attard background [2, 3]."
    rating: "Not shown"
    tone: orange
  - id: CC-034D
    text: "Better ferry landing places and the fast ferry (2021) have contributed"
    finding: "The plan reports passengers only (1.6 million in 2018; about 42,000 in the fast ferries’ first month) [2]. No air data offered."
    rating: "No evidence offered"
    tone: orange
  - id: CC-034E
    text: "Free public transport for all (from October 2022) has contributed"
    finding: "The plan offers no measured effect [2]. In the year after it began, 10 of 11 station readings were higher; Msida PM10 +8.1 µg/m³, 90 days over 50 against 48 (one site, one year, no weather adjustment) [3]."
    rating: "Not shown"
    tone: orange
  - id: CC-034F
    text: "Msida exceeded the PM10 daily limit in 2018 and 2023 (the plan’s reason)"
    finding: "ERA’s reports: 41 and 52 days after natural deduction, 86 and 84 before; 35 allowed [4]. 2023 is the highest of 2015–2023 at the old Msida point; ERA’s 2024–25 counts (20, 23) are zone counts from other stations."
    rating: "Accurate"
    tone: green
