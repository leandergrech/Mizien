    note: "Power-sector (NFR 1A1a) and road-transport emissions; car stock."
  quote: "The plan outlines actions that have already yielded positive results for Malta's air quality, measures
    committed to by the Government for imminent implementation, and additional proposed measures designed to further
    enhance air quality in Malta."
counter_evidence: 'Power-sector reform is shown to have helped: power-station sulphur oxides fell 99.9% (2008-2018) and
  SO2 in the air fell 82% at Żejtun. NO2 and PM2.5 at the Msida roadside fell 22% and 17% (2015-17 to 2021-23), in step
  with a cleaner fleet, but no named transport measure is shown to have caused it. PM10 at Msida, the reason for the
  plan, did not improve: after ERA''s natural-source deduction 2023 had 52 days over the limit (35 allowed), the most of
  2015-2025, after free school transport, the fast ferry and free public transport began. The plan gives uptake or
  passenger figures, not air-quality effects, for grants, ferry landing places, the fast ferry and free public transport;
  its one test (free school transport, NO2 "around 10 µg/m³" lower at rush hour) does not reproduce in validated data
  (-1.0 µg/m³ at 07:00; autumn 2018 the highest morning NO2 of 2013-2023). In the 12 months after free public transport
  began, 10 of 11 station readings were higher than in the 12 months before.'
tests: EEA validated station data (AirBase, E1a) for PM10, PM2.5, NO2, SO2 and CO at every ERA station, 2006-2025;
  ERA's attainment reports (dataflow G) 2015-2025; Eurostat env_air_emis and road_eqs_carpda; traffic site vs
  background stations; before/after windows around each dated measure; the plan's own school-transport comparison
  recomputed (tools/cc-034-report/calc.py, data/cc-034/checks.csv).
why_low_hanging: 'Done: Claim Check 034 report and flyer.'
tags:
- Input-as-outcome
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: 'Draft verdict Not substantiated (moderate), pending right of reply from ERA. Missing evidence, not evidence
  against: flat PM10 does not prove the measures did nothing (car numbers +31%, 2013-2025). No weather normalisation or
  traffic data; the Msida monitor moved about 300 m in January 2024, so 2024-25 are not compared with earlier years.
  ERA''s page and plan were read from Wayback copies saved on 5 Oct 2026. Scerri et al. (2016) is second-hand.'
