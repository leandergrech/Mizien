claim:
  text: 'Environment and Resources Authority (Air Quality Plan for Malta 2025): the plan outlines actions that "have
    already yielded positive results for Malta''s air quality"; the plan names them as measures that "have already
    contributed to improvements in air quality in Malta", such as power-sector reform, grants for more sustainable
    transport, free school transport, better ferry landing places, the fast ferry and free public transport for all.'
  speaker: Environment and Resources Authority (ERA)
  date: '2025-03-12'
  wording_status: Verbatim found
  sources:
  - title: Air Quality Plan for Malta 2025
    publisher: ERA
    date: '2025'
    url: https://era.org.mt/air-quality-plan-for-malta-2024/
    note: Primary plan page; 403 to scripts. Page metadata gives datePublished 12 Mar 2025.
  - title: "Air Quality Plan for Malta 2025 (web page, Wayback capture of 15 Aug 2025)"
    publisher: "ERA"
    date: "15 Aug 2025"
    url: "https://web.archive.org/web/20250815211515/https://era.org.mt/air-quality-plan-for-malta-2024/"
    note: "The claim: the plan outlines actions 'that have already yielded positive results for Malta's air quality'.
      Read in full on 6 Oct 2026 from the copy saved through the Wayback Machine on 5 Oct 2026 (the archive was
      unreachable from this network on 6 Oct); SHA-256 in literature/CC-034/references.bib."
  - title: "Air Quality Plan for Malta (approved policy, PDF)"
    publisher: "ERA"
    date: "Jan 2025"
    url: "https://era.org.mt/wp-content/uploads/2025/02/DIGITAL-Air-Quality-Plan.pdf"
    note: "104 pages, ISBN 978-9918-628-10-0; read in full (pp. 3, 21-67, 91, 95) on 6 Oct 2026 from the Wayback copy
      saved 5 Oct 2026. Executive summary, p. 3: measures 'have already contributed to improvements in air quality'.
      Evidence of effect given only for the power-sector reform (pp. 57-58) and free school transport (pp. 59-60)."
  - title: "Air Quality download service: Malta, PM10, PM2.5, NO2, SO2, CO, all sampling points"
