claim:
  text: 'Environment and Resources Authority (Air Quality Plan for Malta 2025): the plan outlines actions that "have
    already yielded positive results for Malta''s air quality"; the plan names them as measures that "have already
    contributed to improvements in air quality in Malta", such as power-sector reform, grants for more sustainable
    transport, free school transport, better ferry landing places, the fast ferry and free public transport for all.'
  speaker: Environment and Resources Authority (ERA)
  date: '2025-03-12'
  wording_status: Verbatim found
