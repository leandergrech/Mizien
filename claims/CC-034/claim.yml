  quote: "The plan outlines actions that have already yielded positive results for Malta's air quality, measures
    committed to by the Government for imminent implementation, and additional proposed measures designed to further
    enhance air quality in Malta."
counter_evidence: 'Power-sector reform is shown to have helped: power-station sulphur oxides fell 99.8% in the reform
  years (2014-2018; 99.9% since 2008, but 55% of that fall came before 2015) and SO2 in the air fell 83% at Żejtun
  (2008-12 to 2018-23, leaving out 2011 with 28.5% of the year measured; the ships'' fuel-sulphur cap of 1 January 2020
  is a co-driver the data cannot separate); SO2 at Kordin was already 2.6 µg/m³ in 2014, before the reform. NO2 and
  PM2.5 at the Msida roadside fell 22% and 17% (2015-17 to 2021-23; NO2 -20% to 2022-23 alone), in step with a cleaner
  fleet, but no named transport measure is shown to have caused it. PM10 at Msida, the reason for the plan, did not
  improve: after ERA''s natural-source deduction 2023 had 52 days over the limit (35 allowed), the most of 2015-2023 at
  the old Msida point (ERA''s 2024-25 zone counts, 20 and 23, come from other stations and are not comparable), after
  free school transport, the fast ferry and free public transport began; a single-site, single-year comparison with no
  weather adjustment. The plan gives uptake or passenger figures, not air-quality effects, for grants, ferry landing
  places, the fast ferry and free public transport (plan pages 3, 21-67, 91 and 95 read; pp. 4-20, 68-90 and 96-104
  skimmed for effect estimates, none found). Its one test (free school transport, NO2 "around 10 µg/m³" lower at rush
  hour) does not reproduce in validated data: the peak falls by 1.0 µg/m³ (62.3 to 61.3 at Start 07; +0.7 on weekdays
  only); the plan''s 2018-19 curves reproduce only with hour-ending labels and its 2014-17 baseline does not reproduce
  under either labelling, so its gap sits in the baseline. A sustained fall of 11.5 µg/m³ in October-December
  weekday-morning NO2 (2013-17 to 2019-23) began in 2019, not 2018, and cannot be tied to the measure. In the 12 months
  after free public transport began, 10 of 11 station readings were higher than in the 12 months before.'
tests: EEA validated station data (AirBase, E1a) for PM10, PM2.5, NO2, SO2 and CO at every ERA station, 2006-2025;
  ERA's attainment reports (dataflow G) 2015-2025; Eurostat env_air_emis and road_eqs_carpda; traffic site vs
  background stations; before/after windows around each dated measure; the plan's own school-transport comparison
  recomputed, with a test of the hour labels of its Figure 26 against the EEA hourly profiles (tools/cc-034-report/
  calc.py, digitise_fig26.py, data/cc-034/checks.csv).
why_low_hanging: 'Done: Claim Check 034 report and flyer.'
