caveats: 'Largely supported: no right of reply needed. All inspection and compliance figures are OHSA''s own; the minister''s
  speech was not read in the parliamentary record; the 94 per 100,000 construction injury rate in the earlier counter-evidence
  was not found in the OHSA report and was not tested.'
