claim:
  text: 'The Occupational Health and Safety Authority (Annual Report 2025, tabled in parliament 1 July 2026): inspections
    more than doubled in 2025 (23,711 against 9,381), around 74% of construction sites were adequately compliant with safety
    requirements, and nine workers died in 2025.'
  speaker: Occupational Health and Safety Authority (OHSA)
  date: 2026-07-01
  wording_status: 'Verbatim found'
  sources:
    - title: Annual Report 2025
      publisher: Occupational Health and Safety Authority
      date: '2026-07-01'
      url: https://ohsa.mt/sites/default/files/2026-05/AR-OHSA-2025.pdf
      note: 'The claim, verbatim: s.4.3.1 p.42 (74%), s.8.3 and Table 14 p.67-68 (inspections), s.4.2.6 p.41 (nine deaths).
        Read 5 Oct 2026.'
    - title: Nine workers die on the job in 2025 as OHSA inspections more than double
      publisher: MaltaToday
      date: '2026-07-01'
      url: https://www.maltatoday.com.mt/news/national/142928/nine_workers_die_on_the_job_in_2025_as_ohsa_inspections_more_than_double
      note: "Locator: reports the minister tabling the report; 'more than doubled' is its paraphrase. Read via Internet Archive\
        \ copy."
    - title: Annual Reports 2023 and 2024
      publisher: Occupational Health and Safety Authority
      date: 2024-2025
      url: https://www.ohsa.mt/sites/default/files/2025-05/AR-OHSA-2024.pdf
      note: 'Context: five fatal accidents in each of 2023 and 2024; 9,381 inspections in 2024.'
    - title: Fatal accidents at work (hsw_n2_02); Population and employment (nama_10_pe)
      publisher: Eurostat
      date: updated 25 Sep / 2 Oct 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/hsw_n2_02/default/table
      note: Independent data, retrieved 5 Oct 2026 (data/cc-091/). 2025 not yet published.
  quote: Approximately 74% of sites were found to be adequately compliant with occupational health and safety requirements.
    … inspection numbers rising by a further 152.8% in 2025 … During 2025, nine fatal workplace accidents were recorded, resulting
    in the loss of nine workers’ lives.
counter_evidence: "Inspections: 23,711 in 2025 against 9,381 in 2024 (x2.53, +152.8%) and 2,585 in 2023; divisional totals\
  \ match. The 74% is OHSA's own rating of construction inspections as 'adequate' (21% orders, 5% stop-work orders); its base\
  \ and the meaning of 'adequate' are not stated, and 5% of all 19,296 construction inspections (about 965) exceeds the 526\
  \ stop orders issued in all sectors, so the percentages cannot cover all inspections. Nine deaths confirmed (Tables 1 and\
  \ 5; four Maltese, five third-country nationals; three construction, four transport and storage, two agriculture) against\
  \ five in 2023 and 2024; Eurostat's 2024 count is four, 2025 unpublished. Inspection and compliance data exist only from\
  \ OHSA."
tests: OHSA Annual Reports 2023-2025; Eurostat hsw_n2_02 and nama_10_pe (tools/cc-091-report/calc.py).
why_low_hanging: 'Done: Claim Check 091 report and flyer.'
