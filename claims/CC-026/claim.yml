caveats: No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading
  or Contradicted). The figure reports a Eurostat estimate on the residence principle; the territorial inventory shows
  +1.6% (2015-2024). 2025 is an early estimate. Central Bank of Malta report not read (second-hand). No operator is assessed. The Newsbook page was not reachable on 6 Oct 2026 (connection refused, Wayback blocked); its date of 18 Jun 2026 is corroborated by the Malta News Agency copy dated 18 Jun 2026 and by search results, and the author (Damian Micallef) is as recorded when the article was read in full on 5 Oct 2026.
