claim:
  text: 'Newsbook, reporting Eurostat: Malta recorded the EU''s largest rise in greenhouse gas emissions, an estimated
    169.4% between 2015 and 2025.'
  speaker: Newsbook (reporting Eurostat)
  date: 2026-06-18
  wording_status: Verbatim found
  sources:
  - title: Malta records EU's largest rise in greenhouse gas emissions
    publisher: Newsbook
    date: 18 Jun 2026
    url: https://newsbook.com.mt/en/malta-records-eus-largest-rise-in-greenhouse-gas-emissions/
    note: The claim. By Damian Micallef; read in full 5 Oct 2026. Newsbook reports Eurostat; the wording tested is the outlet's. The quote is the article's opening line (the headline is 'Malta records EU's largest rise in greenhouse gas emissions').
  - title: 'EU economy greenhouse gas emissions: -17% since 2015'
    publisher: Eurostat
    date: 16 Jun 2026
    url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20260616-2
    note: Eurostat's own release; Malta +169.4%.
  - title: Air emissions accounts by NACE Rev. 2 activity (env_ac_ainah_r2)
    publisher: Eurostat
    date: updated 7 Aug 2026
    url: https://ec.europa.eu/eurostat/databrowser/view/env_ac_ainah_r2/
    note: Recomputed +169.7% after revision; air transport 98.6% of the 2015-2024 rise.
  - title: Greenhouse gas emissions by source sector (env_air_gge)
    publisher: Eurostat
    date: updated 2 Jun 2026
    url: https://ec.europa.eu/eurostat/databrowser/view/env_air_gge/
    note: Territorial inventory +1.6% 2015-2024.
  quote: Malta recorded the highest increase in greenhouse gas emissions among European Union member states over the past decade, according to new estimates published by Eurostat. The EU's statistical agency reported that Malta's emissions rose by an estimated 169.4% between 2015 and 2025.
counter_evidence: Eurostat's air emissions accounts follow the residence principle (emissions of resident units wherever they occur); air transport rose from 444 to 4,730 kt CO2e in 2015-2024 and is 98.6% of the increase. The territorial inventory (UNFCCC) rose 1.6% in 2015-2024 and is 27% below 2005. Malta excluding air transport +2.9%.
tests: Eurostat env_ac_ainah_r2 vs UNFCCC inventory; aviation share.
why_low_hanging: 'Done: Claim Check 026 report and flyer.'
