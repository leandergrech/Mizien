priority: Queue
data_readiness: 'High: Eurostat, NSO and EEA reachable; the Council-hosted PDF was read via WebFetch.'
caveats: 'Candidate from the weekly intake of 5 Oct 2026. Municipal and total waste may be mixed in the passage: check the
  footnoted source before testing. The 2025 Environmental Implementation Review (CC-004, CC-005) is a separate Commission
  document.'
