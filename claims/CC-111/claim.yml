id: CC-111
title: 'EU: 621 kg of waste a head, 74% landfilled'
category: Waste
subtopic: Landfill & treatment
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'European Commission (2026 Country Report - Malta, 3 Jun 2026): Malta generated 621 kg of waste per person in 2024
    against an EU average of 517 kg, and its landfill rate fell from 82% to 74% over ten years but remains well above the
    EU average of 22% (2023).'
  speaker: European Commission
  date: '2026-06-03'
  wording_status: Verbatim found
  sources:
    - title: 2026 Country Report - Malta, SWD(2026) 218 final (Council doc. 10135/26 ADD 1)
      publisher: European Commission (via Council of the EU)
      date: '2026-06-03'
      url: https://data.consilium.europa.eu/doc/document/ST-10135-2026-ADD-1/en/pdf
      note: 'The claim. Full text read 5 Oct 2026: Annex 8 p. 75 (quoted passage; footnotes 156 and 158 cite Eurostat env_wasmun)
        and summary pp. 17-18.'
    - title: Municipal waste by waste management operations (env_wasmun)
      publisher: Eurostat
      date: updated 30 Mar 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/env_wasmun/default/table
      note: Primary data, retrieved 5 Oct 2026; extract and checks in data/cc-111/.
  quote: Waste generation is still high with 621 kg per person generated in 2024 (compared with the EU average of 517 kg per
    person) … Over the last 10 years, Malta has brought its landfill rate down from 82% to 74%. However, this is still one
    of the highest in the EU, and well above the EU average of 22% (2023).
counter_evidence: 'All figures reproduce from Eurostat env_wasmun: 621 kg (EU 517 kg, provisional) in 2024; landfilled as
  a share of waste generated 82.0% in 2013 and 73.6% in 2023 (72.1% in 2024); incineration 2.7% in 2023. Malta is 3rd-highest
  for the landfill rate in 2023 (after Greece and Romania) and highest of 20 states with 2024 data; 6th-highest for waste
  per person in 2024. EU-27 2023 landfill rate not published (22.6% in 2022, 21.3% in 2024). The fall from 82% to 74% came
  mostly in 2023 (83.3% in 2022). The Shift''s 79.2% (CC-081) is the 2024 share of waste treated, a different denominator.'
tests: Eurostat env_wasmun for Malta, the EU-27 and all member states, recomputed with tools/cc-111-report/calc.py.
