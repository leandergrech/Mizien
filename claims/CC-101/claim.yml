data_readiness: 'High: Commission text, legislation.mt, EWA documents, Eurostat and WISE readable; ERA and the 3rd RBMP refuse
  scripts.'
caveats: 'Largely supported: no right of reply needed. The verdict covers the Commission''s first sentence (registration of surface-water
  abstraction; prior authorisation to control abstraction), rated on the facts we could check (no register of surface-water
  abstraction and no permit to abstract water in the instruments read). The second sentence (periodic review, sub-claim D) and
  whether a register of groundwater sources amounts to a "prior authorisation regime" are legal questions and are not rated;
  sub-claim A (what the Directive requires) is the Commission''s premise and is not rated. No legal opinion is given. The claim is
  the Commission''s published summary; the letter of formal notice and Malta''s reply are not public. "Not found" statements rest
  on a bounded search listed in literature/CC-101/notes.md (instruments read, titles of 943 Legal Notices, text of 101 Acts and
  titles of 344 subsidiary instruments; none found in force on 6 Oct 2026). The record''s title condenses the Commission''s first
  sentence and is not itself rated; Malta issues permits to drill boreholes, not to abstract water. Do not read the notice as
  evidence of actual over-abstraction; groundwater status is in CC-009 and CC-047.'
