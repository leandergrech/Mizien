id: CC-101
title: 'EU: no permits for water abstraction'
category: Water
subtopic: Water supply & groundwater
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'European Commission (July infringements package, 8 July 2026, summarising its letter of formal notice INFR(2026)2115):
    Malta has failed to put in place a registration requirement for surface-water abstraction and a prior authorisation regime
    to control the abstraction of surface and groundwater, and Maltese law does not ensure a periodic review of those controls.'
  speaker: European Commission
  date: '2026-07-08'
  wording_status: Verbatim found
  sources:
    - title: 'July infringements package: key decisions (INF/26/1376)'
      publisher: European Commission (press corner)
      date: '2026-07-08'
      url: https://ec.europa.eu/commission/presscorner/detail/en/inf_26_1376
      note: The claim. Read in full on 6 Oct 2026 via the press corner's print PDF; section 1, item "Commission calls on Spain
        and Malta to ensure periodic review of water permits". Summary of the letter of formal notice, which is not published.
    - title: 'July infringements package: key decisions'
      publisher: European Commission Representation in Malta
      date: '2026-07-08'
      url: https://malta.representation.ec.europa.eu/news/july-infringements-package-key-decisions-2026-07-08_en
      note: Same wording, read 6 Oct 2026. A letter of formal notice is an opening step, not a finding by the Court.
    - title: Green Paper on the Regulation of Groundwater Abstraction in the Maltese Islands
      publisher: Energy and Water Agency and Environment and Resources Authority
      date: November 2023
      url: https://energywateragency.gov.mt/wp-content/uploads/2023/11/GREEN-PAPER.pdf
      note: Primary evidence. Proposes abstraction permits or clearances issued by ERA, renewable for fixed terms; borehole counts.
        Read in full 6 Oct 2026.
    - title: Interim reporting on the implementation of the Programme of Measures identified under the 3rd RBMP
      publisher: Government of Malta (hosted by the Energy and Water Agency)
      date: April 2025
      url: https://energywateragency.gov.mt/wp-content/uploads/2025/12/Interim-Report-2025-Final-Version.pdf
      note: Primary evidence. Section 3.3 (Article 11(3)(e)) and Measure 053, "close to being finalised". Read in full 6 Oct 2026.
    - title: Notification of Groundwater Sources Regulations (S.L. 549.164) and Borehole Drilling and Excavation Works within the
        Saturated Zone Regulations (S.L. 549.165)
      publisher: Laws of Malta (legislation.mt)
      date: 2008, consolidated
      url: https://legislation.mt/eli/sl/549.164/eng
      note: Primary evidence. Registration of groundwater sources and drilling permits; both state they give no right to draw water.
        Read in full 6 Oct 2026, with S.L. 549.100, 549.166, 549.168, 549.172 and 545.14.
    - title: Second River Basin Management Plans - Member State Malta, SWD(2019) 48 final
      publisher: European Commission
      date: 26 Feb 2019
      url: http://publications.europa.eu/resource/celex/52019SC0048
      note: The Commission's earlier description of Malta's Article 11(3)(e) controls ("a concession, authorisation and/or
        permitting regime to control groundwater"). Read 6 Oct 2026.
  quote: Malta has failed to put in place a registration requirement for surface water abstraction and a prior authorisation
    regime to control the abstraction of surface and groundwater. In addition, Maltese law does not ensure a periodic review of
    the controls over the abstraction of surface and groundwater having a significant impact on water bodies.
counter_evidence: 'Malta does control groundwater sources: every source had to be notified by 20 Nov 2008 (S.L. 549.164), drilling
  is under a moratorium (S.L. 549.165), most private sources are metered (S.L. 549.166), and ERA can order a source closed or
  its abstraction cut. Malta''s April 2025 report says "Only these registered sources are permitted to extract groundwater",
  and in 2019 the Commission''s own staff described "a concession, authorisation and/or permitting regime to control groundwater"
  (SWD(2019) 48). S.L. 549.100 reg. 12(3)(e) repeats the Directive''s duty to review abstraction controls. Against that: both
  regulations say notification and drilling permits give no right to draw water, no instrument read authorises abstraction,
  and the Government''s 2023 Green Paper and 3rd-plan Measure 053 propose creating abstraction permits (not in force on 6
  Oct 2026).'
tests: Water Framework Directive Art. 11(3)(e), 11(5), 11(7) and 24; Maltese law on legislation.mt (S.L. 549.100, 549.164-549.166,
  549.168, 549.172, 545.14, Cap. 549, Cap. 355) and the titles of all 2024-2026 Legal Notices; the 2023 Green Paper, Malta's
  April 2025 interim report and 2nd water plan; Commission SWD(2019) 48, COM(2025) 2 and SWD(2025) 13; Eurostat env_wat_abs
  and EEA WISE 2022 reporting, recomputed with tools/cc-101-report/calc.py.
why_low_hanging: 'Done: Claim Check 101 report and flyer.'
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: Commission text, legislation.mt, EWA documents, Eurostat and WISE readable; ERA and the 3rd RBMP refuse
  scripts.'
caveats: 'Largely supported: no right of reply needed. The claim is the Commission''s published summary; the letter of formal notice
  and Malta''s reply are not public. No legal opinion is given: whether Maltese law "ensures" periodic review (sub-claim D) is
  not rated, and whether a closed register amounts to "prior authorisation" is for the Commission and the Court. "Not found"
  statements rest on a bounded search listed in literature/CC-101/notes.md. The record''s headline is the intake''s shorthand:
  Malta issues permits to drill boreholes, not to abstract water. Do not read the notice as evidence of actual over-abstraction;
  groundwater status is in CC-009 and CC-047.'
