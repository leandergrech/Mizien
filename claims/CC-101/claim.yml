subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-101A
    text: "The Directive requires abstraction controls, with registers and prior authorisation, reviewed periodically (the Commission’s premise, not its words)"
    finding: "Not rated as a statement of the speaker. For context, Article 11(3)(e) says so; abstractions with no significant impact on water status may be exempted [3]."
    rating: "Premise, not rated"
    tone: grey
  - id: CC-101B
    text: "Malta has failed to put in place a registration requirement for surface water abstraction"
    finding: "Rated on the facts: no instrument read requires registration of surface-water abstraction. Malta’s register covers groundwater sources only [5]; no surface-water provision in the instruments, Acts and titles searched [4–9, 21]; Malta’s 2nd plan notes a “lack of knowledge” of surface-water abstraction [12]. Surface water is small: three watercourses (3.4 km), two pools [17]; Eurostat estimates 2.96 million m³ a year [16]."
    rating: "Accurate (laws searched)"
    tone: green
  - id: CC-101C
    text: "Malta has failed to put in place a prior authorisation regime to control the abstraction of surface and groundwater"
    finding: "Rated on the facts: no permit to abstract water in the instruments read. Notification and drilling permits give no right to draw water [5, 6]; the Green Paper and 3rd plan treat an abstraction permit as still to be created [10, 11], and we found none in force [21]. Caveat: the instruments do contain a register of groundwater sources, drilling permits judged on impact on water resources (reg. 7(3)), metering, and powers to close a source or reduce abstraction [5–7]; Malta’s 2025 report describes the register as the control [11]. Whether these are a “prior authorisation regime” is a legal question, not rated (section 6, Q1)."
    rating: "Largely accurate (on the facts)"
    tone: lime
  - id: CC-101D
    text: "Maltese law does not ensure a periodic review of the controls over the abstraction of surface and groundwater having a significant impact on water bodies"
    finding: "S.L. 549.100 copies the Directive’s review duty (reg. 12(3)(e)) and provides for review of permits and authorisations where objectives are at risk (reg. 12(5)(b)) and of programmes every six years (reg. 12(8)) [4]; the instruments that run the controls set no term, renewal or review for a notified source, while drilling permits may carry a term and be suspended (regs 8(3)(a), 11) [5–7]; the Green Paper proposes fixed terms and periodic review [10]. Whether this “ensures” review is a legal question (section 6, Q2)."
    rating: "Not rated (legal assessment)"
    tone: grey
