subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-101A
    text: "The Directive requires abstraction controls, with registers and prior authorisation, reviewed periodically"
    finding: "Article 11(3)(e) says so; abstractions with no significant impact on water status may be exempted [3]."
    rating: "Accurate"
    tone: green
  - id: CC-101B
    text: "Malta has no registration requirement for surface-water abstraction"
    finding: "Malta’s register covers groundwater sources only [5]; no surface-water provision in the instruments searched [4–9, 21]; Malta’s 2nd plan notes a “lack of knowledge” of surface-water abstraction [12]. Surface water is small: three watercourses (3.4 km), two pools [17]; Eurostat estimates 2.96 million m³ a year [16]."
    rating: "Accurate (laws searched)"
    tone: green
  - id: CC-101C
    text: "Malta has no prior authorisation regime to control the abstraction of surface and groundwater"
    finding: "No instrument grants or conditions permission to abstract; notification and drilling permits give no right to draw water [5, 6]; the Government proposes the first abstraction permits, not in force on 6 Oct 2026 [10, 11, 21]. But the register has been closed since 2008 and Malta treats registration as permission to pump [11]; the Commission’s staff called it an authorisation regime in 2019 [13]."
    rating: "Largely accurate"
    tone: lime
  - id: CC-101D
    text: "Maltese law does not ensure a periodic review of abstraction controls"
    finding: "S.L. 549.100 copies the Directive’s review duty [4]; the instruments that run the controls set no term, renewal or review [5–7]; the Green Paper proposes fixed terms and periodic review [10]. Whether the copied duty “ensures” review is a legal question (section 6, Q2)."
    rating: "Not rated (legal assessment)"
    tone: grey
