caveats: No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading or Contradicted). The claimant is an EU-commissioned study; the opinions are the authors', not the Parliament's. The study's Malta health figures (20 deaths, 100 DALYs per 100,000) pre-date the EEA's correction of 27 Mar 2026; we did not open the June 2025 version, so the cause of the difference is inferred. EEA health burdens are modelled and cross-country ranks are indicative (EEA s. 1.5). The size of any underestimate for Malta is not quantified. Distinct from CC-020 (the Directive's transposition).
