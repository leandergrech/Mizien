id: CC-051
title: '''Over 30% of our seas protected'''
category: Nature & Wildlife
subtopic: Marine protection
status: Drafted
verdict: Misleading
verdict_confidence: Moderate
claim:
  text: 'Environment Minister Miriam Dalli (2025, as quoted by Amphora Media): ''Malta protects more than 30% of
    its maritime zone''. ERA: the marine Natura 2000 network of 18 sites covers over 4,100 km2, ''more than 35%
    of Malta''s Fisheries Management Zone''.'
  speaker: Miriam Dalli, Environment Minister; Environment and Resources Authority (ERA)
  date: '2025'
  wording_status: Verbatim found
  sources:
  - title: Marine Protected Areas
    publisher: Environment and Resources Authority
    date: n/d
    url: https://era.org.mt/topic/marine-protected-areas-2/
    note: ERA's qualified wording (FMZ). Read in a browser 4 Oct 2026.
  - title: 'FATTI: Does Malta protect about one-third of its seas?'
    publisher: Amphora Media
    date: Aug 2025
    url: https://www.amphora.media/2025/08/fatti-malta-protect-sea-marine-environment
    note: Quotes the minister (second-hand) and ERA 2021; prior fact-check.
  quote: Malta protects more than 30% of its maritime zone, through Natura 2000 sites, scientific monitoring, and
    a €2 million conservation programme.
counter_evidence: 'Mapped from EEA boundaries, Malta''s 18 marine Natura 2000 sites cover 4,137.5 km2 of sea, and
  all of it lies within 25 nautical miles of the coast. That is 36.0% of the 25-nm Fisheries Management Zone (11,480
  km2), which ERA names, but 7.8% of the EEZ as mapped internationally (52,923 km2) and 5.5% of the 75,715 km2 of
  sea Malta reports to the EU. Beyond 25 nm, about 64,000 km2 (85% of the waters reported to the EU) contains no
  marine protected site; even protecting the whole 25-nm zone would cover 15% of those waters. The deep sea (over
  1,000 m, a quarter of the waters) is 0.6% protected. Reaching 30% on the EU basis needs ~18,600 km2 more. The
  minister''s ''maritime zone'' does not name the 25-nm zone.'
tests: EEA Natura 2000 boundaries (2024); Fisheries Management Zone rebuilt from the Marine Regions 12-nm limit; Marine
  Regions EEZ v12; EEA map of the marine waters reported under the MSFD; EMODnet depth grid; BISE country page.
why_low_hanging: 'Done: Claim Check 051 report and flyer (v1.1 adds maps of all of Malta''s reported waters).'
