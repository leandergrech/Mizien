id: CC-029
title: First offshore wind farm
category: Climate & Energy
subtopic: Renewables
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Energy Ministry (22 Jul 2025): Malta''s first floating offshore wind farm, of approximately 300 MW, will be located
    beyond Malta''s territorial waters; three submissions were received to the first (qualification) stage; the plan was to
    inform candidates who qualify for the next phase by the first part of 2026.'
  speaker: Energy Ministry (Minister Miriam Dalli); Interconnect Malta
  date: '2025-07-22'
  wording_status: Verbatim found
  sources:
  - title: Three Applications Submitted in Malta's First Offshore Wind Tender
    publisher: offshoreWIND.biz
    date: 23 Jul 2025
    url: https://www.offshorewind.biz/2025/07/23/three-applications-submitted-in-maltas-first-offshore-wind-tender
    note: Trade report of the three submissions (23 Jul 2025); page text only, read in part. Locates the timeline; not used
      as evidence of the ministry's wording.
  - title: Three submissions presented for the first offshore wind farm concession in Malta
    publisher: TVM News
    date: 22 Jul 2025
    url: https://tvmnews.mt/en/news/three-submissions-presented-for-the-first-offshore-wind-farm-concession-in-malta/
    note: Energy Ministry statement (about 300 MW, beyond territorial waters) and a direct quote from Minister Dalli. Read
      5 Oct 2026.
  - title: Three firms bid for Malta's first offshore wind farm concession
    publisher: Newsbook
    date: 22 Jul 2025
    url: https://newsbook.com.mt/en/three-firms-bid-for-maltas-first-offshore-wind-farm-concession/
    note: 'Next stage to qualifying candidates "by early next year" (Newsbook''s wording). Newsbook (Jurgen Balzan, 22 Jul 2025,
      17:58) reports Dalli describing the announcement as "an important step forward for the project and a clear signal that
      the process has truly kicked off" (Newsbook''s text; TVM paraphrases it without quotation marks). Text checked in the
      Internet Archive copy of 22 Jul 2025, 6 Oct 2026.'
  - title: Offshore Renewable Energy Project
    publisher: InterConnect Malta
    date: read 6 Oct 2026
    url: https://icm.mt/projects/offshore-renewable-energy-project/
    note: 'Project description: about 300 MW, beyond 12 nautical miles, up to 0.8 TWh a year, competitive dialogue.'
  - title: 'Offshore floating wind farm: ICM issues tender to collect data on wind, wave conditions'
    publisher: InterConnect Malta
    date: 22 Apr 2026
    url: https://icm.mt/offshore-floating-wind-farm-icm-issues-tender-to-collect-data-on-wind-wave-conditions/
    note: EUR 3.6 million metocean tender; about 25% of 2025 demand.
  - title: Supply, transformation and consumption of electricity (nrg_cb_e), Malta
    publisher: Eurostat
    date: retrieved 6 Oct 2026
    url: https://ec.europa.eu/eurostat/databrowser/view/nrg_cb_e/default/table
    note: Scale check only (Malta electricity supplied and final consumption, 2025 provisional); it does not test ICM's output
      figure or the project.
  quote: '"What was once an exploratory initiative has now entered a structured phase" (Minister Miriam Dalli). Ministry statement
    as reported by TVM News, not in quotation marks: located "beyond Malta''s territorial waters"; "installed capacity of
    approximately 300MW"; "The current plan is to inform candidates who qualify for the next phase by the first part of next
    year."'
counter_evidence: 'No public notice found that qualifying candidates were informed, or that the dialogue stage was issued, by
  6 Oct 2026: none of the 22 posts ICM published between 1 Jun 2025 and 3 Oct 2026 (website post list) and nothing on its tenders
  page; web searches found none (log in literature/CC-029/notes.md). ICM issued a EUR 3.6 million metocean tender on 22 Apr
  2026 for two years of site data. MaltaToday (4 Aug 2025, read via the Internet Archive; live page 403) reports the minister,
  answering a parliamentary question, putting the dialogue stage around April 2026 and contractor selection towards the end of
  2027. A private notice cannot be excluded.'
tests: Tender notices; Interconnect Malta updates; NECP wind assumptions.
why_low_hanging: A specific, attributable statement that public data can test.
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: 'Mixed check: the facts (capacity, position, three submissions, output) are rated; the timetable is a pledge rated
  Off track (as of 6 Oct 2026) on the absence of a public notice, not on a statement that the step was missed. The ministry''s
  own release was refused to scripts: the statement is read via TVM News and Newsbook; only the minister''s words are in quotation
  marks. Tender documents and the NECP offshore wind assumption were not read. Pledge label Off track: pending right of reply. Absence of a notice rests on ICM''s public post list (22 posts from 1 Jun
  2025), its tenders page and web searches.'
