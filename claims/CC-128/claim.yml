id: CC-128
title: 'EU: Malta missed the water-plan timetable'
category: Governance & Promises
subtopic: Accountability
status: Drafted
verdict: Largely supported
verdict_confidence: High
claim:
  text: 'European Commission, Staff Working Document SWD(2026) 702 final, Malta (2 Oct 2026): ''Malta did not consult on,
    adopt or report the RBMP according to the WFD timetable.'' The document says Malta''s single national river basin management
    plan was published in March 2024, against a reporting deadline for third plans of March 2022, and that integration between
    the Water Framework, Floods and Marine Strategy Directives is ''insufficiently described''.'
  speaker: European Commission
  date: '2026-10-02'
  wording_status: Verbatim found
  sources:
  - title: 'Commission Staff Working Document: Third River Basin Management Plans, Second Flood Hazard and Risk Maps and Second
      Flood Risk Management Plans, Member State: Malta, SWD(2026) 702'
    publisher: European Commission (copy on the Austrian Parliament website)
    date: '2026-10-02'
    url: https://www.parlament.gv.at/dokument/XXVIII/EU/94981/imfname_11680004.pdf
    note: The claim. Full text read on 18 Oct 2026. Sentence in the assessment of consultation and adoption; the 2022 deadline
      and March 2024 publication are in the same document.
  quote: Malta did not consult on, adopt or report the RBMP according to the WFD timetable.
counter_evidence: "Nothing found that contradicts the statement. Context rather than counter-evidence: the Commission's 2025 report says many Member States adopted late and that it launched proceedings against all of them (COM(2025) 2, section 2), and Malta was one of five with neither river basin nor flood risk plans submitted at its 30 Sep 2023 cut-off. The Directive's publication date for the third plan is 22 Dec 2021 (Art. 13(7)); the Commission's 'March 2022' is the Art. 15 reporting date. The exact day of publication in March 2024 was not confirmed (ERA pages 403; their dates are second-hand)."
tests: WISE/EEA reporting dates for Malta's third RBMP; Energy and Water Agency consultation notices and the adoption notice
  (dates); WFD Article 13 and 14 timetable; the Commission's WFD implementation report; compare with other Member States'
  lateness in the same SWD series.
why_low_hanging: Dates on a public timeline that can be checked against the regulator's own notices.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium to high: the Commission text was read; the Energy and Water Agency site and WISE are reachable except
  possibly era.org.mt (403).'
caveats: "No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading or Contradicted). The check is of dates only: a late plan says nothing about its content, and the Commission's remark that coordination between the WFD, Floods and Marine Strategy Directives is 'insufficiently described' is not rated (we did not read the plan). Third RBMP, ERA's consultation and adoption pages (403) and the WISE delivery record were not read; ERA's consultation dates (20 Sep 2023 to 18 Mar 2024; significant-issues consultation 19 Aug 2020 to 19 Feb 2021) are second-hand (web-search summary). BirdLife Malta's comments, dated 18 Mar 2024 on the draft, are first-hand. Same source document as CC-127; related to CC-101, CC-117, CC-118 and CC-009 in subject."
