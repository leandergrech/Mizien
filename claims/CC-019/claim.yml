subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-019A
    text: "About 830,000 m² of green land built up 2018–2023"
    finding: "Amphora’s polygons add up to 828,429 m² (two, 4,429 m², were sea in 2018). Imagery confirms green to grey for 72.5% of a random sample of the area (57–84%; about 600,000 m²), but only 55% by May 2023 (about 456,000 m²); 15% was being developed by September 2018. True for 2018–2025, not for the period stated."
    rating: "Partly supported"
    tone: amber
  - id: CC-019B
    text: "0.26% of land; comparisons (pitches, Comino, Manoel)"
    finding: "Arithmetic checks out (Comino: 0.24 of the 3.5 km² often quoted, 0.30 of the OSM outline; Manoel: 2.7, not two)."
    rating: "Supported"
    tone: green
  - id: CC-019C
    text: "Nearly 95% of take-up was farmland"
    finding: "Cropland + grass = 96% of the area with a known 2018 class (our reading of the basis), but only if all grass is farmland; 37% has no class. In imagery, fields were 59% of the sampled land (43–73%), 64% with orchards; 36% was scrub or garrigue."
    rating: "Not substantiated"
    tone: orange
  - id: CC-019D
    text: "EEA figures and the 1.94 km² total"
    finding: "CORINE change maps: 20.6 ha (2006–12) and 93.7 ha (2012–18) [9]; EEA chart 0.91–0.94 km² [7]; sum correct."
    rating: "Supported"
    tone: green
