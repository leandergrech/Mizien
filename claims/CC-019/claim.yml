    text: "About 830,000 m² of green land built up 2018–2023"
    finding: "Amphora’s polygons add up to 828,429 m² (two, 4,429 m², were sea in 2018). An independent model flags largely different land and can neither confirm nor rule out the figure."
    rating: "Plausible"
    tone: lime
