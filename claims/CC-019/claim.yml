counter_evidence: 'Independent check with Impact Observatory/Esri 10 m land cover (2017-2023): consistent new built-up
  1.9 km2 gross, 1.4 km2 net (3-year rule); 5.0 / 3.0 km2 (2-year rule), so 0.83 km2 is plausible and conservative.
  Arithmetic (0.26%, 116 pitches, 1.94 km2 since 2006) checks out. Previous cover: 65% crops, 31% rangeland, 4%
  bare, so the ''nearly 95% farmland'' share is not reproduced. EEA figures second-hand.'
