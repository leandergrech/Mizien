claim:
  text: 'Amphora Media (Green to Grey, 11-12 Sep 2026): nearly 830,000 square metres of nature and cropland were
    built up in Malta between 2018 and 2023 (headline: ''over 830,000''), 0.26% of land; in nearly 95% of the take-up,
    farmland rather than natural area was affected.'
  speaker: Amphora Media
  date: '2026-09-11'
  wording_status: Verbatim found
  sources:
  - title: 'Green To Grey: Malta Lost Over 830,000 Square Metres Of Land To Development In Five Years'
    publisher: Amphora Media
    date: Sep 2026
    url: https://www.amphora.media/2026/09/green-to-grey-malta-land-loss-development-construction
    note: Media claim; locate its data source and method. Read in full 4 Oct 2026 (print copy supplied by maintainer).
  - title: 'Green to Grey: When Development Creeps Up On Agricultural Land'
    publisher: Amphora Media
    date: Sep 2026
    url: https://www.amphora.media/2026/09/green-to-grey-development-agricutlural-land
    note: Companion piece. Read in full 4 Oct 2026 (print copy supplied by maintainer).
  - title: Green to Grey change polygons for Malta (malta-change.geojson)
    publisher: Amphora Media
    date: 30 Aug 2026
    url: https://www.amphora.media/greentogrey/data/malta-change.geojson
    note: The data behind the map (397 polygons). Retrieved 5 Oct 2026, SHA-256 cf250ece689bec333d8e4852aaa9b53abf492ba971ad2e2a47d4fe9a04fcf320;
      licence not stated, so not committed (data/cc-019/amphora_record.csv).
  quote: nearly 830,000 square metres of nature and cropland have been built up in Malta between 2018 and 2023
counter_evidence: 'v1.2: Amphora''s published polygons (397) cover 828,429 m2, so ''nearly 830,000'' is reproduced
  (the headline''s ''over'' is not). Spatial cross-check with Impact Observatory/Esri 10 m land cover (2017-2025):
  the model already maps 68% of Amphora''s area as built-up in 2018 (61% in all of 2017-19), classes only 6-14% of
  it as newly built, and only 2-3% of its own new built-up land lies inside Amphora''s polygons (5-7% within 20 m);
  its national net total ranges from -0.06 to 2.96 km2 depending on the rule and years. So the model measures
  different land and neither confirms nor rules out 0.83 km2 (v1.1 had read it as corroboration). ''Nearly 95%'':
  cropland + grass = 96% (95.3-95.7%) of the area with a known 2018 class in Amphora''s own data (our reading of the
  basis), counting Dynamic World ''grass'' (which includes natural meadows) as farmland and leaving out the 37% of
  the area with no class; cropland alone is 22% of the whole. Two polygons (4,429 m2) were sea in 2018. Arithmetic
  (0.26%, 116 pitches, 1.94 km2 since 2006) checks out. EEA CORINE change maps: 20.6 ha (2006-12) and 93.7 ha
  (2012-18) of new artificial land, matching the 190,000 and 920,000 m2 quoted; changes under 5 ha are not mapped.'
tests: Amphora's published change polygons; Impact Observatory LULC v2 (Planetary Computer 2017-2023, Esri
  2017-2025); EEA CORINE change layers 2006-2012 and 2012-2018; OSM island areas; Amphora articles read in full.
why_low_hanging: 'Done: Claim Check 019 report and flyer.'
