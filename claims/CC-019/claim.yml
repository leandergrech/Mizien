  - date: 2026-10-05
    step: version
    version: "1.1"
    correction: true   # this version corrects errors in an earlier one
    note: "Corrections. (1) Periods of the independent estimates: “2018–2023” → land first mapped as built in 2020–21 (3-year rule) and 2019–22 (2-year rule), which is what the rules can detect (TL;DR, tile, sections 3, 4, 5 and 6, limitations, Figure 2 labels and caption). (2) Comino: “about 0.3 of Comino, as stated” → Amphora says “roughly a quarter”; 830,000 m² is 0.24 of the 3.5 km² often quoted and 0.30 of the 2.8 km² OpenStreetMap outline. (3) Simple comparison: “would give 24 km²” → 24 km² of newly built-up pixels, 18.9 km² net (now saved in data/cc-019/io_lulc_change.csv). (4) Year-to-year noise: “more than 15 km², twenty times the change” → 3 to 27 km², the largest over thirty times 0.83 km²; flyer “15 km² a year” → “up to 27 km² from year to year”. (5) The TL;DR now says the two estimates are not like for like. Verdict and confidence unchanged."
  - date: 2026-10-05
    step: version
    version: "1.2"
    note: "Upgrade. (1) Amphora’s published change polygons [8] measured: 397 polygons, 828,429 m², so “nearly 830,000” is reproduced and the headline’s “over” is not. (2) Spatial cross-check with the independent model: “an independent measurement finds more, not less” and “plausible and conservative” → the model already maps 68% of Amphora’s area as built-up in 2018, 6–14% as new, and only 2–3% of its new built-up land lies inside Amphora’s polygons, so it neither confirms nor rules out the figure (TL;DR, tiles, sections 2–8, flyer). (3) The 2024 and 2025 maps added from Esri’s service (identical to the earlier maps for 2017–2023): net totals −0.06 to 2.96 km² by rule. (4) Sub-claim A “supported” → “plausible”; sub-claim C “not shown” → “needs context”: cropland + grass = 96% of the area with a known 2018 class (our reading of the basis of “nearly 95%”). (5) Sub-claim D: the 2006–2012 EEA figure checked with the CORINE change map (20.6 ha; 93.7 ha for 2012–2018). (6) New Figure 1 (Amphora’s polygons over the model’s new built-up land), replacing the map of new built-up pixels; Figure 2 redrawn with four rules and Amphora’s own 2018 classes. Verdict and confidence unchanged."
