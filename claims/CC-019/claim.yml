caveats: Right of reply to Amphora Media not yet sent. Imagery spot-check classified by eye by us on 40 draws
  (interval about +/-13 points); no imagery of the sampled spots from Aug 2016 to Sep 2018, so 15% of the sampled
  area cannot be dated; fallow fields and scrub are hard to tell apart; no check for developments Amphora missed.
  The basis of the 95% is our reading, not confirmed by Amphora; the map file gives its years as 2018-2025, the
  article 2018-2023; class definitions differ between land-cover models.
