id: CC-047
title: Nitrates in the aquifer
category: Water
subtopic: Water supply & groundwater
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'MaltaToday (James Debono, 13 February 2026), quoting Laudi et al. (J. Hydrol.: Regional Studies, 2026): nitrate in
    the eastern areas of the Mean Sea Level Aquifer ranges from 100 to 200 mg/L, which the article describes as two to four
    times the EU limit of 50 mg/L.'
  speaker: MaltaToday
  date: 2026-02-13
  wording_status: 'Verbatim found'
  sources:
    - title: "Potatoes and intensive farming: A slow-moving threat to Malta's groundwater"
      publisher: MaltaToday
      date: '2026-02-13'
      url: https://www.maltatoday.com.mt/news/national/139611/potatoes_and_intensive_farming_a_slowmoving_threat_to_maltas_groundwater
      note: The claim; quotes the paper in quotation marks. The 'two to four times the EU limit' comparison is the outlet's.
        Read 5 Oct 2026.
    - title: Tracing nitrate fate in Malta's hydrogeological system using an intensive vadose-groundwater monitoring network
      publisher: 'Journal of Hydrology: Regional Studies 64:103162'
      date: '2026'
      url: https://doi.org/10.1016/j.ejrh.2026.103162
      note: The study (open access, CC BY). Crossref verified; abstract read; full text not retrievable, so the quoted sentence
        is second-hand.
    - title: Using vadose zone data to determine agricultural impact on groundwater pollution (EGU25-13344)
      publisher: EGU General Assembly 2025
      date: '2025'
      url: https://doi.org/10.5194/egusphere-egu25-13344
      note: Same team; 75-200 mg/L under potato/forage fields, 25-100 mg/L regional aquifer.
    - title: 'Member State country fiche, Malta: Nitrates Directive 2020-2023, SWD(2026) 232 final, Part 20/27'
      publisher: European Commission
      date: '2026-07-15'
      url: https://data.consilium.europa.eu/doc/document/ST-12018-2026-ADD-19/en/pdf
      note: 'Independent: 30 of 44 groundwater points average 50 mg/L or more (2020-2023).'
  quote: Specifically, the highest concentrations of nitrate are observed in the eastern areas of the MSLA, ranging from 100
    to 200 mg/L.
counter_evidence: "Commission fiche (EWA data): 68.2% of 44 groundwater points average 50 mg/L or more in 2020-2023 (63.6%\
  \ in 2016-2019); 35 hotspots; 83.3% of 5-15 m wells. The same team's 2025 abstract gives 75-200 mg/L under potato and forage\
  \ fields but 25-100 mg/L in the regional aquifer under the north-west perched aquifer, so levels differ by area. No independent\
  \ per-aquifer series for the eastern MSLA."
tests: 100/50 = 2 and 200/50 = 4; Commission 2020-2023 monitoring shares (tools/cc-047-report/calc.py); comparison with the
  team's 2025 abstract.
why_low_hanging: 'Done: Claim Check 047 report and flyer.'
