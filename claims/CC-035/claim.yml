             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-035A
    text: "The rate was 143.5 per 100 000 aged 30+ in 2005"
    finding: "EEA table: 143.5 (348 deaths, 242,534 people aged 30+) [2]; Eurostat: 348 deaths [3]."
    rating: "Accurate"
    tone: green
  - id: CC-035B
    text: "It was 46.3 in 2023"
    finding: "EEA table and technical report: 46.3 (35.2–51.7) [2, 6]."
    rating: "Accurate"
    tone: green
  - id: CC-035C
    text: "“reduced by 67.7% between 2005 and 2023”"
    finding: "(143.5 − 46.3) / 143.5 = 67.74%. The 2005 value is a map value, from maps of another method and model, with no Maltese PM2.5 reported to the EEA [8, 10]; from 2007 the fall is 56.6%; the 95% CI covers the risk only [4]."
    rating: "Largely accurate"
    tone: lime
  - id: CC-035D
    text: "“172 (95% CI: 131-192) attributable deaths in 2023”"
    finding: "EEA table and Eurostat: 172 (131–192) [2, 3]. Technical report: 173 (132–193) [6]. The rate implies 172.8 deaths, but rounding does not explain the lower bound (35.2 → 131.4): a one-death difference, unexplained."
    rating: "Accurate"
    tone: green
  - id: CC-035E
    text: "Natural deaths, long-term exposure above 5 µg/m³, people aged 30+"
    finding: "Matches the documented method [4–6]; recomputed from Eurostat deaths within 1.2% (section 3)."
    rating: "Accurate"
    tone: green
