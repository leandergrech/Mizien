claim:
  text: 'Nationalist Party (PN statement, 1 July 2025): the government celebrates Blue Flag beaches while bathing sites close
    for sewage contamination (Fajtata Bay, Marsaskala, closed two days after 13 Blue Flags were announced).'
  speaker: Nationalist Party (PN)
  date: 2025-07-01
  wording_status: 'Verbatim found'
  sources:
    - title: Marsascala beach goes from Blue Flag to Red Alert in 48 hours, PN says; PL responds
      publisher: The Malta Independent
      date: '2025-07-01'
      url: https://www.independent.com.mt/articles/2025-07-01/local-news/Marsascala-beach-goes-from-Blue-Flag-to-Red-Alert-in-48-hours-PN-says-6736271331
      note: PN statement and Labour Party reply; read in full (Wayback copy). English text of a statement possibly issued
        in Maltese; not found on pn.org.mt.
    - title: "'From Blue Flag to Red Alert': PN slams government over beach closures"
      publisher: MaltaToday
      date: '2025-07-01'
      url: https://www.maltatoday.com.mt/news/national/135722/from_blue_flag_to_red_alert_pn_slams_government_over_beach_closures
      note: Source of the quoted sentence; read in full (Wayback copy).
    - title: Fajtata Bay closed to bathers after public toilet overflow spills into sea
      publisher: MaltaToday (EHD notice)
      date: '2025-06-30'
      url: https://www.maltatoday.com.mt/news/national/135697/fajtata_bay_closed_to_bathers_after_public_toilet_overflow_spills_into_sea_
      note: "EHD notice: 'Bathing is not recommended due to an overflow of foul water in the vicinity of the public toilets.'\
        \ Timestamp 30 Jun 2025, 12:45."
    - title: Fajtata Bay open to swimmers again
      publisher: MaltaToday (EHD statement)
      date: '2025-07-02'
      url: https://www.maltatoday.com.mt/news/national/135753/fajtata_bay_open_to_swimmers_again
      note: Warning lifted after repeated sampling; lifting date 2 Jul from other outlets.
    - title: Fajtata Beach Closed Due To Sewage Leak Days After Earning Blue Flag Status
      publisher: Lovin Malta
      date: '2025-06-30'
      url: https://lovinmalta.com/lifestyle/announcements/fajtata-beach-closed-due-to-sewage-leak-days-after-earning-blue-flag-status/
      note: Blue Flag awarded Saturday; closure Monday; ten Maltese and three Gozitan flags. The government press release
        (28 Jun 2025) was not retrievable.
    - title: Bathing Water Directive data (DiscoMap, DiscoData)
      publisher: European Environment Agency
      date: retrieved 2026-10-05
      url: https://www.eea.europa.eu/en/topics/in-depth/bathing-water
      note: Primary data via data/cc-005; 2025 class of each of Malta's 87 sites.
  quote: The same government that boasts about the 'quality' of our beaches ends up having to close them within days.
counter_evidence: "Fajtata was closed for about two days (30 Jun-2 Jul 2025) after a public-toilet overflow; Qui-si-Sana was\
  \ closed 18-24 June after a private establishment's drain failed; Xlendi (listed by the PN among sewage spills) was closed\
  \ for field run-off after rain, which the Water Services Corporation said was not sewage (second-hand). EEA 2025 classification:\
  \ 77 of 87 bathing waters Excellent (88.5%, 92.0% in 2024), 8 Good, 2 Sufficient, none Poor; Fajtata (A07) Excellent in\
  \ every season 2015-2025. The Labour Party's 'over 92% excellent' is the 2024 figure."
tests: News reports of Environmental Health Directorate notices; EEA bathing-water classification (tools/cc-042-report/calc.py,
  data/cc-042/).
