claim:
  text: 'Tourism Minister Ian Borg (14 Apr 2025), on Comino''s kiosks and beach concessions, which stayed unchanged for the
    2025 season: "starting in the summer of 2026, everyone will have to compete and pay the right price".'
  speaker: Ian Borg, then Tourism Minister
  date: '2025-04-14'
  wording_status: Verbatim found
  sources:
  - title: Illegal kiosks on protected Comino to be allowed another year, despite promises
    publisher: The Shift (I. Camilleri)
    date: '2025-04-14'
    url: https://theshiftnews.com/2025/04/14/illegal-kiosks-on-protected-comino-to-be-allowed-another-year-despite-promises
    note: 'Read in full 12 Oct 2026. The Minister''s words in quotation marks: "However, starting in the summer of 2026,
      everyone will have to compete and pay the right price."; "When I took over this responsibility, it was already too
      late to conduct a proper tendering process". That the MTA is considering limiting the kiosks is the outlet''s
      paraphrase.'
  - title: 'Watch: No More Vans? Ian Borg Pledges Major Comino Kiosk Revamp'
    publisher: Lovin Malta
    date: '2025-03-03'
    url: https://lovinmalta.com/news/watch-no-more-vans-ian-borg-pledges-major-comino-kiosk-revamp/
    note: 'Locator (read 12 Oct 2026; dated 3 Mar 2025, not February). Minister in quotation marks: "around 11 kiosks, but
      this might be too many". The reduction and redesign are the outlet''s paraphrase.'
  - title: Yet another promise to address Comino concession problems
    publisher: The Shift
    date: '2025-02-28'
    url: https://theshiftnews.com/2025/02/28/yet-another-promise-to-address-comino-concession-problems/
    note: 'Read 12 Oct 2026. Ministry spokesperson: "A competitive process (tender) is in the process so that everyone would
      have the chance to compete".'
  - title: Broken promise as Comino illegal concessions to stay put for another summer
    publisher: The Shift
    date: '2026-02-08'
    url: https://theshiftnews.com/2026/02/08/broken-promise-as-comino-illegal-concessions-to-stay-put-for-another-summer/
    note: 'Read in full 12 Oct 2026. MTA spokesperson: "The intention remains to reduce kiosks radically and to issue beach
      concessions through a competitive tendering process. However, this will have to wait until we have the permit."
      That no tender will be issued that summer, and the status of application PA00738/26, are the outlet''s paraphrase.'
  - title: Visit Malta officials filmed telling citizens to leave deckchair-occupied beach in Comino
    publisher: The Shift
    date: '2026-06-24'
    url: https://theshiftnews.com/2026/06/24/visit-malta-officials-filmed-telling-citizens-to-leave-deckchair-occupied-beach-in-comino/
    note: Read 12 Oct 2026. Outlet's text; no tender reported.
  - title: Blue Lagoon Strategic Plan
    publisher: Malta Tourism Authority
    date: n/d
    url: https://mta.com.mt/blue-lagoon-strategic-plan/
    note: 'Read 12 Oct 2026; undated. Names summer 2026 for completing the transformation; no mention of kiosks, concessions
      or tenders.'
  quote: '"However, starting in the summer of 2026, everyone will have to compete and pay the right price." (The Shift, 14
    Apr 2025)'
counter_evidence: 'MTA spokesperson, 8 Feb 2026 (quoted by The Shift): the intention remains but "this will have to wait until we
  have the permit"; the outlet reports that no competitive tenders for kiosks or beach concessions would be issued in summer
  2026 and that the MTA''s planning application PA00738/26 was at an early stage (the Planning Authority record was not
  opened). The Shift, 24 Jun 2026: kiosks still without valid permits and concessions extended ad hoc; no tender reported.
  We found no kiosk or beach-concession tender notice between Feb and 12 Oct 2026 (literature/CC-086/notes.md). Number of
  kiosks: the Minister said "around 11" (Mar 2025); no later count found, so a reduction cannot be tested.'
tests: The Shift, Lovin Malta and the MTA's Blue Lagoon Strategic Plan page; searches for tender notices; date arithmetic
  (tools/cc-086-report/calc.py, data/cc-086/checks.csv).
why_low_hanging: 'Done: Claim Check 086 report and flyer.'
