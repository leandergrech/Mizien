data_readiness: 'Low: gov.mt, the Planning Authority and the MTA tender pages are browser-only; Wayback unreachable.'
caveats: 'The record first held an intake paraphrase ("from 2026 all Comino kiosks and encroached public spaces will be
  awarded through competitive tenders and their number reduced"); the claim is now the Minister''s own quoted words of 14 Apr
  2025. Reducing the number of kiosks is the outlets'' paraphrase and is not rated. The MTA''s February 2026 words are as The
  Shift printed them; the Ministry''s press statement of February 2025 and the Planning Authority''s record were not read. Our
  search for a tender notice was not exhaustive. Missed label: pending right of reply.'
