  quote: Dan ikompli mal-wegħda li l-parks u l-ġonna pubbliċi li saru fl-aħħar snin jingħataw il-protezzjoni permess ta'
    emendi legali biex jiġu mħarsa minn kwalunkwe żvilupp fil-futur.
counter_evidence: 'L.N. 209 of 2026 has five regulations: title and purpose (''to establish the White Rocks as a national
  park''), definitions, establishment within the Schedule map, a saving for lawful existing agricultural activity, access rights,
  servitudes, permits and authorisations (reg. 4), and a saving for stricter protection under other law (reg. 5). None prohibits
  or restricts building, works or any activity; Project Green and any manager are not mentioned; no conservation aim is stated.
  For comparison, the Majjistral park instruments (S.L. 549.48 and 549.83) declare the area protected, state its conservation
  purpose, set up a management board and list prohibited activities; the 2026 Ċirkewwa Marine Park notice (L.N. 51 of 2026)
  states a conservation aim. The Environment Protection Act (art. 69(3)) lets works in a protected area be prohibited or restricted
  by regulations or a conservation order; none of the 100 later 2026 legal notices (L.N. 210-309, full texts read 17 Nov 2026)
  concerns White Rocks. The Labour manifesto 2026 pledged the ''necessary change'' so White Rocks is protected ''once and for
  all'' from development (PDF p. 162) and legal amendments to protect parks from development (p. 164); for Manoel Island it
  pledged a local plan change. The site''s current planning zoning was not read (pa.org.mt shows a security check).'
tests: The gazetted text and the Schedule map (L.N. 209 of 2026); Environment Protection Act (Cap. 549) articles 54, 55 and
  69 and what designation as a national park adds; other park instruments under the Act (Ċirkewwa, Majjistral); later 2026
  legal notices; Planning Authority zoning for the site (not read); the OPM statement in its own words.
why_low_hanging: The regulations are short and public; the claim can be compared with their text and with the planning framework.
