id: CC-138
title: 'OPM: White Rocks national park notice continues the pledge to protect parks ''from any future development'''
category: Land & Trees
subtopic: Open spaces & parks
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Office of the Prime Minister (press release PR261268, 29 Jul 2026, in Maltese): ''Il-Kabinett tal-Ministri approva
    l-pubblikazzjoni tal-Avviż Legali li ser jistabilixxi l-White Rocks bħala Park Nazzjonali. Dan se jwassal biex is-sit
    se jkun jista'' jiġi mħares u ssalvagwardjat bil-għan li l-aċċess pubbliku, l-użu rikreattiv u l-konservazzjoni jingħataw
    l-ogħla prijorità, bl-aġenzija Project Green tkun responsabbli għall-amministrazzjoni tal-Park. Dan ikompli mal-wegħda
    li l-parks u l-ġonna pubbliċi li saru fl-aħħar snin jingħataw il-protezzjoni permess ta'' emendi legali biex jiġu mħarsa
    minn kwalunkwe żvilupp fil-futur.'' (Our translation: Cabinet approved the legal notice establishing White Rocks as a
    National Park; this will mean the site can be protected and safeguarded, with public access, recreational use and conservation
    the highest priority, with Project Green responsible for administering the Park; this continues the pledge that the parks
    and public gardens made in recent years be given protection through legal amendments so that they are safeguarded from
    any future development.) MaltaToday (29 Jul 2026) reported that the site ''will receive legal protection to safeguard
    it against future development''.'
  speaker: Office of the Prime Minister
  date: '2026-07-29'
  wording_status: Verbatim found
