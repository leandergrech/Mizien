data_readiness: 'Medium: legislation.mt reachable; the OPM release (departmentofinformation.gov.mt) and the Planning Authority
  refuse scripts; the release was read in a browser, the zoning was not read.'
caveats: 'Not substantiated: a draft pending right of reply to the Office of the Prime Minister (prototype phase; not sent).
  The OPM''s wording is hedged (''can be protected'', ''the beginning of the fulfilment'' of a manifesto pledge), so the check
  does not rate it misleading; MaltaToday''s ''will receive legal protection'' drops the hedge (Conditional-turned-unconditional).
  Confidence is moderate because the planning zoning of the site, which could already restrict development, was not read.
  Translations from Maltese are ours. Only legal notices were searched for later instruments, not ERA conservation orders,
  Government Notices or Bills.'
