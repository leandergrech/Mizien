counter_evidence: 'Eurostat''s figure is quoted correctly (January release +16.6%, EU -34.0%; August 2026 data +14.3%, still
  the only rise; Malta 27th of 27 from every base year 2008-2023; EU-27 values flagged i), but it is a residence-based
  measure. Malta''s resident production units emitted 2.78 Mt CO2e in 2013 and 6.59 Mt in 2024; air transport rose from
  0.30 to 4.73 Mt (71.8% of 2024), 116% of the net increase; all of the rise is fuel bought abroad by resident air
  transport firms (Eurostat bridging table: 299 of 304 kt in 2013, 100% of the 2024 estimate). The NSO attributes the 2023
  jump to airlines that started operating that year. Without air-transport emissions the indicator fell from every base
  year 2008-2023 (-8.5% to -72%): -64.0% since 2013 (2nd-largest fall in the EU; EU -35.2%) but -29.5% since 2016 (17th
  of 27; EU -30.1%). The territorial inventory per euro of GDP also fell from every base year (-6.6% to -69%): -61.3%
  since 2013 (2nd after Estonia; EU -35.5%), -27.1% since 2016 (21st; EU -29.8%). Most of the fall came in 2014-2016, when
  electricity-sector emissions fell from 1,703 to 581 kt (743 kt in 2024, +28% since 2016), so these counter-figures
  depend on the base year too; in the PN''s favour, from base years 2014-2019 Malta''s rise is +19.5% to +97%. The
  renewables explanation does not fit: with zero electricity-sector emissions in 2024 the indicator would still be 1.4%
  above 2013 (329.8 against 325.2 g/EUR), and renewable shares rose over the period (electricity 1.6% to 10.7%, overall
  3.8% to 17.2%). The release''s next paragraph also cites traffic; households'' own car use is outside the indicator and
  land transport firms went from 49 to 86 kt. With 2013 as base Malta is the only riser only for end year 2024, a
  Eurostat estimate; 2013-2023 it fell 8.3% and no state rose. Estonia, Ireland and Finland cut intensity, not
  emissions: residence accounts / territorial inventory 2013-2024, Estonia -55.4% / -53.1% (2024 flagged i), Finland
  -37.9% / -37.6% (i), Ireland +13.7% / -6.9% (flagged e; its air transport, 9.90 to 16.32 Mt, is 87% of its residence-based
  rise). 10.7% is Malta''s renewable share of electricity (EU 47.5%); its overall share is 17.2%, fourth from last
  (EU 25.2%); Eurostat''s release of 18 Dec 2025 named Belgium, Luxembourg and Ireland as the lowest three. In the PN''s
  favour: the statistic is real and Eurostat''s own news item gives no explanation either; Malta''s renewable shares are
  among the EU''s lowest.'
tests: Eurostat env_ac_aeint_r2 for all EU-27 (2013-2024, both vintages, start- and end-year sensitivity, and our own counter-figures from every base year 2008-2023); env_ac_ainah_r2
  by activity and env_ac_aibrid_r2 for Malta's drivers; env_air_gge with nama_10_gdp for the territorial inventory per
  euro of GDP (and CC-025's 2005 base); nama_10_pe per person; nrg_ind_ren for the renewables figures. Recomputed in
  tools/cc-114-report/calc.py (data/cc-114/checks.csv, ranking_2013_2024.csv, sensitivity.csv, sensitivity_base_years.csv).
