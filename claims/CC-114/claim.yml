subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-114A
    text: "Malta is the only EU Member State whose greenhouse gas emissions intensity rose since 2013"
    finding: "Eurostat’s news item and map say so [3, 4]; still true in the August 2026 data, but only with 2024, a Eurostat estimate, as end year (to 2023: −8.3%, no riser) [6]."
    rating: "Accurate"
    tone: green
  - id: CC-114B
    text: "Malta +17%, EU average −34%"
    finding: "Matches the January release (+16.6%, −34.0%); revised to +14.3% (EU values flagged i). “Increased these emissions” is the slip rated in C, but here the same sentence gives the EU’s “average intensity”, so we read the figures as intensity. The −34% is the EU aggregate (countries’ mean −32.4%) [3, 4, 6]."
    rating: "Accurate"
    tone: green
  - id: CC-114C
    text: "Estonia reduced emissions by 64%, Ireland by 50%, Finland by 44%"
    finding: "These are intensity changes, given as emissions and “the fight against air pollution”. Emissions 2013–2024, residence accounts / territorial inventory: Estonia −55% / −53% and Finland −38% / −38% (both 2024 flagged i), Ireland +13.7% / −6.9% (2024 flagged e; 87% of its rise on the residence basis is air transport) [5, 6, 9]."
    rating: "Mislabelled"
    tone: amber
  - id: CC-114D
    text: "For every euro put into the economy, Malta pollutes more than in 2013"
    finding: "True on the residence basis, which the release never names: 72% of Malta’s 2024 figure is air-transport fuel bought abroad; without it the indicator fell from every base year (−64% since 2013); territorial inventory per € of GDP −61% since 2013 [6, 9]."
    rating: "Needs context"
    tone: amber
  - id: CC-114E
    text: "The rise is the direct result of a lack of ambition on several fronts"
    finding: "A political judgement about the Government’s ambition, not a checkable statement of fact [1]."
    rating: "Not rated"
    tone: grey
  - id: CC-114F
    text: "Renewables as a cause of the rise: “among them, the clear lack of ambition to seriously increase the use of renewable energy”"
    finding: "Rated only as a cause. Air transport is 116% of the net rise; with zero electricity-sector emissions in 2024 the indicator would still be 1.4% above 2013; renewable shares rose (electricity 1.6% to 10.7%). The release also cites traffic: land transport firms went 0.05 to 0.09 Mt [5, 6, 10]."
    rating: "Contradicted"
    tone: maroon
  - id: CC-114G
    text: "10.7% renewables in 2024 against an EU average of just over 25%, third from last"
    finding: "10.7% is Malta’s electricity share (lowest in the EU; EU 47.5%); 25.2% is the EU’s overall share. Malta’s overall share is 17.2%, fourth from last [10]. Eurostat’s release of 18 December 2025 named Belgium, Luxembourg and Ireland (14.3–16.1%) as the lowest three, so Malta was not third from last in the data published before the PN’s release [16]."
    rating: "Mixed measures"
    tone: amber
