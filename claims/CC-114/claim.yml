caveats: 'An opposition claim, held to the same standard and data as the Government''s (CC-025): our own counter-figures are
  tested from every base year, as the PN''s is. Translation of the Maltese release is ours. Malta''s 2024 values in the air
  emissions accounts are Eurostat estimates (flag i); the rise since 2013 depends on them. The airlines behind Malta''s
  air-transport series are not identified (Eurostat and the NSO name none; no company filings read). The release page was
  modified on 24 Apr 2026 and no January copy was found; Newsbook''s quotes of 26 Jan match its text. MaltaToday''s
  report was not readable (403). Newsbook''s own additions (the 81.6% per unit of GDP since 2005, a 142% overshoot of the
  2030 effort-sharing target, 24.5% renewables by 2030) are not the PN''s and are not checked here; the 10.7% and "third
  from last" are the PN''s own. "A lack of ambition on several fronts" is a political judgement and is not rated; only
  the renewables link is. The "Selective metric" tag means a metric favourable to the speaker''s argument, not to Malta or
  any party. Reviewed on 6 Oct 2026 before circulation; version unchanged. Misleading: pending right of reply from the
  Nationalist Party; must not be circulated beyond the site before the reply deadline.'
