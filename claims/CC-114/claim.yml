id: CC-114
title: 'PN: only EU state with rising emissions intensity'
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Misleading
verdict_confidence: High
claim:
  text: 'Nationalist Party press release signed by Shadow Minister Eve Borg Bonello (26 Jan 2026; in Maltese, our translation),
    citing Eurostat: "Malta is the only EU Member State which, instead of reducing, increased the intensity of greenhouse gas
    emissions from 2013 to date", by 17% while the average intensity in all EU Member States fell by 34%; "for every euro
    we put into our economy, we are polluting more than we were polluting in 2013"; and "this is the direct result of
    a lack of ambition on the part of the Maltese Government on several fronts. Among them, the clear lack of ambition to
    seriously increase the use of renewable energy." The release also says Estonia, Ireland and Finland "reduced emissions"
    by 64%, 50% and 44%, and that Malta generated 10.7% of its energy from renewables in 2024 against a European average
    of a little over 25%, "third from last".'
  speaker: Nationalist Party (PN)
  date: '2026-01-26'
  wording_status: Verbatim found
  quote: Malta hija l-uniku Stat Membru tal-UE li minflok ma naqqas, żied l-intensità tal-emissjonijiet ta’ gassijiet serra mill-2013 sal-lum.
