subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-114A
    text: "Malta is the only EU Member State whose greenhouse gas emissions intensity rose since 2013"
    finding: "Eurostat’s news item and map say so [3, 4]; still true in the August 2026 data, but only with 2024, a Eurostat estimate, as end year (to 2023: −8.3%, no riser) [6]."
    rating: "Accurate"
    tone: green
  - id: CC-114B
    text: "Malta +17%, EU average −34%"
    finding: "Matches the January release (+16.6%, −34.0%); revised to +14.3% in August 2026. The release’s “these emissions” means the intensity; the −34% is the EU aggregate, not a mean of countries (−32.4%) [3, 4, 6]."
    rating: "Accurate"
    tone: green
  - id: CC-114C
    text: "Estonia reduced emissions by 64%, Ireland by 50%, Finland by 44%"
    finding: "These are the intensity changes. Their emissions changed by −55%, +14% (Ireland’s rose) and −38% [5, 6]."
    rating: "Mislabelled"
    tone: amber
  - id: CC-114D
    text: "For every euro put into the economy, Malta pollutes more than in 2013"
    finding: "True only as the accounts count resident firms: 72% of Malta’s 2024 figure is airline fuel bought abroad; without it −64%; territorial inventory per € of GDP −61%, the EU’s second-largest fall [6, 9]."
    rating: "Misleading"
    tone: red
  - id: CC-114E
    text: "The rise is the direct result of a lack of ambition, notably on renewable energy"
    finding: "Electricity-supply emissions fell 56% since 2013; the net rise is all air-transport fuel bought abroad, which renewable power in Malta does not displace. No other cause is named [1, 6]."
    rating: "Contradicted"
    tone: maroon
  - id: CC-114F
    text: "10.7% renewables in 2024 against an EU average of just over 25%, third from last"
    finding: "10.7% is Malta’s electricity share (lowest in the EU; EU 47.5%); 25.2% is the EU’s overall share. Malta’s overall share is 17.2%, fourth from last [10]. Malta is near the bottom either way."
    rating: "Mixed measures"
    tone: amber
