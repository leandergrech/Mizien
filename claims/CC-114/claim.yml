counter_evidence: 'Eurostat''s figure is quoted correctly (January release +16.6%, EU -34.0%; August 2026 data +14.3%, still
  the only rise), but it is a residence-based measure. Malta''s resident production units emitted 2.78 Mt CO2e in 2013 and
  6.59 Mt in 2024; air transport rose from 0.30 to 4.73 Mt (71.8% of 2024), all of it fuel bought abroad by resident
  air transport firms (Eurostat bridging table), 116% of the net increase. The NSO attributes the 2023 jump to airlines
  that started operating that year. Without air-transport emissions the indicator fell 64.0% (2nd-largest fall in the
  EU; EU -35.2%); the territorial inventory per euro of GDP fell 61.3% (2nd after Estonia; EU -35.5%). Electricity, gas
  and steam emissions fell 56%, so the renewables explanation does not fit. With 2013 as base Malta is the only riser
  only for end year 2024, a Eurostat estimate; 2013-2023 it fell 8.3% and no state rose. Estonia, Ireland and Finland
  cut intensity, not emissions (Ireland''s emissions +13.7%). 10.7% is Malta''s renewable share of electricity (EU 47.5%);
  its overall share is 17.2%, fourth from last (EU 25.2%). In the PN''s favour: the statistic is real and Eurostat''s own
  news item gives no explanation either; Malta''s renewable shares are among the EU''s lowest.'
tests: Eurostat env_ac_aeint_r2 for all EU-27 (2013-2024, both vintages, start- and end-year sensitivity); env_ac_ainah_r2
  by activity and env_ac_aibrid_r2 for Malta's drivers; env_air_gge with nama_10_gdp for the territorial inventory per
  euro of GDP (and CC-025's 2005 base); nama_10_pe per person; nrg_ind_ren for the renewables figures. Recomputed in
  tools/cc-114-report/calc.py (data/cc-114/checks.csv, ranking_2013_2024.csv, sensitivity.csv).
