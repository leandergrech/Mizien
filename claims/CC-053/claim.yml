id: CC-053
title: Milky Way visible from 13% of Malta
category: Nature & Wildlife
subtopic: Dark skies
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'University of Malta researchers (Caruana et al., Journal of Environmental Management, 2020): 87% of the area of the
    Maltese Islands registers Bortle class 5 or brighter night skies, and the Milky Way is visible from only 12.8% of the
    area (reported as ''about 13%'').'
  speaker: University of Malta researchers
  date: '2020-05'
  wording_status: 'Verbatim found'
  sources:
    - title: A photometric mapping of the night sky brightness of the Maltese islands
      publisher: Journal of Environmental Management 261:110196
      date: '2020'
      url: https://doi.org/10.1016/j.jenvman.2020.110196
      note: The claim (abstract). Accepted manuscript read in full on arXiv (2002.04435).
    - title: Milky Way only visible from 13% of Malta
      publisher: MaltaToday
      date: n/d
      url: https://www.maltatoday.com.mt/news/national/100416/milky_way_only_visible_from_13_of_malta
      note: Locator (news rounding to 13%).
    - title: The new world atlas of artificial night sky brightness
      publisher: Science Advances 2:e1600377
      date: '2016'
      url: https://doi.org/10.1126/sciadv.1600377
      note: 'Comparison: 11% for Malta, as cited by Caruana et al.'
  quote: We show that the vast majority of the area of the Maltese Islands is heavily light polluted, with 87% of the area
    registering a NSB < 20.39 magSQM/arcsec2 (Bortle Class 5 or higher) and 37.3% < 19.09 magSQM/arcsec2 (Bortle Class 6 or
    higher), with the Milky Way being visible for only 12.8% of the area
counter_evidence: The study gives 12.8% (Bortle class 4) or 13.5% (world atlas threshold); 87.2% of the area is in classes
  5-9. Area-weighting the island results gives 11.6% (the paper weights 347 survey cells). The 2016 world atlas gave 11%.
  Threshold sensitivity 6.3-25.9%. Data are from 2017-2019; on the island of Malta class 4 fell from 3.9% to 1.6% between
  the two surveys; no survey since.
tests: Caruana et al. (2020) Table 1, recomputed with OpenStreetMap island areas (tools/cc-053-report/calc.py); Falchi et
  al. (2016).
