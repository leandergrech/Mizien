subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-133A
    text: "Nominal property prices have risen steadily since 2014"
    finding: "Up every year 2015–2025, by 3.4% to 6.7%; +83.6% in all [3]."
    rating: "Accurate"
    tone: green
  - id: CC-133B
    text: "…and consistently outpace EU average growth"
    finding: "Cumulatively ahead every year (+83.6% vs +65.6% by 2025), but EU-27 annual growth was higher in 2020, 2021 and 2022 [3]."
    rating: "Overstated"
    tone: amber
  - id: CC-133C
    text: "Income growth exceeding these gains"
    finding: "Yes for household adjusted disposable income per head (+95.7% vs prices +73.3%, 2014–2024); no for median household income (+62.6%) [3, 4, 5]."
    rating: "Depends on measure"
    tone: amber
  - id: CC-133D
    text: "The price-to-income ratio has actually declined"
    finding: "Eurostat ratio −11.5% since 2014 and −23.1% since 2007; recomputed; matches the Commission’s Graph A16.3 [1, 2]."
    rating: "Accurate"
    tone: green
  - id: CC-133E
    text: "…tempering the impact on overall affordability"
    finding: "A fair reading of an average ratio and of borrowing capacity [8]; it does not cover renters or lower-income households [1, 6, 9]."
    rating: "Fair, limited"
    tone: lime
