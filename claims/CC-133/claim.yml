id: CC-133
title: 'EU: Malta''s price-to-income ratio has declined'
category: Planning & Housing
subtopic: Housing & affordability
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'European Commission (2026 Country Report for Malta, 3 Jun 2026): nominal property prices ''have risen steadily since
    2014 and consistently outpace EU average growth'', but ''with income growth exceeding these gains, the price-to-income
    ratio has actually declined, tempering the impact on overall affordability''.'
  speaker: European Commission
  date: '2026-06-03'
  wording_status: Verbatim found
  sources:
  - title: 2026 Country Report - Malta (Commission staff working document SWD(2026) 218 final), executive summary and Annex
      16
    publisher: European Commission (transmitted to the Council, 8 Jun 2026)
    date: '2026-06-03'
    url: https://data.consilium.europa.eu/doc/document/ST-10135-2026-ADD-1/en/pdf
    note: The claim. Passage read in the summary section on housing (PDF p. 8); Annex 16 (PDF pp. 113-116) says the ratio
      'has declined since 2007' and gives Graphs A16.1 (source Eurostat) and A16.3. Document read in full from the Council
      register copy (HTTP 200, text extracted, graph pages rendered) on 25-26 Oct 2026.
  quote: However, with income growth exceeding these gains, the price-to-income ratio has actually declined, tempering the
    impact on overall affordability
counter_evidence: "Eurostat (retrieved 26 Oct 2026): standardised price-to-income ratio tipsho60 for Malta -11.5% 2014-2024 and -23.1% 2007-2024 (peak 2008); EU-27 +5.8% since 2014; Malta 2024 recomputed exactly from prc_hpi_a, B7G and population; the Commission's Graph A16.3 (MT 96.9 and 92.7 in 2023-2024) matches within 0.2. Nominal house prices rose every year 2015-2025 (3.4-6.7%), +83.6% 2014-2025 against EU +65.6%, but EU-27 annual growth was higher in 2020, 2021 and 2022, so 'consistently outpace' is true only cumulatively. Income: adjusted household disposable income per head +95.7% 2014-2024 (prices +73.3%; Malta 2021-2024 provisional); EU-SILC median equivalised income +62.6% over income years 2014-2024, so on median income the ratio rose 6.6% since 2014 (fell 12.3% since 2007). Rents (HICP actual rentals) +15.2% in 2023, +8.9% in 2024, +1.7% in 2025. The ratio is an average measure and says nothing about renters or lower-income households."
tests: Eurostat house price index (nominal and deflated; data-sources.md warns about tipsho20 and tipsho10) and Eurostat or
  ECB price-to-income indicators for Malta and the EU since 2014; NSO household income and property price index; Central Bank
  of Malta residential property price index; the report's Annex 16 chart data; CC-013 data.
why_low_hanging: A direction-of-change claim that can be tested on published price and income series.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: Eurostat dissemination API and the Council register are reachable; NSO and Central Bank pages may be
  browser-only.'
caveats: "Largely supported: no right of reply needed. True on the indicator the Commission names (Eurostat's standardised price-to-income ratio, income = adjusted household disposable income per head); on EU-SILC median household income the ratio rose about 7% since 2014, though it fell since 2007. 'Consistently outpace EU average growth' fails year by year in 2020-2022. Malta's household income for 2021-2024 is provisional. The claim is about a ratio of prices to average income, not about whether housing is affordable for renters or any group. The Commission's data vintage for Graph A16.3 is not stated."
right_of_reply:
  sent: null
  deadline: null
  response: null
evidence_shown: null
