  - id: CC-085A
    text: "“the Deloitte report concluded that Malta will need to attract 4.7 million tourists”"
    said_by: "MHRA president, 2022 [1]"
    finding: "4,680,509 in the airport table’s middle scenario (p. 66), reproduced exactly; the report’s tables range from 4.1 to 5.0 million and its slides headline 4.5 million [3, 4]."
    rating: "In the study"
    tone: green
  - id: CC-085B
    text: "“each spending an average of 7 nights”"
    said_by: "MHRA president, 2022 [1]"
    finding: "The study’s stay: 7 nights as labelled, 7.024 in its arithmetic (2019 nights over arrivals) [3]. Stays have shortened since (Section 5)."
    rating: "As in the study"
    tone: green
  - id: CC-085C
    text: "to “reach 80 percent occupancy throughout the year”"
    said_by: "MHRA president, 2022 [1]"
    finding: "The study keeps 2019 occupancy (76.7% collective, 59.3% private rented); no 80% occupancy condition in its text [3, 4]. At 80% its beds need 4.6 to 5.0 million."
    rating: "Not the study’s condition"
    tone: amber
  - id: CC-085D
    text: "Beds operating plus new beds “approved or are in the course of being approved”"
    said_by: "MHRA president, 2022 [1]"
    finding: "The study’s pipeline: about 35,000 collective beds in open permits and a stakeholder consensus of +80% to +100%; the Planning Authority’s own count was not shared with it [3]. MTA list in 2024: 27,672 beds [5]."
    rating: "Estimate"
    tone: amber
  - id: CC-085E
    text: "“the 80% occupancy rate of hotels we had in 2019”"
    said_by: "MHRA president, 2024 [2]"
    finding: "4-star hotels 81.2%, 5-star 72.7% in the MHRA survey [5]; all hotels 75.4% of rooms and 66.2% of bed-places (Eurostat) [6]."
    rating: "Partly supported"
    tone: amber
  - id: CC-085F
    text: "“with the number of beds we have, we need 4.7 million tourists”"
    said_by: "MHRA president, 2024 [2]"
    finding: "With the planned beds, as the interview’s context suggests, the 2024 update gives 4.4 to 4.8 million [5]. With the beds operating alone it is not shown: hotel rooms were 75.8% full in 2025 [6] with about 4.0 million tourists ◆ [9]."
    rating: "Depends on reading"
    tone: amber
