caveats: 'Count of cases, not recommendations; status at closure (2 of the 7 were later implemented). Table 1.22''s per-office
  split differs from Table 1.3 for the Parliamentary Ombudsman (4 vs 5) and Health (3 vs 2); Environment and Planning agrees
  (7). Statement about public bodies'' conduct: authorities are named only as the report names them; the report records what
  was not implemented, not why. Supported check: no right of reply needed.'
