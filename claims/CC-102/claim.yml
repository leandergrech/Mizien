claim:
  text: 'Parliamentary Ombudsman (2025 annual report, reported 2 July 2026): 58% of the justified recommendations of the Commissioner
    for Environment and Planning went unimplemented in 2025, the highest rate among the Ombudsman''s commissioners, and 22
    reports were escalated to Parliament.'
  speaker: Parliamentary Ombudsman (Judge Joseph Zammit McKeon)
  date: '2026-07-02'
  wording_status: Verbatim found
  sources:
  - title: Annual Report 2025 (Table 1.3, Table 1.22, Commissioner for Environment and Planning chapter)
    publisher: Office of the Ombudsman, Malta
    date: 2026-06
    url: https://ombudsman.org.mt/media/0ownfd4k/digital-annual-report-2025-en.pdf
    note: Primary. Read in full 5 Oct 2026 (SHA-256 14fcc0c6...42b0). Quote on p. 15; 22 reports to Parliament in Table 1.22
      (p. 37).
  - title: Public entities ignore Ombudsman as defiance reaches record high
    publisher: Newsbook
    date: '2026-07-02'
    url: https://newsbook.com.mt/en/public-entities-ignore-ombudsman-as-defiance-reaches-record-high/
    note: Locator. Read 5 Oct 2026. Its "justified recommendations" paraphrases "sustained cases"; the "highest rate" comparison
      is the newspaper's, from the Ombudsman's tables.
  - title: Ombudsman presents 2025 Annual Report to Speaker
    publisher: The Malta Independent
    date: '2026-06-05'
    url: https://www.independent.com.mt/articles/2026-06-05/local-news/Ombudsman-presents-2025-Annual-Report-to-Speaker-of-the-House-of-Representatives-6736290260
    note: Locator (HTTP 403 to automated fetch); reports the 22 escalated reports.
  - title: Annual Reports 2024 and 2023 (Table 1.3)
    publisher: Office of the Ombudsman, Malta
    date: 2025; 2024
    url: https://ombudsman.org.mt/media/q4nbhpzv/annual-report-2024-ombudsman.pdf
    note: 'Read 5 Oct 2026. 2023 report: https://ombudsman.org.mt/media/fr1ndd4u/annual-report-2023-en.pdf. Gives 2 of 8 (2024)
      and 6 of 13 (2023).'
  quote: The Commissioner for Environment and Planning had 12 sustained cases, representing 15% of the total, of which 7 recommendations,
    or 58%, were not implemented.
counter_evidence: The 58% is 7 of 12 sustained cases closed in 2025 (Table 1.3); the same office had 6 of 13 (46%) in 2023
  and 2 of 8 (25%) in 2024, so the figure swings with very few cases. The Commissioner's chapter says five of the 12 were
  still unimplemented when the report was written; two more were implemented after referral to the House. 'Highest' holds
  against Education (53% of sustained cases) but not if only cases with a recommendation are counted (Education 8 of 12, 67%).
  The Commissioner's remit covers planning, building and transport licensing as well as the environment.
tests: Ombudsman annual reports 2023-2025 (Table 1.3, Table 1.22, Commissioner chapter); recomputation of rates on two denominators
  with Wilson intervals (tools/cc-102-report/calc.py).
why_low_hanging: 'Done: Claim Check 102 report and flyer.'
