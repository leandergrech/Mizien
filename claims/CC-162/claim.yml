id: CC-162
title: 'European Commission: Malta ''is projected to emit more in 2030 than in 2005'' (Climate Action Progress Report 2026)'
category: Climate & Energy
subtopic: Emissions & targets
status: Not started
verdict: null
verdict_confidence: null
claim:
  text: 'European Commission (EU Climate Action Progress Report 2026, COM(2026) 601, adopted 9 Nov 2026): ''Before any use
    of ESR flexibilities by Member States to meet their targets, Germany, Ireland and Malta show the largest projected gaps
    to the 2030 target.'' A figure note adds: ''Malta''s gap to target is 49 and 61 percentage points, exceeding its 19% reduction
    target. This means Malta is projected to emit more in 2030 than in 2005.'' The report also names Malta among nine Member
    States that it concludes ''are not making sufficient progress towards their ESR obligations'' and will be asked for a
    corrective action plan.'
  speaker: European Commission
  date: '2026-11-09'
  wording_status: Verbatim found
  sources:
  - title: EU Climate Action Progress Report 2026 (COM(2026) 601 final), as transmitted to the Council (doc. 15659/26)
    publisher: European Commission / Council of the European Union
    date: '2026-11-11'
    url: https://data.consilium.europa.eu/doc/document/ST-15659-2026-INIT/en/pdf
    note: The claim in the Commission's own words (chapter 3, effort sharing; Figure 13 note and the paragraph on nine Member
      States); text extracted and read 15 Nov 2026. The Commission's own copy is on climate.ec.europa.eu (capr2026_report_en.pdf).
  - title: Malta among nine EU countries at risk of missing 2030 emissions targets
    publisher: Malta News Agency
    date: '2026-11-10'
    url: https://www.maltanewsagency.com/2026/11/malta-among-nine-eu-countries-at-risk-of-missing-2030-emissions-targets/
    note: Locates the claim; repeats it without linking the report. Read 15 Nov 2026.
  quote: Malta's gap to target is 49 and 61 percentage points, exceeding its 19% reduction target. This means Malta is projected
    to emit more in 2030 than in 2005.
counter_evidence: 'The 2025 edition of the report (COM(2025) 668, 6 Nov 2025) made the same finding with the same 49 and 61
  point gap: see CC-094, which this record follows up. The 2026 edition says projections are before flexibilities (banking,
  borrowing, transfers, ETS flexibility), and that the nine Member States are judged after assuming full use of them. The
  Climate Action Authority''s per-capita claim (CC-003) and the Central Bank''s ''statistical illusion'' (CC-146) concern
  other measures. Malta''s own position on the 2026 projections was not found.'
tests: 'Reproduce the gap: Malta''s reported ESR projections (WEM and WAM) against its 2030 annual emission allocation under
  the Effort Sharing Regulation (EEA GHG projections data viewer; Implementing Decision on AEAs); Malta''s ESR emissions 2021-2024
  (EEA/Eurostat env_air_gge, EEA approximated inventories) against allocations; what 49 and 61 points mean in kt CO2e; flexibilities
  available to Malta; compare with the 2025 edition (CC-094) and say what changed.'
why_low_hanging: The gap is arithmetic on published projections and allocations; EEA and Eurostat data are reachable.
tags: []
