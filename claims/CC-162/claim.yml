data_readiness: 'High: the Council PDF (data.consilium.europa.eu) and EEA/Eurostat were reachable on 15 Nov 2026.'
caveats: 'Candidate from the weekly intake of 15 Nov 2026. A statement by an EU institution about Malta; checked on the same
  terms as local claims. It restates the finding of CC-094 for the 2026 edition: if CC-094 is finished, the check should test
  what changed rather than repeat it. The report''s two gap figures (49 and 61 points) correspond to the two policy scenarios
  shown in Figure 13; confirm which is which from the staff working document.'
