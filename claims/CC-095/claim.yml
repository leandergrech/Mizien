caveats: 'The record first held The Malta Post''s headline (2 Oct 2026, dated 2025 in error); the claim is now the
  minister''s own words of 30 Sep 2026, as quoted by BusinessNow, Lovin Malta, TVM News and Newsbook (English renderings
  of remarks made partly in Maltese). The figures (EUR 391.7m, about 400m) are reporters'' text of figures he presented;
  the Pre-Budget Document 2027 could not be read. The minister''s series covers energy and food subsidies. The 2027 cost
  is a forecast and is not rated; keeping the support in 2027 is a pledge, labelled Not yet due. Not substantiated
  verdict: right of reply on hold until the Pre-Budget Document 2027 is read.'
