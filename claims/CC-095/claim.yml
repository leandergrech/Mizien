claim:
  text: 'Finance Minister Clyde Caruana, launching the Pre-Budget Document 2027 (30 Sep 2026): energy subsidies will
    cost about EUR 400 million this year (EUR 391.7 million in the figures presented) and about the same in 2027; the
    prices of fuel, electricity and gas in Malta have not changed; and the support will remain "come what may".'
  speaker: Clyde Caruana, Minister for Finance (Pre-Budget Document 2027)
  date: '2026-09-30'
  wording_status: Verbatim found
  sources:
  - title: Subsidies expected to hit EUR 400 million, minister warns of 'economic catastrophe' if stopped
    publisher: BusinessNow.mt (K. Schembri Orland)
    date: '2026-09-30'
    url: https://businessnow.mt/subsidies-expected-to-hit-e400-million-minister-warns-of-economic-catastrophe-if-stopped/
    note: 'Read in full 10 Oct 2026. The minister''s words on the cost in quotation marks ("I expect those numbers to
      remain at the same level next year. If things worsen ... that bill will continue to rise"); "EUR 400 million"
      for this year and "the same" next year are the reporter''s text.'
  - title: Malta To Spend Around EUR 400 Million On Energy Subsidies Again In 2027
    publisher: Lovin Malta (G. Falzon)
    date: '2026-09-30'
    url: https://lovinmalta.com/news/local/malta-to-spend-around-e400-million-on-energy-subsidies-again-in-2027/
    note: 'Read in full 10 Oct 2026. Quotes on prices and "the only country"; the figures presented by the minister
      (reporter''s text): energy and food subsidies EUR 242.5m (2023), 188.1m (2025), 391.7m (2026), about 400m (2027).'
  - title: Finance Minister warns that without energy subsidies, the country will face "an economic catastrophe" (English
      and Maltese versions)
    publisher: TVM News
    date: '2026-09-30'
    url: https://tvmnews.mt/en/news/finance-minister-warns-that-without-energy-subsidies-the-country-will-face-an-economic-catastrophe/
    note: Read in full 10 Oct 2026, with the Maltese version (block quotes in the original Maltese).
  - title: Caruana jgħid li s-sussidji se jkomplu, imma jispjega x'jiġri kieku jieqfu (and English version)
    publisher: Newsbook
    date: '2026-09-30'
    url: https://newsbook.com.mt/caruana-jghid-li-s-sussidji-se-jkomplu-imma-jispjega-xjigri-kieku-jieqfu/
    note: 'Read in full 10 Oct 2026. "Dak li qed nagħmlu bħalissa se nsostnuh" ("What we are doing right now, we will
      sustain").'
  - title: 'Malta EUR 400m Energy Subsidies: 2027 Plan Confirmed'
    publisher: The Malta Post
    date: '2026-10-02'
    url: https://themaltapost.com/posts/malta-spends-400-million-to-keep-energy-bills-low-through-2027
    note: 'Locator (read 10 Oct 2026). Dated 2 Oct 2026, not 2025 as first recorded; quotes no one; "through 2027" is
      its headline framing.'
  - title: 'Pre-Budget Document 2027: Bis-Saħħa Tiegħek'
    publisher: Ministry for Finance
    date: '2026-09-30'
    url: https://finance.gov.mt/
    note: Not read (finance.gov.mt 403 to every request on 10 Oct 2026; Wayback unreachable). Holds the figures; to be
      read in a browser.
  quote: '"I expect those numbers to remain at the same level next year." (BusinessNow) ... "In just a few months, energy
    prices have risen very significantly. However, in our country, the prices of fuel, electricity and gas have not
    changed." (Lovin Malta)'
counter_evidence: 'Prices: confirmed. Petrol EUR 1.34 and diesel EUR 1.21 a litre in every weekly EU Oil Bulletin from
  15 Jun 2020 to 5 Oct 2026 (cheapest of 26; EU average diesel 2.15); Malta''s HICP electricity unchanged since Apr 2014,
  LPG since Apr 2020, diesel and petrol since Jul 2020; energy 0.0% in the year to Aug 2026 against EU-27 +13.0%, the only
  EU country with no rise (Hungary +1.6%). Cost: the EUR 391.7m (2026, energy and food) is a projection for a year in
  progress and the EUR 400m (2027) a forecast the minister made conditional on prices; no 2026 spending figure for energy subsidies has been published. The
  Government''s forecasts rose during 2026 (total subsidies EUR 493.3m in Oct 2025, 560.0m in Apr 2026 with energy about
  0.3% of GDP higher; MFAC) and the Commission expects a higher cost in 2026, but no independent source gives the amount.
  Past figures fit: 2023 EUR 242.5m against Eurostat COFOG 04.3 subsidies EUR 295.9m (258.5m above 2019) and the IMF''s
  EUR 292.8m; but EUR 595m had been planned for 2023 in Oct 2022 (MFAC Box C), and the Commission subsidy database''s 2023
  entries for Malta (EUR 580m + 15m, CC-113) equal that allocation. "The only country": true for fixed prices; not for
  support, since Hungary (1.3% of GDP), Bulgaria and Slovakia (1.1%) subsidised fuel and energy as much as Malta (1.1%)
  in 2024.'
tests: Eurostat prc_hicp_minr (every EU country, Jan 2025 to Aug 2026; Malta and EU from 2014), nrg_pc_204 band DC,
  nrg_pc_205 band ID, gov_10a_exp COFOG 04.3 D.3, nama_10_gdp; Weekly Oil Bulletin history (2019 to 5 Oct 2026); MFAC
  assessments of the DBP 2023, USP 2023-2026, DBP 2026, APR 2026 and Council Note 03/2026; Commission Spring 2026
  forecast; Draft Budgetary Plans 2024/2025, IMF CR 26/29 and the Commission subsidy database via CC-113
  (tools/cc-095-report/calc.py, data/cc-095/checks.csv).
why_low_hanging: 'Done: Claim Check 095 report and flyer.'
