caveats: Candidate from the weekly intake of 11 Oct 2026. Draft Council text of 3 July 2026; check the adopted version. The
  2025 electricity share is a very recent figure and its source is not named in the recital. Offshore wind 'by 2033' is a
  stated plan, not a claim to be graded here.
