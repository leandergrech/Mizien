claim:
  text: 'European Commission (2026 Country Report - Malta, 3 Jun 2026): "Transport is the dominant source of Malta''s effort
    sharing emissions. It has generated 48% of these emissions in 2024, up by 45% since 2005."'
  speaker: European Commission
  date: '2026-06-03'
  wording_status: Verbatim found
  sources:
