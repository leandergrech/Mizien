      note: 'The claim. Council copy read in full 5 and 6 Oct 2026: Annex 8 p. 72 (quote, footnotes 140-141), chapter 3 p.
        15, Graph 3.1 p. 16, summary p. 6, Table A8.1 p. 77.'
    - title: 2026 Country Report - Malta, SWD(2026) 218 final (Commission copy)
      publisher: European Commission
      date: '2026-06-03'
      url: https://economy-finance.ec.europa.eu/document/download/b0bb0c3b-1b52-4ac5-8090-ee21edf1e039_en?filename=MT_SWD_2026_218_1_EN_autre_document_travail_service_part1_v1.pdf
      note: 'Same wording; pages 6, 14 (text and Graph 3.1), 66 (quote), 71 (Table A8.1). Read 6 Oct 2026; copy in
        literature/CC-109/open-access/.'
    - title: Greenhouse gas emissions under the Effort Sharing Legislation, 2005-2024; Approximated estimates for greenhouse
        gas emissions, 2024
      publisher: European Environment Agency
      date: Nov 2025
      url: https://doi.org/10.2909/f80bebef-447e-4882-b3e9-c4a91cbae4f5
      note: 'Primary data, retrieved 6 Oct 2026 (also doi:10.2909/cd572015-4d0d-408a-abf8-290ed2057bf7). Malta 2024 ESR
        total 1.437 Mt, transport (non-ETS 1.A.3) 0.761 Mt: 52.9%.'
    - title: Greenhouse gas emissions by source sector (env_air_gge)
      publisher: Eurostat
      date: updated 2 Jun 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/env_air_gge/default/table
      note: Malta's 2026 inventory submission, retrieved 6 Oct 2026; same values as the EEA GovReg 2026 v1.0 compilation.
    - title: 'Climate Action Progress Report 2025: country profile Malta'
      publisher: European Commission (DG Climate Action)
      date: Jan 2026
      url: https://climate.ec.europa.eu/document/download/acb92e05-4220-44c3-9483-b3524c326f59_en?filename=mt_2025_factsheet_en.pdf
      note: Figure 11 (p. 10) gives transport 53% of Malta's ESR emissions in 2024 (EU-27 39%). Read 6 Oct 2026.
  quote: Transport is the dominant source of Malta’s effort sharing emissions. It has generated 48% of these emissions in
    2024 (141), up by 45% since 2005.
counter_evidence: 'On the effort-sharing definition (all domestic transport, aviation CO2 excluded; the definition of the
  report''s own Graph 3.1) transport was 52.9% of Malta''s effort-sharing emissions in 2024 (EEA approximated inventory),
  53.3% in the report''s Graph 3.1 and 53% in the Commission''s CAPR 2025 Malta profile; 54.8% on the final 2026 inventory
  (our estimate of the total). Road transport alone over the ESR total gives 48.0% (our identification; the report does
  not say how 48% was computed). The 45% reproduces as the rise in transport emissions (+44.1% to +45.0% on approximated
  2024 data; +48.4% on the final inventory); the share barely moved (52.0% to 53.3%). Footnote (140) and Table A8.1 call
  the sector "road transport", but the table''s series includes domestic shipping (11.9% of it in 2024, +184% since 2005).
  2024 values are approximated; final data after the 2027 review.'
tests: Eurostat env_air_gge (2026 inventory, Malta and EU-27, CRF 1.A.3 and sub-categories); EEA ESR emissions 2005-2024 and
  approximated inventory 2024; EEA GovReg 2026 v1.0; the report's Graph 3.1 read from the PDF's vector paths; Commission
  CAPR 2024 and 2025 Malta profiles; 2025 Country Report; Regulation (EU) 2018/842 Art. 2 as amended by 2023/857;
  Implementing Decision (EU) 2020/2126 Annex I (2005 base).
  Recomputed in tools/cc-109-report/calc.py.
