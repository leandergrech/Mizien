caveats: 'Largely supported: no right of reply needed. Transport is the dominant effort-sharing source and its emissions rose
  about 45% since 2005, but on the report''s own definition its 2024 share is 53%, not 48%. The 48% understates transport''s
  share. 2024 effort-sharing figures are approximated; final figures after the 2027 review.'
