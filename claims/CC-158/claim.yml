counter_evidence: 'Context, not tested: the same summary says the review also found gaps in data quality, use of performance
  metrics and the Climate Action Authority''s resources; an overall ClimateScanner score of 6.92 out of 10 appears in a search
  summary (unconfirmed). A June 2025 NAO performance audit found that Government had not yet quantified the cost of adapting
  to climate change.'
tests: The NAO report and its ClimateScanner scoring method (INTOSAI WGEA); what the score measures (governance, public policy,
  climate finance), not emissions outcomes; Malta's emissions record from Eurostat/EEA (CC-025, CC-094, CC-109 are related
  checks).
why_low_hanging: The report is public and the framework is documented; the check separates process scores from outcomes.
