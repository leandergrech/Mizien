id: CC-158
title: 'National Audit Office: ClimateScanner review shows ''significant strides'' in Malta''s climate action'
category: Governance & Promises
subtopic: Accountability
status: Drafted
verdict: Largely supported
verdict_confidence: High
claim:
  text: 'National Audit Office (press release, 7 Oct 2025): ''This Review, which presents the overall situation as at September
    2025, shows that Malta has made significant strides in climate action.'' The report (Oct 2025, PDF p. 14): ''Malta registered
    an overall ClimateScanner score of 6.92 out of 10, which in accordance with this assessment methodology is considered as
    representing strong progress vis-à-vis climate action.'' The Climate Action Authority (7 Oct 2025) welcomed the report,
    noting feedback that ''highlights Malta''s notable and significant progress in tackling climate change''.'
  speaker: National Audit Office
  date: '2025-10-07'
  wording_status: Verbatim found
  sources:
  - title: A review of Malta's climate action using the ClimateScanner framework (press release)
    publisher: National Audit Office, Malta
    date: '2025-10-07'
    url: https://nao.gov.mt/2025/10/07/a-review-of-maltas-climate-action-using-the-climatescanner-framework/
    note: The claim in the NAO's own words. nao.gov.mt refuses scripts; read in full from a browser copy supplied by the maintainer
      on 16 Nov 2026 (sha256 in archive/manifest.csv).
  - title: A review of Malta's climate action using the ClimateScanner framework (report, 73 pp.)
    publisher: National Audit Office, Malta
    date: 2025-10
    url: https://nao.gov.mt/2025/10/07/a-review-of-maltas-climate-action-using-the-climatescanner-framework/
    note: PDF linked from the press-release page; browser copy supplied by the maintainer, text extracted and read 16 Nov 2026
      (scores and 'strong progress' PDF p. 14; conclusions p. 33; item ratings in the Appendix, pp. 38-73).
  - title: Climate Action Authority welcomes the NAO report highlighting "strong progress" in climate action
    publisher: Climate Action Authority
    date: '2025-10-07'
    url: https://climateaction.gov.mt/?p=4273
    note: The CAA's restatement; browser copy supplied by the maintainer, read in full 16 Nov 2026.
  quote: This Review, which presents the overall situation as at September 2025, shows that Malta has made significant strides
    in climate action.
counter_evidence: 'The scores are reproduced exactly: all 18 rated components follow from the Appendix item ratings (18 advanced,
  26 intermediate, 14 early, none at no progress; F3 not applicable), the axes are their means (6.55, 8.00, 6.20) and 6.92 is
  the mean of the axes; 12 of 18 components reach 6.66. The ClimateScanner Handbook (May 2024, p. 11) marks components at
  6.66 or more as strengths, defines no overall score or ''strong progress'' label, scores an ''intermediate'' item (many aspects
  present, room for improvement) at 6.66, and says the tool assesses whether mechanisms exist, not their effectiveness; the
  NAO report says the same (PDF p. 14, para 1.4.1), the press release does not. Outcomes, which the tool does not score: Malta''s
  effort-sharing emissions were 41% above 2005 in 2024, over the yearly limit by 220, 257 and 301 kt in 2022-2024, and projected
  +30% in 2030 with planned measures against a -19% target (EEA; CC-094). Total emissions fell 27% 2005-2024 (EU-27 33.5%) and
  rose 18% from the 2016 low (Eurostat; CC-025). The NAO report does not mention the effort-sharing gap (text searched).'
tests: The NAO report and its ClimateScanner scoring method (INTOSAI WGEA); what the score measures (governance, public policy,
  climate finance), not emissions outcomes; Malta's emissions record from Eurostat/EEA (CC-025, CC-094, CC-109 are related
  checks).
why_low_hanging: The report is public and the framework is documented; the check separates process scores from outcomes.
tags:
- Input-as-outcome
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium: nao.gov.mt and climateaction.gov.mt refuse scripts (browser copies from the maintainer); the ClimateScanner
  Handbook is downloadable; emissions data reused from CC-094 and CC-025.'
caveats: 'Largely supported: no right of reply needed. The NAO''s scores and its ''strong progress'' label are correct and a fair
  reading of the method; the caveat is scope: ClimateScanner records whether policies, institutions and plans exist, not emissions
  results, which the report says and the press release does not. The Climate Action Authority''s restatement (''progress in
  tackling climate change'') goes further than the review (sub-claim D). Item counts were taken from text extracted from the
  Appendix and checked by reproducing every component score. The report PDF''s own URL was not recorded.'
right_of_reply:
  sent: null
  deadline: null
  response: null
