subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-158A
    text: "Malta’s overall ClimateScanner score is 6.92 out of 10 (axes 6.55, 8.00, 6.20)"
    said_by: "NAO [2]"
    finding: "All 18 component scores follow from the appendix item ratings; the axes are their averages, and 6.92 is the average of the axes."
    rating: "Accurate"
    tone: green
  - id: CC-158B
    text: "6.92 “is considered as representing strong progress” under the methodology"
    said_by: "NAO [2]"
    finding: "The Handbook marks components at 6.66 or more as strengths, but defines no overall score or label. The NAO applies the same mark to the average. 6.66 is the “intermediate” tier."
    rating: "Fair reading"
    tone: green
  - id: CC-158C
    text: "The review “shows that Malta has made significant strides in climate action”"
    said_by: "NAO [1]"
    finding: "True of policies, institutions and plans, which is what the tool records. The report says it does not measure results, but the press release does not. Effort-sharing emissions are 41% above 2005."
    rating: "True of policies"
    tone: amber
  - id: CC-158D
    text: "The feedback “highlights Malta’s notable and significant progress in tackling climate change”"
    said_by: "CAA [3]"
    finding: "The review rated whether policies exist. “Tackling climate change” suggests results it did not assess. The CAA quotes the NAO’s “strong progress” sentence correctly."
    rating: "Goes further"
    tone: orange
