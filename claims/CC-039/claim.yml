subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-039A
    text: "Groundwater abstraction “will be reduced by 4 billion litres per year”"
    said_by: "WSC [1]"
    finding: "No baseline year or date. Against 2016, WSC groundwater production is lower by 0.3–2.0 million m³ in 2022–25 (9–49% of 4.0), lowest in 2025."
    rating: "No baseline or date"
    tone: orange
  - id: CC-039B
    text: "Desalination produces “much more water with less energy”"
    said_by: "WSC [1]"
    finding: "More water: RO output +50% since 2016. Less energy per m³: whole-utility energy per m³ produced 4.68 (2022) to 4.60 (2024) kWh/m³ [8], a 1.7% fall; RO plant figures by year not found; RO electricity likely higher in total."
    rating: "Mixed"
    tone: orange
  - id: CC-039C
    text: "Extra production without increasing the utility’s overall net power requirements"
    said_by: "WSC framework, as described in [3]"
    finding: "RO alone would need a third lower specific energy to stay flat. Whole-utility kWh not published; intensity 4.68 to 4.60 kWh/m³ (2022–24) while production rose 9%, so total energy likely up [8]."
    rating: "Not testable as worded"
    tone: grey
