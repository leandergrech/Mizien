claim:
  text: 'Water Services Corporation: its EU-funded ''Net Zero Impact Utility'' project will cut groundwater abstraction
    by 4 billion litres a year with no net increase in energy use.'
  speaker: Water Services Corporation (WSC)
  date: '2019-04-02'
  wording_status: Verbatim found
  sources:
  - title: Towards a Net Zero-Impact Utility
    publisher: Water Services Corporation
    date: '2018-04-16'
    url: https://www.wsc.com.mt/towards-a-net-zero-impact-utility-new-e100-million-eu-funded-project-set-to-improve-water-quality-to-all-new-highs/
    note: Project launch page, posted 16 Apr 2018 (date read on the Wayback copy; no groundwater volume). Read in the Wayback copy; wsc.com.mt shows a bot challenge to scripts.
  - title: European Commission Endorses WSC's 'Net Zero-Impact' Utility Project
    publisher: Water Services Corporation
    date: '2019-04-02'
    url: https://www.wsc.com.mt/european-commission-endorses-wscs-net-zero-impact-utility-project/
    note: Primary wording of the 4 billion litre statement. Read in the Wayback copy of 10 Sep 2024.
  - title: Integrated Water Resources Management in the Maltese Islands (Sapiano 2020, p. 30)
    publisher: Acque Sotterranee 9(3)
    date: '2020'
    url: https://doi.org/10.7343/as-2020-477
    note: Describes the framework's energy aim (second-hand description of WSC 2018). Pages 25-32 and p. 30 checked against the open-access PDF.
  quote: The Corporation's ground water abstraction will be reduced by 4 billion litres per year.
counter_evidence: 'WSC groundwater production was 13.5 million m3 in 2016 and 11.5 million m3 in 2025 (2.0 million m3, about half of the pledged 4.0, lower); only 0.4 million m3 lower in 2024 (0.3 in 2023). Reverse-osmosis output rose about 50% over the same period, so RO electricity is likely higher in total. WSC’s Impact and Allocation Report 2024 gives whole-utility energy per m3 produced of 4.68 (2022), 4.52 (2023) and 4.60 (2024) kWh/m3, with production up about 9% (total kWh by year not published).'
tests: WSC annual reports; EWA groundwater abstraction data.
why_low_hanging: A specific, attributable statement that public data can test.
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: Pending right of reply (Water Services Corporation). The baseline (2016) is our choice because the statement gives none. WSC's Annual Report 2024 could not be opened; the 2024 energy figures come from its Impact and Allocation Report 2024 (whole-utility indicator, boundary not defined). Claim record's 'no net increase in energy use' is not WSC wording; it paraphrases the framework as Sapiano 2020 describes it. The idea of giving back as much water as is abstracted is CC-108.
