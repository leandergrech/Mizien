      INFR(2026)2027 still to be read. A LinkedIn post says proceedings were escalated in October 2026; unverified.'
  quote: 'The European Commission decided to open infringement procedures by sending a letter of formal notice to ... Malta (INFR(2026)2027) ... as they failed to submit their draft National Building Renovation Plan (NBRP) to the Commission by the deadline of 31 December 2025.'
counter_evidence: 'No evidence against the statement. Context: Malta has no entry on the Commission''s plan page (read 3 Nov 2026), which lists 18 Member States and the Walloon Region; a letter of formal notice is a first step and states the Commission''s view, not a ruling; the page may lag behind submissions and the register stage of INFR(2026)2027 could not be read. An escalation in October 2026 is mentioned only in search summaries (second-hand, unverified).'
