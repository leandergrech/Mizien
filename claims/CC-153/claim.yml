claim:
  text: 'European Commission (March 2026 infringements package): Malta, with 18 other Member States, received a letter of
    formal notice (INFR(2026)2027) for not submitting its draft National Building Renovation Plan, due by 31 December 2025,
    and has two months to respond.'
  speaker: European Commission
  date: '2026-03-12'
  wording_status: Verbatim found
  sources:
