    note: "Worker A, attempt 1: blocked on source. Newsbook (published 5 May 2020, read in full) reports in its own words, without quotation marks, that Environment Minister Aaron Farrugia, replying to a parliamentary question from PN MP Kevin Cutajar, confirmed 32 quarries licensed to receive construction waste for rehabilitation and 3 more for recycling only (35 in all). The speaker is therefore the Minister in a PQ answer, not ERA, and the date is spring 2020. Needed: the PQ number and answer text from parlament.mt (browser-only) and the sitting date. Later ERA figure of 31 permitted (6 recycling-only) is known only from a search summary (second-hand)."
