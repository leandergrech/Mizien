      date: '2021-06-17'
      url: https://www.businesstoday.com.mt/business/business/1503/crippling_construction_waste_dumping_costs_behind_road_works_standstill_mda_says
      note: Repeats the warning; Sandro Chetcuti on EUR 5-8 tendered vs EUR 12 a tonne charged. Read via Internet Archive.
    - title: Construction drive produced unprecedented levels of construction waste, Farrugia says
      publisher: MaltaToday
      date: '2021-10-09'
      url: https://www.maltatoday.com.mt/news/national/112566/construction_drive_produced_unprecedented_levels_of_construction_waste_farrugia_says
      note: Construction and demolition waste strategy of 15 measures in four areas. Read via Internet Archive.
    - title: Production in construction, annual data (sts_copr_a)
      publisher: Eurostat
      date: updated 2 Oct 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/sts_copr_a/default/table
      note: Primary data, retrieved 5 Oct 2026 (data/cc-063/).
    - title: Generation of waste by NACE activity (env_wasgen) and Treatment of waste (env_wastrt)
      publisher: Eurostat
      date: updated Sep 2025
      url: https://ec.europa.eu/eurostat/databrowser/view/env_wasgen/default/table
      note: Primary data, retrieved 5 Oct 2026 (data/cc-063/).
  quote: There has been a patchwork of attempted solutions along the years in a bid to solve the problem. However, none have
    proved to be effective long term. … development will come to an “almost complete standstill.”
counter_evidence: "A real bottleneck existed: road works were halted in 2020 for lack of dumping space and government fixed\
  \ a EUR 12 a tonne fee; in June 2021 contractors again reported strain (MaltaToday, BusinessToday). But Malta's construction\
  \ output (volume, 2015=100) rose from 145.5 (2020) to 154.0 (+5.8%, 2021) and 162.5 (+5.5%, 2022, provisional; latest year\
  \ published). Construction-sector waste was 3.0 Mt in 2020, 2.1 Mt in 2022 (-31%, +4.7% vs 2018), 78% of all waste (84%\
  \ in 2020). Mineral C&D waste treated in 2022: 67% recycled, 33% backfilling, landfill negligible (backfilling counts as\
  \ recovery). The MDA published no analysis behind 'almost complete standstill'; government acted (fee 2020, strategy Oct\
  \ 2021), so the conditional cannot be tested."
tests: Eurostat sts_copr_a, env_wasgen, env_wastrt for Malta (tools/cc-063-report/calc.py; data/cc-063/).
