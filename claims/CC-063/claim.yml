claim:
  text: 'Malta Developers Association (statement of 2 June 2021, as reported by MaltaToday): unless an imminent and enduring
    solution is found to the dumping of construction waste, development will come to an ''almost complete standstill''.'
  speaker: Malta Developers Association
  date: 2021-06-02
  wording_status: 'Verbatim found'
  sources:
    - title: Developers again call for enduring solution to dumping of construction waste
      publisher: MaltaToday
      date: '2021-06-02'
      url: https://www.maltatoday.com.mt/news/national/110023/developers_again_call_for_enduring_solution_to_dumping_of_construction_waste
      note: The claim. Read 5 Oct 2026 from the Internet Archive copy (live site 403). Only the words in quotation marks are
        the MDA's; the conditional framing is the outlet's. The MDA's own statement was not reached.
    - title: Crippling construction waste dumping costs behind road works standstill, MDA says
