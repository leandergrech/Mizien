priority: Done (v1.0)
data_readiness: 'Medium: nso.gov.mt tables read in a browser (403 to scripts); NSO releases before 2022 not online; Planning
  Authority data behind a security check.'
caveats: 'Largely supported: no right of reply needed. 12,325 and +41% match NSO tables exactly; ''third-highest'' is consistent
  with second-hand 2018-2019 figures; the ODZ record (226) is unchecked. The numbers are the NSO''s and the Planning Authority''s;
  the superlatives are the outlet''s. Do not judge individual permits.'
