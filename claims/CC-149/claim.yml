id: CC-149
title: 'MaltaToday: 12,325 new dwellings approved in 2025, a record 226 outside development zones'
category: Planning & Housing
subtopic: Development & construction
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'MaltaToday (James Debono, ''Building mad: 12,325 new dwellings approved in 2025'', 27 Jul 2026): ''Approved residential
    units reached 12,325 in 2025, the third-highest annual total ever, while approvals on ODZ land more than doubled to a
    record 226 units.'' The article adds that new dwelling units in 2025 ''marked a 41% increase over units approved the
    previous year'', citing figures published by the Planning Authority.'
  speaker: MaltaToday
  date: '2026-07-27'
  wording_status: Verbatim found
  sources:
  - title: 'Building mad: 12,325 new dwellings approved in 2025'
    publisher: MaltaToday
    date: '2026-07-27'
    url: https://www.maltatoday.com.mt/news/national/143438/building_mad_12325_new_dwellings_approved_in_2025
    note: The claim. 403 to scripts; read in full from the maintainer's browser copy on 17 Nov 2026 (sha256 in archive/manifest.csv).
  - title: Economy - Residential Building Permits
    publisher: National Statistics Office
    date: '2026-04-10'
    url: https://nso.gov.mt/economy-residential-building-permits/
    note: 'Primary: 2,213 permits and 12,325 new dwellings in 2025. Maintainer''s browser copy, read 17 Nov 2026.'
  quote: Approved residential units reached 12,325 in 2025, the third-highest annual total ever, while approvals on ODZ land
    more than doubled to a record 226 units.
counter_evidence: 'NSO Q4 releases, Table 1 (read in a browser 17 Nov 2026): approved new dwellings 2025 by quarter 2,143,
  3,027, 3,668, 3,487 = 12,325; 2024 = 8,716, so +41.4%; 2023 = 8,112; 2022 = 9,523. Press reports of NSO figures give 2018
  12,885 (one report 12,855) and 2019 12,485, both above 2025 (second-hand: NSO releases before 2022 are no longer online);
  2007-2017 and 2020-2021 not read. MaltaToday''s own sums (43,912 in 2007-2015; 96,194 in 2016-2025) leave about 8,000 a
  year for the four 2016-2025 years not on file. The ODZ count (226) is from the Planning Authority''s dataset, not the NSO,
  and was not read (pa.org.mt security check). Approvals are permits, not completions.'
tests: 'NSO residential building permits quarterly tables 2022-2025 summed by year; press reports of NSO 2018-2019 totals;
  Planning Authority ODZ series (not read).'
why_low_hanging: The NSO publishes the series; the ranking and "record" can be recomputed.
tags: []
