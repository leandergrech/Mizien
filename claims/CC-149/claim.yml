data_readiness: 'Medium: nso.gov.mt and maltatoday.com.mt return 403 to curl and WebFetch; Planning Authority data may need
  a browser. Ask the maintainer for the NSO release text if refused.'
caveats: Candidate from weekly intake 1 Nov 2026. Publication date of the MaltaToday article unconfirmed. The numbers are
  the NSO's; the superlatives are the outlet's. Do not judge individual permits.
