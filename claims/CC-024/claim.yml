subclaims:   # parts of the claim tested separately (the report's sub-claim table), numbered parent + letter;
             # kept in step with the report by scripts/subclaims.py; tone is the colour of the report's chip
  - id: CC-024A
    text: "The 2030 contribution is 11.5%"
    said_by: "Claim record"
    finding: "11.5% is the earlier contribution that the plan raises (p. 22). It is not the 2030 figure."
    rating: "Outdated"
    tone: red
  - id: CC-024B
    text: "It is 25% (or 24.5%)"
    said_by: "Plan [1]"
    finding: "25% is the summary ambition; 24.5% is the projection and trajectory end-point (pp. 21, 83)."
    rating: "Accurate, rounded"
    tone: green
  - id: CC-024C
    text: "Malta will reach it through solar PV"
    said_by: "Claim record"
    finding: "PV is one of four named contributors; 350 MWp by 2030 needs a faster pace; its points of share are not quantified."
    rating: "Partly supported"
    tone: amber
  - id: CC-024D
    text: "…and through offshore wind"
    said_by: "Claim record; plan summary"
    finding: "The plan counts no offshore wind in the 2030 share (p. 83)."
    rating: "Not supported"
    tone: red
  - id: CC-024E
    text: "Malta will reach the 2030 share"
    said_by: "Plan"
    finding: "17.2% in 2024 against 15.5% on the plan’s path; Commission: below its formula and reference points. A target, rated as a pledge."
    rating: "On track (pledge)"
    tone: green
