id: CC-024
title: Renewables target for 2030
category: Climate & Energy
subtopic: Renewables
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Updated National Energy and Climate Plan (Dec 2024): Malta will reach its 2030 renewable-energy contribution (11.5%
    of gross final energy consumption in the EU-reported target; 25% cited in summaries) through solar PV and offshore wind.'
  speaker: Government of Malta (NECP 2021-2030, updated)
  date: 2024-12
  wording_status: Verbatim found
  sources:
  - title: Malta's National Energy and Climate Plan (updated, December 2024)
    publisher: Energy and Water Agency
    date: Dec 2024
    url: https://energywateragency.gov.mt/wp-content/uploads/2025/01/MT-%E2%80%93-FINAL-UPDATED-NECP-2021-2030-English.pdf
    note: Primary plan; the agency's copy sits behind a captcha. Same plan as submitted, below.
  - title: Malta - Final updated NECP 2021-2030 (submitted in 2025)
    publisher: European Commission
    date: 7 Jan 2025
    url: https://commission.europa.eu/publications/malta-final-updated-necp-2021-2030-submitted-2025_en
    note: The plan as submitted (381 pages). Read 5 Oct 2026; quoted passages and printed page numbers in literature/CC-024/primary-source.md
      (summary table pp. 21-22; projection and Table 3 pp. 82-83; PV p. 84; offshore p. 25 and p. 78).
  - title: 'Assessment of the final updated NECPs, SWD(2025) 140: Malta extract'
    publisher: European Commission
    date: May 2025
    url: https://commission.europa.eu/document/download/bf1c1e17-293c-4c50-92ca-1ae663ab6cae_en?filename=MT_Extract_SWD+2025_140.pdf
    note: 24.5% below the 28% formula result; 2025 and 2027 points below reference points; PV support not quantified (Table
      1, section 2.2).
  - title: Share of energy from renewable sources (nrg_ind_ren)
    publisher: Eurostat
    date: 15 Sep 2026
    url: https://ec.europa.eu/eurostat/databrowser/view/nrg_ind_ren/default/table
    note: Malta 17.2% in 2024; 2025 provisional. Retrieved 5 Oct 2026 (data/cc-024/).
  - title: 'Renewable Energy from Photovoltaic Panels (PVs): 2024 (NR 111/2025)'
    publisher: National Statistics Office
    date: 24 Jun 2025
    url: https://nso.gov.mt/energy/renewable-energy-from-photovoltaic-panels-pvs-2024/
    note: 252.255 MWp at end-2024. Page returns 403 to scripts; figures second-hand via a search summary.
  quote: Increase the Renewable Energy contribution from 11.5% to 25% through multiple initiatives to focus on more diversification
    in onshore and offshore technologies
counter_evidence: 'The plan itself gives three figures: 11.5% (the earlier contribution), 25% (summary ambition) and 24.5%
  (projection). Its projection counts no offshore wind (p. 83); its summary lists offshore technologies among the means (p.
  22). Malta''s share was 17.2% in 2024 (Eurostat) against 15.5% on the plan''s path, 18.8% provisional for 2025 (plan 16.5%;
  Commission reference point 18%); the rise is in heating and cooling (23.0% to 59.2% of sector use, 2020-2024), while electricity
  moved 9.5% to 10.7%. The Commission finds 24.5% below the 28% formula result and PV support unquantified. PV: 252.3 MWp
  end-2024 (NSO, second-hand), about 16 MWp a year needed for 350 MWp against 11.5 net in 2024.'
tests: NECP text; Eurostat nrg_ind_ren; Commission assessment SWD(2025) 140; NSO PV capacity.
why_low_hanging: 'Done: Claim Check 024 report and flyer.'
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.0)
data_readiness: High
caveats: 'The claim record''s wording was the intake''s paraphrase; the check assesses the plan''s own sentences. The 2019
  NECP (source of the 11.5%) was not read. NSO PV figures are second-hand (nso.gov.mt returns 403). Eurostat''s 2025 value
  is provisional. Points of share per technology cannot be tested: the plan gives no breakdown. Draft pending right of reply
  (Not substantiated); a pledge label (On track, as of 15 Sep 2026) applies to delivery of the plan''s 24.5%.'
