id: CC-098
title: Officials enforce private interests at Blue Lagoon
category: Tourism & Population
subtopic: Short lets & concessions
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Moviment Graffitti (24 Jun 2026): Malta Tourism Authority officials forced a group of friends lying on a rocky part
    of the public Blue Lagoon beach, where there were no sunbeds or umbrellas, to move away, and threatened to call the police;
    sunbed and umbrella concessions give operators no permanent right of occupation and no authority to use public officials
    to remove beachgoers from a public beach.'
  quote: '"...ordered them to leave and even threatened to call the police."'
  speaker: Moviment Graffitti
  date: '2026-06-24'
  wording_status: Verbatim found
  sources:
  - title: Visit Malta officials filmed telling citizens to leave deckchair-occupied beach in Comino
    publisher: The Shift News
    date: 24 Jun 2026
    url: https://theshiftnews.com/2026/06/24/visit-malta-officials-filmed-telling-citizens-to-leave-deckchair-occupied-beach-in-comino/
    note: The outlet's account of the NGO release (read in full 15 Oct 2026); not a separate source for the incident.
  - title: 'VIDEO: Public officials enforce illegitimate private interests at the Blue Lagoon'
    publisher: Moviment Graffitti
    date: 24 Jun 2026
    url: https://movimentgraffitti.org/2026/06/24/video-public-officials-enforce-illegitimate-private-interests-at-the-blue-lagoon/
    note: The speaker's own release (EN/MT), read in full 15 Oct 2026. The video it links was not viewed.
  - title: PN demands answers over Blue Lagoon incident and calls for publication of Comino Capacity Study
    publisher: TVM News
    date: 24 Jun 2026
    url: https://tvmnews.mt/en/news/pn-demands-answers-over-blue-lagoon-incident-and-calls-for-publication-of-comino-capacity-study/
    note: Carries the Ministry for Tourism and MTA response as indirect speech (no quotation marks).
  - title: 'Graffitti warns PM over Comino abuse: This is only the tip of the iceberg'
    publisher: Newsbook
    date: 25 Jun 2026
    url: https://newsbook.com.mt/en/graffitti-warns-pm-over-comino-abuse-this-is-only-the-tip-of-the-iceberg/
    note: Reports the Prime Minister's words with Newsbook's quotation marks ('isolated episode', 'not public').
  - title: Lands Authority Act (Cap. 563), art. 7(2)(c)
    publisher: Laws of Malta
    date: retrieved 15 Oct 2026
    url: https://legislation.mt/eli/cap/563/eng
    note: Foreshores and portbeaches listed among public-domain land administered by the Authority.
counter_evidence: 'The Prime Minister is reported (Newsbook, 25 Jun 2026; no transcript read) as calling the video an "isolated episode" and
  saying the area was "not public"; the Ministry for Tourism and the MTA said the Blue Lagoon and surrounding bathing areas remain
  public land (TVM News, indirect speech). No denial of the incident found in the four outlets read in full. Concession terms not
  published or not found; not tested.'
tests: Concession contracts; foreshore law; MTA statement.
why_low_hanging: A specific, attributable statement that public data can test.
