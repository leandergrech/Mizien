caveats: 'The video was not viewed: the incident is rated on the NGO''s release as repeated by The Shift, Lovin Malta and Newsbook, and
  on the absence of any denial in the sources read. The ministry/MTA response is read via TVM News (indirect speech) and the Prime
  Minister via Newsbook; neither original was read. Concession agreements and any MTA instruction to officers were not found.
  Sub-claim on concession rights is a legal argument, not tested. No right of reply needed.'
