id: CC-123
title: 'KPMG: 8,716 residential units approved in 2024, up 7.4%'
category: Planning & Housing
subtopic: Development & construction
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'KPMG, Construction Industry and Property Market Report 2025, commissioned by the Malta Development Association (Dec
    2025, section 2.1), citing NSO data: 8,716 residential units were granted approval in 2024, a 7.4% increase on 2023, and
    5,170 permits were sanctioned in January to June 2025, a 9.7% year-on-year increase, so the 2025 total is expected to
    surpass 2024.'
  speaker: KPMG
  date: 2025-12
  wording_status: Verbatim found
  sources:
  - title: Construction Industry and Property Market Report 2025 (section 2.1 Residential permits, PDF p. 37)
    publisher: KPMG for the Malta Development Association
    date: 2025-12
    url: https://assets.kpmg.com/content/dam/kpmgsites/mt/pdf/2025/12/kpmg-mda-construction-industry-and-property-market-report-2025.pdf
    note: The claim. Downloaded and read on 16 Oct 2026 (section 2.1, PDF p. 37); not committed (copyright); SHA-256 in data/cc-123/source_hash.txt. The same report is the source of CC-062.
  quote: According to data published by the NSO, a total of 8,716 residential units were granted approval in 2024, representing
    a 7.4% increase compared with 2023 ... Between January and June 2025, 5,170 permits were sanctioned, reflecting a significant
    year-on-year increase of 9.7%.
counter_evidence: 'The figures reproduce: Planning Authority 8,112 (2023) and 8,716 (2024), +7.45%; Eurostat index of dwellings permitted +7.3%; NSO quarters (second-hand) sum to 5,170 dwellings for January-June 2025 (+9.7%). The 5,170 are dwelling units, not permits (about 1,023 building permits, second-hand), so the noun is loose. MaltaToday''s falling permit counts (2,868 in 2018 to 1,749 in 2024, second-hand) count permits, not dwellings; the NSO permit counts rose about 3% in 2024 (second-hand). The forecast was borne out: Planning Authority 12,325 units in 2025.'
tests: NSO development permits / residential permits releases (units approved by year and half-year); Planning Authority permit
  statistics; Eurostat building permits (sts_cobp_a or equivalent) for the index of dwellings permitted; compare the NSO and
  parliamentary counts and the units-versus-permits definitions.
why_low_hanging: An annual unit count from the NSO that can be re-read directly and set against a conflicting permits series.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium to high: the report was read as text via WebFetch on 11 Oct 2026, but net_check.py reported assets.kpmg.com as 404 to a scripted request; a worker may need the file supplied. NSO and Eurostat are reachable.'
caveats: 'Largely supported: no right of reply needed. The NSO quarterly figures and the Q4 2025 split were read second-hand (nso.gov.mt and pa.org.mt refuse scripts); the Planning Authority series was transcribed on 3 Oct 2026 for CC-013. The report is KPMG''s, prepared for the Malta Development Association; the MDA''s endorsement of this section is not recorded.'
