claim:
  text: 'ADPD - The Green Party (deputies Carmel Cacopardo and Melissa Bagley, 26 May 2026): Malta has not yet acknowledged
    the impact of noise from the Malta Freeport and Malta International Airport on nearby residents, and should
    commission a study of it (and of entertainment-industry noise).'
  speaker: ADPD - The Green Party
  date: '2026-05-26'
  wording_status: 'Paraphrase: locate quote'
  sources:
  - title: 'Air and noise pollution are harming our health: ADPD'
    publisher: Newsbook
    date: '2026-05-26'
    url: https://newsbook.com.mt/en/air-and-noise-pollution-are-harming-our-health-adpd/
    note: Locator. The article states the call for a study; read the party press statement for exact wording.
counter_evidence: EU noise-mapping rules cover major airports and roads, so some exposure data may already exist;
  whether Freeport noise is mapped is not yet checked. The article gives no decibel or exposure figures, and the
  claim is that no study exists, which can be tested by looking for one.
tests: Strategic noise maps and action plans (Directive 2002/49/EC) for Malta International Airport; ERA/TM noise
  reports; Freeport environmental permits and monitoring; WHO 2018 Environmental Noise Guidelines for Europe.
why_low_hanging: '''No study exists'' is falsifiable by finding one; exposure data can then be set against WHO guidelines.'
