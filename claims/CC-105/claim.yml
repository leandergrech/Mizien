claim:
  text: 'ADPD - The Green Party (deputy chairpersons Carmel Cacopardo and Melissa Bagley, press conference in Birżebbuġa,
    26 May 2026): Malta has yet to acknowledge the effect of noise pollution on the health of people living near the Malta
    Freeport and Malta International Airport, and should study the impact of noise from the Freeport and the airport on nearby
    residents (and of entertainment-industry noise).'
  speaker: ADPD - The Green Party
  date: 2026-05-26
  wording_status: 'Verbatim found'
  sources:
    - title: It-tniġġis qiegħed iħassrilna saħħitna / Pollution is negatively affecting our health
      publisher: ADPD - The Green Party
      date: '2026-05-26'
      url: https://adpd.mt/it-tniggis-qieghed-ihassrilna-sahhitna-adpd/
      note: "The claim: party press statement, Maltese and English. Read in full 5 Oct 2026 (WordPress API, post 17576). Also\
        \ says 'There is a need to study the impact of noise from the Freeport operations and the airport on the surrounding\
        \ residential community.'"
    - title: Round 4 Final Project Report, Strategic Noise Mapping in Malta (Lemitor)
      publisher: Environment and Resources Authority
      date: 2024-11
      url: https://era.org.mt/wp-content/uploads/2024/12/R4_Noise_Maps_Malta_Final_Report_compressed.pdf
      note: Read in full from an Internet Archive copy. Industrial sites mapped (7); the Freeport is not among them; no mention
        of the Freeport.
    - title: Malta International Airport Noise Modelling, Final Report (round 3)
      publisher: ERA / Acustica
      date: 2019-03
      url: https://era.org.mt/wp-content/uploads/2019/10/593-14-2v3-1_Malta-International-Airport-R3-Final-Report.pdf
      note: 'Table 9.2: 9,666 people at 55 dB Lden or more and 827 at 50 dB Lnight or more (2016). Internet Archive copy.'
    - title: Effects of Noise Pollution on Residents Living in Birzebbuga and the Introduction of Effective Mitigation Measures
      publisher: Int. J. Sustainable Development and Planning 17(7), Falzon et al.
      date: '2022'
      url: https://doi.org/10.18280/ijsdp.170732
      note: Open access; read in full; Crossref verified. Five monitoring points, 477 questionnaires.
    - title: Level of noise disturbance at Birżebbuġa is higher than that established by WHO
      publisher: TVM news
      date: '2015-12-29'
      url: https://tvmnews.mt/en/news/level-of-noise-disturbance-at-birzebbuga-is-higher-than-that-established-by-who/
      note: Second-hand report of a year-long study commissioned by Malta Freeport Terminals (report not seen).
    - title: Analysing Malta's implementation of Directive 2002/49/EC (PE 783.089)
      publisher: European Parliament
      date: 2026-02
      url: https://doi.org/10.2861/6278624
      note: Legal context; see CC-020.
  quote: This country has yet to acknowledge that noise pollution is having an effect on the health of those who live near
    the Freeport or the airport, including its points of access.
counter_evidence: 'None of five ERA noise documents (round 4 report, two Noise Action Plans, consultation annex, airport round
  3 report) mentions the Freeport; the licensed industrial sites mapped (8 in round 3, 7 in round 4) exclude it. But aircraft
  noise is mapped and published (round 3: 9,666 people at 55 dB Lden or more, 827 at 50 dB Lnight or more, 2016) and the Noise
  Action Plan states WHO health levels, and Freeport-area noise was measured in a Freeport-commissioned study (2014-15, second-hand
  via TVM) and a University of Malta study (2020-21: daytime averages 55 dBA or more at all five Birżebbuġa points; 98% of
  477 respondents called noise a problem). No health-outcome study of residents near either site was found.'
tests: ERA noise documents searched in full text; Falzon et al. (2022); TVM (2015); tools/cc-105-report/calc.py on data/cc-105/.
why_low_hanging: 'Done: Claim Check 105 report and flyer.'
