caveats: 'Largely supported: no right of reply needed. ''Yet to acknowledge'' overstates the case for the airport (mapped
  and published) and for Freeport-area noise (measured twice); the absence of a health-outcome study is shown only for public
  sources. The 2014-15 Freeport study is known only second-hand. ERA documents read from Internet Archive copies (era.org.mt
  403). Entertainment noise not checked.'
