id: CC-117
title: 'EU: Malta missed recycling targets (reasoned opinion)'
category: Waste
subtopic: Recycling & separation
status: Drafted
verdict: Largely supported
verdict_confidence: High
claim:
  text: 'European Commission (July 2026 infringement package, 8 Jul 2026): Malta missed the 50% municipal waste preparing-for-reuse-and-recycling
    target for 2020 and the targets for total packaging, paper and cardboard and metals (2020 to 2023), and the Commission
    has sent a reasoned opinion (INFR(2024)2135), the second stage of infringement proceedings.'
  speaker: European Commission
  date: '2026-07-08'
  wording_status: Verbatim found
  sources:
  - title: 'July infringements package: key decisions'
    publisher: European Commission, Representation in Malta
    date: '2026-07-08'
    url: https://malta.representation.ec.europa.eu/news/july-infringements-package-key-decisions-2026-07-08_en
    note: 'The claim. Full page read 13 Oct 2026 (Commission Representation in Malta; page metadata give 8 Jul 2026 for the decisions). The Commission press-corner version and the decision text were not opened.'
  - title: EU escalates action against Malta over missed recycling targets
    publisher: Newsbook
    date: '2026-07-09'
    url: https://newsbook.com.mt/en/eu-escalates-action-against-malta-over-missed-recycling-targets/
    note: 'Locator: reports the reasoned opinion. No government reaction quoted in the text read.'
  quote: Malta (INFR(2024)2135) ... for failing to meet several waste recycling targets ... Bulgaria, Czechia, Germany, Greece, Spain, Croatia, Cyprus, Hungary, Malta, Poland, Portugal and Romania have failed to meet the 50% target of preparing for reuse and recycling of municipal waste ... which was to be reached by 2020. ... Malta missed the targets for total packaging, paper and cardboard and metals.
counter_evidence: 'Eurostat reproduces the findings: municipal recycling rate 10.9% in 2020 (target 50%; lowest of the EU-27), 16.7% in 2024 (EU-27 48.1%). Packaging 2020-2023: total 40.0/36.8/30.8/43.4% (target 55%), paper and cardboard 47.8/45.3/40.6/53.6% (60%), metals 57.2/27.1/13.0/15.2% (50%), so metals met the target in 2020. Eurostat also shows plastics (2020-2022), wood (0.0%) and glass (2022, 43.3%) below the page''s targets, which the Commission does not list for Malta (unexplained; decision text not read). A reasoned opinion is the Commission''s position, not a court finding; no Maltese response found.'
tests: Eurostat env_wasmun (municipal recycling rate and the 2020 target year, Malta against 50%); Eurostat env_waspac (packaging
  recycling rates by material, 2020 to 2023); the Commission decision text (INFR(2024)2135, July 2024 letter of formal notice);
  Directive 2008/98/EC and Directive 94/62/EC target definitions and calculation rules (including the 2020 target year).
why_low_hanging: An EU institution's statement about measurable targets that Eurostat publishes year by year.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High for the data: Eurostat and ec.europa.eu are reachable. The Commission''s page is on a reachable host;
  Newsbook sometimes returns 403.'
caveats: 'Largely supported: no right of reply needed. We read the Commission''s summary page, not the decision text, the July 2024 letter of formal notice or the Directives; targets are as the page states them. Eurostat rates are not the Commission''s compliance calculation. Malta has two months from 8 Jul 2026 to respond; a referral to the Court would be a later stage.'
