claim:
  text: 'BirdLife Malta (Antonia Micallef, public engagement executive, by email to Mongabay, published 5 Oct 2026): ''Over
    10,000 hunters [are] active at any one time'', and ''Between 14 and 21 September alone, BirdLife Malta collected 21 protected
    birds with confirmed shooting injuries''; BirdLife also says hunters shot more than 500 European turtle-doves after the
    storm, against an autumn quota of 500.'
  speaker: BirdLife Malta
  date: '2026-10-05'
  wording_status: Verbatim found
  sources:
  - title: Hunters reportedly kill hundreds of migratory birds stranded by thunderstorm in Malta (Spoorthy Raman)
    publisher: Mongabay
    date: '2026-10-05'
    url: https://news.mongabay.com/short-article/2026/10/hunters-reportedly-kill-hundreds-of-migratory-birds-stranded-by-thunderstorm-in-malta/
    note: 'Locates the claim: BirdLife Malta''s words quoted directly by Mongabay (read in full on 26 Oct 2026). BirdLife''s
      own release, if any, not yet found.'
  quote: Over 10,000 hunters [are] active at any one time
counter_evidence: 'Context, not tested: ''active at any one time'' is not a licence count; licences issued and hunters out
  on a given day differ. The 21 injured birds are BirdLife''s own collection records. The turtle-dove figure ''more than 500''
  would rest on the hunters'' own carcass-tag reports and BirdLife''s observations; BirdLife says the season closed on
  14 September once the quota was reached, and that hunting of turtle-doves continued afterwards.'
tests: WBRU annual reports and the government's autumn 2026 season notices (licences, reported turtle-dove catch, closure
  date); police and BirdLife records of protected birds shot (CC-049 is the 2025 Raptor Camp claim); the Ornis Committee minutes.
why_low_hanging: Licence numbers and the reported catch are published by the regulator.
