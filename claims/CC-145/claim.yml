id: CC-145
title: 'BirdLife Malta: over 10,000 hunters ''active at any one time''; 21 protected birds with shooting injuries collected in a week'
category: Nature & Wildlife
subtopic: Hunting & birds
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'BirdLife Malta (Antonia Micallef, public engagement executive, by email to Mongabay, published 5 Oct 2026): ''Over
    10,000 hunters [are] active at any one time'', and ''Between 14 and 21 September alone, BirdLife Malta collected 21 protected
    birds with confirmed shooting injuries''. (Mongabay''s own text, not in quotation marks, adds that the autumn turtle-dove
    quota of 500 was reached soon after the storm; not tested.)'
  speaker: BirdLife Malta
  date: '2026-10-05'
  wording_status: Verbatim found
  sources:
  - title: Hunters reportedly kill hundreds of migratory birds stranded by thunderstorm in Malta (Spoorthy Raman)
    publisher: Mongabay
    date: '2026-10-05'
    url: https://news.mongabay.com/short-article/2026/10/hunters-reportedly-kill-hundreds-of-migratory-birds-stranded-by-thunderstorm-in-malta/
    note: BirdLife Malta's words quoted directly by Mongabay (square brackets Mongabay's); read in full in a browser 16 Nov
      2026 (literature/CC-145/primary-source.md).
  quote: Over 10,000 hunters [are] active at any one time
counter_evidence: 'WBRU Game Reporting Data - 2025 Report (pp. 1-2): 10,091 general licences for hunting birds on land in
  2025 (one per licensee in the category; 7,913 spring, 3,301 rabbit, 4,099 live-capturing licences, overlapping). 636 land
  licensees (6.3%) filed any game report; 1,265 individuals filed 5,924 reports across all categories. Reports are required
  only when game is bagged, so neither figure measures hunters in the field. No source counts hunters active at the same
  time. The 21 injured birds are BirdLife''s own record; its releases of 14 and 16 Sep 2026 give cases but no total, and
  no police or WBRU count for the week was found (Government press releases 1 Sep-6 Oct 2026 searched).'
tests: WBRU 2025 licence and game-reporting tables; BirdLife's own September releases; Government press releases for the
  turtle-dove closure or casualty counts.
why_low_hanging: Licence numbers and the reported catch are published by the regulator.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium: wbru.gov.mt refuses scripts (maintainer''s browser copy of the 2025 report); BirdLife''s count is
  unpublished.'
caveats: 'Largely supported: no right of reply needed. The licence count (10,091, 2025) supports ''over 10,000 hunters'';
  ''active at any one time'' is not measured by any source. The 21-bird count is BirdLife''s own and is unverifiable until
  published; it counts birds collected with injuries, not birds shot. 2026 licence counts not yet published. Criticise statements,
  not hunters.'
