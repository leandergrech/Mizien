  quote: The benefit of this work is that the natural grass grows at a much faster rate well before the rainfall
    of the winter season. (Public Works Ministry statement, as reported by MaltaToday)
counter_evidence: 'Sentinel-2: the 2.8 ha gravel zone (Momentum measured ~2.2 ha) greened every winter before the
  gravel (winter median NDVI 0.37-0.47 in 2023-2025, level with the rest of the park) and stayed bare in winter 2025-26 (0.11)
  while the rest of the park was at 0.38. Summers were already bare before the gravel (~0.11), as the park
  management said. Gravel still in place and area bare in the last clear image, 27 Sep 2026. Soil-compaction reviews
  support the choking mechanism; gravel-sand mulch is a known water-conservation technique.'
tests: Sentinel-2 NDVI and brightness 2023-2026 against a control area in the same park; soil compaction literature.
why_low_hanging: 'Done: Claim Check 012 report and flyer.'
