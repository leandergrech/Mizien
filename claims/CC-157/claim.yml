id: CC-157
title: 'Business Now (reporting a Nature Communications study): extreme heat could cut Malta''s GDP by over 2.5% by 2055-64'
category: Health & Safety
subtopic: Heat & health
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Business Now (Nicola Zammit, 18 Jul 2025, citing Euronews and the Nature Communications study by David García-León
    and colleagues): ''GDP impacts from extreme heat exceeding -2.5 per cent by the 2055-2064 period'' for Malta, if there
    is no further adaptation or mitigation.'
  speaker: Business Now
  date: '2025-07-18'
  wording_status: Verbatim found
  sources:
  - title: Extreme heat set to leave 2.5% dent in Malta's GDP by mid-century
    publisher: Business Now
    date: '2025-07-18'
    url: https://businessnow.mt/extreme-heat-set-to-leave-2-5-dent-in-maltas-gdp-by-mid-century/
    note: The outlet's sentence; no link to the paper. Read 8 Nov 2026 via WebFetch (summarised).
  - title: 'Heatwaves in Europe: which countries face the biggest GDP and labour productivity losses'
    publisher: Euronews
    date: '2025-07-15'
    url: https://www.euronews.com/business/2025/07/15/heatwaves-in-europe-which-countries-face-the-biggest-gdp-and-labour-productivity-losses
    note: Lead, not retrieved; cited by Business Now.
  - title: Current and projected regional economic impacts of heatwaves in Europe (García-León et al.)
    publisher: Nature Communications 12, 5807
    date: '2021-10-04'
    url: https://doi.org/10.1038/s41467-021-26050-z
    note: 'The study the claim rests on, per search summaries (second-hand): published in 2021, not 2025; whether it contains
      the Malta figure is unverified.'
  quote: GDP impacts from extreme heat exceeding -2.5 per cent by the 2055-2064 period
counter_evidence: >-
  García-León et al. (2021, Nature Communications 12:5807; full text read, CC BY 4.0) Fig. 4b shows Malta at about -2.8% of GDP a year in 2055-2064 (measured from the figure, +/-0.1 pp; 4th of 29 entries after Cyprus, Croatia, Portugal), beyond the 2.5% in the claim. Conditions: RCP8.5 with two regional climate models, no further adaptation (e.g. air conditioning), fixed economic structure; the paper says the climate signal is very similar across emission scenarios to 2050 and that losses rise even under stringent mitigation. Malta is not named in the text; no country table or Malta range is published. The study dates from 2021, not 2025. Euronews wording (second-hand): 'reaching or exceeding -2.5% of GDP'.
tests: The paper (open access) and its regional data for Malta (NUTS 2 MT00) and scenario; any later update by the authors
  or the JRC; compare with Malta's own heat-impact estimates.
why_low_hanging: The paper is open access and the regional projections are published.
tags:
- Conditional-turned-unconditional
tags_provisional: true
priority: Done (v1.0)
data_readiness: 'Medium: doi.org and nature.com may be refused; Euronews and Crossref lookups may work; Business Now readable.'
caveats: >-
  No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading or Contradicted). Malta's value is read from a dot plot (about 2.8%, +/-0.1 pp); the paper publishes no Malta table or range. A model projection under RCP8.5 with no extra adaptation, not a forecast. The study is from 2021. Business Now and Euronews were read only through a summarising tool (curl blocked): the exact Business Now wording was not re-confirmed on 10 Nov 2026 and the Euronews wording is second-hand. The Supplementary Discussion on other scenarios was not read; no search for a newer study with a Malta value.
right_of_reply:
  sent: null
  deadline: null
  response: null
