id: CC-164
title: 'Budget 2027: eco-contribution to €8 a night (€10 short lets) to raise about €182 million'
category: Tourism & Population
subtopic: Tourism numbers & capacity
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Clyde Caruana, Minister for Finance, Budget Speech 2027 (26 Oct 2026, in Maltese, pp. 26-27): ''Mill-1 ta'' Jannar
    li ġej, l-eko-kontribuzzjoni li trid titħallas minn dawk li jirrisjedu f''akkomodazzjoni kollettiva se tkun dik ta'' €8
    kull lejl sa massimu ta'' €64 kull persuna. Ir-rata tal-eko-kontribuzzjoni għal dawk li jirrisjedu f''appartamenti hekk
    magħrufa bħala short lets se tkun dik ta'' €10 kull lejl sa massimu ta'' €80 kull persuna. Id-dħul minn dawn ir-reviżjonijiet
    mistenni jkun madwar €182 miljun.'' (Our translation: from 1 January the eco-contribution in collective accommodation
    will be €8 a night up to €64 a person, and in short lets €10 a night up to €80; the revenue from these revisions is expected
    to be around €182 million.)'
  speaker: Clyde Caruana, Minister for Finance (Budget Speech 2027)
  date: '2026-10-26'
  wording_status: Verbatim found
  sources:
  - title: Diskors tal-Baġit 2027 (Budget Speech 2027)
    publisher: Ministry for Finance
    date: '2026-10-26'
    url: https://finance.gov.mt/
    note: The claim in the Minister's own words (Maltese), printed pp. 26-27. finance.gov.mt refuses scripts; maintainer's
      copy (80 pp.) read 17 Nov 2026 (sha256 in archive/manifest.csv). The PDF's own URL was not recorded.
  - title: 'Budget 2027: Eco-tax rises to €8 a night for hotel guests and €10 for short-lets'
    publisher: Newsbook
    date: '2026-10-26'
    url: https://newsbook.com.mt/en/budget-2027-eco-tax-rises-to-e8-a-night-for-hotel-guests-and-e10-for-short-lets/
    note: Rates and EUR 182 million in the outlet's own narration (read 15 Nov 2026).
  quote: Id-dħul minn dawn ir-reviżjonijiet mistenni jkun madwar €182 miljun.
counter_evidence: 'A forecast, tested for plausibility. NSO Inbound Tourism December 2025: 13.49 million nights in collective
  and 8.96 million in other rented accommodation in 2025; at the new rates that is EUR 198 million (all ages, no caps), about
  EUR 176 million for adults (assumed under-18 share 11%) and about EUR 193 million scaled to the 28 million nights the speech
  expects in 2026; the 8-night caps (38% of tourists stay 7+ nights) and the English-school exemption lower these. The speech
  does not say whether EUR 182 million is total or additional; Amphora Media reports the Estimates at EUR 213 million in 2027
  against EUR 21 million in 2026 (second-hand), which fits EUR 182 million as extra accommodation revenue plus the new cruise
  and Comino fees. The ''about EUR 80 million'' attributed to MaltaToday is the speech''s work-permit fee yield; MaltaToday''s
  own blog says EUR 214 million.'
tests: Budget Speech 2027 text; NSO inbound tourism nights by accommodation type and age, 2025; the speech's 2026 night total;
  the Estimates figure as reported (second-hand).
why_low_hanging: Yield is a transparent multiplication of published guest-night data by the stated rate and caps.
