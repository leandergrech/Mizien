claim:
  text: 'PN programme 2026: a clear and realistic plan for Gozo to become a Net-Zero Island by 2040, with afforestation
    among several measures. News summaries said net zero "through afforestation". (Checked as part of CC-011 until
    5 Oct 2026.)'
  speaker: Nationalist Party
  date: 2026-05
  wording_status: Verbatim found
  sources:
  - title: 'Nifs Ġdid: Programm Elettorali, chapter Għawdex'
    publisher: Partit Nazzjonalista
    date: '2026'
    url: https://pn.org.mt/en/nifsgdid/ghawdex/
    note: Read in a browser. Net-Zero Island by 2040; afforestation one of several measures.
  - title: PN approves its electoral manifesto
    publisher: MaltaToday
    date: May 2026
    url: https://www.maltatoday.com.mt/news/election-2026/141891/pn_approves_its_electoral_manifesto
    note: News summary ("net-zero island through afforestation").
  - title: 'Clean energy for EU islands: Energy Baseline Scenario for Gozo'
    publisher: Clean energy for EU islands secretariat (European Commission)
    date: 25 Jan 2023
    url: https://clean-energy-islands.ec.europa.eu/system/files/2025-06/REPORT_TechnicalAssistance_Gozo_20230223.pdf
    note: Read in full 5 Oct 2026. Table 16, energy-related CO2 118,333-153,997 t a year (2016-2020). Not official
      statistics.
  - title: 'Clean energy for EU islands: Malta'
    publisher: European Commission
    date: n/d
    url: https://clean-energy-islands.ec.europa.eu/countries/malta
    note: Gozo area 67 km2.
  - title: 'Malta: Maltese House of Representatives 2026 General'
    publisher: IFES ElectionGuide
    date: Accessed 5 October 2026
    url: https://electionguide.org/elections/id/5161/
    note: Source for the 30 May 2026 general election (Labour won; the PN pledge is an opposition proposal).
  quote: Infasslu pjan ċar u realistiku biex sal-2040, Għawdex isir Net-Zero Island
counter_evidence: 'The programme promises a plan but publishes no baseline, boundary or pathway, and there is no official
  greenhouse-gas inventory for Gozo. A 2023 study for the EU islands secretariat put Gozo''s energy-related CO2 at
  118,000-154,000 t a year (2016-2020); our population-based estimate is about 157,000 t. Offsetting that by
  afforestation alone would need 4.9-6.3 times Gozo''s land area at a measured semi-arid rate (1.5-8.5 times across a
  wider range). The PN''s text relies on cuts first; "through afforestation" is a news summary.'
tests: Gozo carbon arithmetic with a measured sequestration rate (Grünzweig et al. 2007); Eurostat Gozo population; the
  2023 Energy Baseline Scenario for Gozo; EC Clean energy for EU islands (Gozo area).
why_low_hanging: 'Done: Claim Check 107 report and flyer (split from Claim Check 011).'
