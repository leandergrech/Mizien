priority: Done (v1.0)
data_readiness: 'Medium: Business Now readable via WebFetch only; NSO and Eurostat data reused from CC-135; NAO review and Enemalta investment data browser-only (403).'
caveats: "Not substantiated: pending right of reply. The rise in demand was foreseeable (the 2017-2022 trend gives 631 MW for 2025; actual 637 MW) but population and tourists explain only about 31% of the 2018-2023 rise in the peak. 'Investment was not enough' has no figure in the Chamber's statement, and the National Audit Office review (July 2024) and Enemalta spending data could not be opened (403): the EUR 15 million and EUR 5.7 million figures are second-hand (The Shift, search summaries). The Chamber's words were read only through a web reader; check them against the page. The growth-model characterisation is not rated. Related to CC-027, CC-028, CC-097, CC-115, CC-135."
