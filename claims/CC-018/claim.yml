  - date: 2026-10-05
    step: version
    version: "1.1"
    correction: true   # this version corrects errors in an earlier one
    note: "Corrections: (1) “The MDA’s own release was not found” → found and read [5] (published 8 Feb 2026, modified 17 Jun 2026); the quote now uses its wording (“the Malta Developers Association” where MaltaToday wrote “the MDA”) and is no longer second-hand; Section 1 notes that the release does not mention the IMF’s “vulnerability” warning. (2) “Incomes have kept pace with prices” → “incomes grew faster than house prices” (price-to-income −10.7%); flyer “Prices kept pace with incomes” → “Incomes grew faster than prices”. (3) Flyer “IMF: no sign of a bubble” → “IMF: ratios “stable””; sub-claim A “no overvaluation” → “prices aligned with fundamentals”. (4) Housing-cost overburden: Eurostat flags a break in Malta’s series in 2023, so “1.1% → 6.0% (2015–2025)” and “fivefold” → like-for-like runs 1.1% → 2.9% (2015–2022) and 6.0% / 5.9% / 6.0% (2023–2025), in the TL;DR, tile, Figure 1 caption, table, Q3, Limitations and flyer. (5) DOI of the IMF report added to the literature record. Verdict and confidence unchanged."
  - date: 2026-10-05
    step: version
    version: "1.2"
    note: "Upgrade: (1) New Section 5 and sub-claims D–G test the release’s other statements: the IMF’s two-year cycle (supported [2]); “the first EU economy” on it (contradicted: Luxembourg was on the 24-month cycle in 2000–2002 [9]; Malta is the only EU member on it in the 2025–2026 reports [8]; IMF criteria [7]); GDP per head “nearly doubled” (largely supported) and “far higher than the EU average” (not substantiated) [10]. (2) Section 1: the IMF phrases the release quotes on overvaluation and income growth, not in Country Report 26/29, traced to an IMF Selected Issues paper of 13 March 2026 [6]. (3) Section 4: house prices to the second quarter of 2026 (provisional) and Figure 3, house prices against incomes per head, 2015 = 100. (4) TL;DR, key points, tiles, Section 3 table, Why, requests, limitations and flyer updated; sections renumbered. Verdict unchanged. Maintainer decision (5 Oct 2026): confidence raised from Moderate to High, because the MDA’s own release is now verified. Maintainer decision (5 Oct 2026): a right of reply is sought only where a check finds a claim Not substantiated, Misleading or Contradicted, so this check needs none; cover, page footer and flyer now say “no right of reply needed”."
