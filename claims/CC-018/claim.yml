caveats: 'No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading
  or Contradicted). MDA release read (5 Oct 2026) and matches the quote; the page was modified on 17 Jun 2026 and the
  original text was not seen. The release does not mention the IMF''s ''vulnerability'' warning on bank exposure. MDA-commissioned
  study not seen. Eurostat flags a break in Malta''s overburden series in 2023. House prices from 2025 Q3 and Malta household
  income 2021-2024 are provisional; household income not yet published after 2024. The consultation-cycle comparison uses
  the latest EU staff reports and, for earlier years, Luxembourg only. The v1.2 sub-claims D-G (the release''s statements
  on the IMF cycle and GDP per head) are rated separately and do not change the verdict. Maintainer decision (5 Oct 2026):
  confidence raised from Moderate to High, because the MDA''s own release is now verified.'
