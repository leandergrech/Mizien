counter_evidence: 'The programme lists afforestation among the ways Gozo''s emissions would be "reduced or offset" by 2040
  but gives no area, number of trees, species, sites, carbon rate or date. Offsetting Gozo''s energy CO2 (118,333-153,997 t
  a year in 2016-2020, a study for the EU islands secretariat) by trees alone would need new forest 4.9-6.3 times Gozo''s
  67 km2 at a rate measured in the Yatir pine forest (3.62 t CO2/ha a year), 2.3-3.0 times at a review''s plantation rate
  (7.6 t) and 19-25 times at the rate measured for native oaks in Spain (0.92 t). CORINE 2018 maps no forest on Gozo;
  planting all of its semi-natural land (1,265 ha, mostly garrigue and maquis, 36% of it in Natura 2000 sites) would offset
  3.0-3.9% (0.8-8.1% across rates). Malta''s whole forest is 470 ha (FAO definition, 2025); Malta''s water exploitation
  index was 30% in 2023 (Eurostat: permanent water scarcity); 20-year survival of planted pines was 30-58% in an arid
  Spanish trial. No indigenous-tree strategy appears in the programme''s 16 chapters; "indigenous" is used once, for farm
  varieties and breeds. "Through afforestation" is a news summary, not the PN''s wording.'
tests: 'PN programme read in full and searched (tools/cc-092-report/search_programme.py); forest area and offset shares in
  tools/cc-092-report/calc.py from the 2023 Energy Baseline Scenario for Gozo, Eurostat, CORINE 2018 and literature rates
  verified in Crossref (Grünzweig et al. 2007; Renna et al. 2024; Bernal et al. 2018); Natura 2000 overlap
  (tools/cc-092-report/natura.py).'
