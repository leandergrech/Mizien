claim:
  text: 'PN programme 2026 (Nifs Ġdid, in Maltese; our translation), chapter Għawdex, item 46: a plan so that by 2040 Gozo
    becomes a Net-Zero Island, "where every unit of emissions generated is reduced or offset" by initiatives such as
    solar panels, electric vehicles, building efficiency, ecological restoration, "afforestation" and water and soil
    conservation, "among others". The environment chapter adds "more afforestation and open spaces in both Malta and
    Gozo" (item 01) and tree planting and afforestation against heat, flooding and pollution (item 20). News summaries
    said Gozo would become net zero "through afforestation" and reported a national indigenous-tree strategy; neither
    is in the programme.'
  quote: every unit of emissions generated is reduced or offset by concrete and sustainable initiatives, such as ...
    afforestation ... among others (our translation of "kull unità ta’ emissjonijiet iġġenerata tkun imnaqqsa jew
    ikkumpensata b’inizjattivi konkreti u sostenibbli, bħal ... afforestazzjoni ... fost l‑oħrajn")
  speaker: Nationalist Party (PN)
  date: '2026-05-18'
  wording_status: Verbatim found
