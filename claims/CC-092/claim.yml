caveats: 'A pure pledge check, labelled Not measurable as of 10 Oct 2026: pending right of reply from the Partit
  Nazzjonalista. An opposition proposal (Labour won the 30 May 2026 election); the Government''s climate-neutral Gozo
  (CC-031) and Labour''s tree pledge (CC-010) are held to the same standard. The net-zero plan itself is Claim Check 107;
  this check covers afforestation and the reported indigenous-tree strategy. Translation of the Maltese programme is ours.
  Gozo''s emissions come from an energy-only study (not official statistics) and a population share of Malta''s
  inventory. No Maltese afforestation carbon measurement was found; rates are from Spain, Israel and a global review.
  The offsets are ceilings (every hectare planted and reaching the rate). The indigenous-tree wording is MaltaToday''s,
  known only second-hand (403); it is not rated. Title restated from the intake''s "Gozo net-zero by afforestation" to
  what the programme says.'
