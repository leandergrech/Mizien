    note: "Upgrade. (1) New Figure 3: a map of Marsaxlokk Bay with sea depth (EMODnet), Posidonia meadows as mapped by UNEP-WCMC and EMODnet, full-resolution Natura 2000 boundaries and the new land at Terminal 2. Mapped meadows lie 0.2 km from the new land, about 120 ha within 1 km, where the sea is mostly 5–30 m deep. (2) Fairness: Malta’s Article 17 reports assess its Posidonia beds as favourable overall (2013–2018; 2019–2024, stable); the −34% loss is Mediterranean-wide (section 3, Q2, TL;DR, flyer). (3) The Prime Minister’s words are now quoted in full from Lovin Malta, and tested as sub-claim E (not tested: “ideal” is not defined). (4) Tile “0.4 km” → “120 ha” of mapped Posidonia (the 0.4 km stays in the text). (5) A bay-wide Sentinel-2 check for other new land was tried and dropped as not robust (limitations). Verdict and confidence unchanged."
