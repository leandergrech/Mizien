claim:
  text: 'Budget 2026 (27 Oct 2025): a large-scale land reclamation project will begin outside the Freeport
    perimeter, mainly for industrial, maritime and aviation use, relocating commercial activity so other
    spaces can be enjoyed by families. Earlier statements said an EUR 11 million seabed study identified
    five or six sites with the least environmental damage.'
