id: CC-017
title: Land reclamation outside the Freeport
category: Planning & Housing
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Budget 2026 (27 Oct 2025): a reclamation project is already under way in the Freeport; the government is
    preparing to launch a large-scale land reclamation project outside the Freeport perimeter next year, for industrial
    and maritime use and to relocate certain commercial activities so other spaces can be enjoyed by families. In
    2019 the Environment Minister said an EUR 11 million seabed study had found five or six sites that are ''possible
    and environmentally safe''.'
  speaker: Clyde Caruana, Minister for Finance (Budget Speech 2026); Robert Abela, Prime Minister
  date: '2025-10-27'
  wording_status: Verbatim found
  sources:
  - title: Budget Speech 2026
    publisher: Ministry for Finance
    date: 27 Oct 2025
    url: https://finance.gov.mt/wp-content/uploads/2025/11/Budget-Speech-2026.pdf
    note: The claim, pp. 52-53 (English). Read in a browser 3 Oct 2026.
  - title: Land reclamation decision informed by EUR 11 million seabed study
    publisher: MaltaToday
    date: Sep 2019
    url: https://www.maltatoday.com.mt/news/national/98630/land_reclamation_decision_informed_by_11_million_seabed_study
    note: 'Herrera: five or six sites ''possible and environmentally safe''.'
  - title: 'Budget 2026: Large-scale land reclamation project to begin outside Freeport perimeter'
    publisher: The Malta Independent
    date: 27 Oct 2025
    url: https://www.independent.com.mt/articles/2025-10-27/local-news/Budget-2026-Large-scale-land-reclamation-project-to-begin-outside-Freeport-perimeter-6736284318
    note: News report of the speech.
  quote: A reclamation project is already under way in the Freeport, and now it is time to take the next step. The
    Government is preparing to launch a large-scale land reclamation project outside the Freeport perimeter next
    year.
counter_evidence: 'Existing works confirmed: Sentinel-2 shows +3.7 ha (+/-1) at Terminal 2, 2023-2026 (stated ~30,000
  m2, ~1 Mt inert fill). No site, size, cost, fill source, screening or call for the large-scale project found by
  3 Oct 2026. Seabed study unpublished since 2019; budget lines EUR 500,000 (2023) -> 10,000 (2025). Three Natura
  2000 sites ~1 km from the Freeport incl. marine SPA MT0000111 (256 km2). Posidonia meadows -34% in 50 years (Telesca
  et al. 2015).'
tests: Sentinel-2 L2A (2017-2026); EEA Natura 2000 (2024); Budget Speech 2026; Freeport Corporation statements;
  seagrass literature.
why_low_hanging: 'Done: Claim Check 017 report and flyer.'
