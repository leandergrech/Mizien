    note: "Corrections. (1) The 2019 statement is quoted as said: “least environmental damage” (a paraphrase) → “possible and environmentally safe” (cover, TL;DR, sections 2, 3, 5, 6 and 7); sub-claim C now tests that wording. (2) Distance to Natura 2000: “about 1 km from the Freeport”, measured from an onshore point west of Terminal 2 → 0.4 km from the new land at Terminal 2 to the marine SPA MT0000111 and 0.5 km to the cliff sites (shortest distance to the EEA boundaries; data/cc-017/natura2000_distances.csv); tile “1 km” → “0.4 km”. (3) “Three Natura 2000 sites” → three designations, two of which (SAC MT0000024, SPA MT0000033) overlap on the same cliffs. (4) Flyer: right of reply now names the Finance and Environment ministries, as the report does; the −34% seagrass loss is labelled Mediterranean-wide. Verdict and confidence unchanged."
