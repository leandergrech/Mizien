id: CC-147
title: 'Climate Action Authority factsheet: intensity fell 19% excluding air and maritime transport'
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Climate Action Authority (Malta), factsheet ''An analysis of Malta''s GHG Emissions by Economic Activity'' (February
    2026, p. 5): when Malta''s GHG intensity is worked out excluding air and maritime transport, intensity per euro generated
    between 2024 and 2020 ''in fact reduced by 19%'' rather than increased as per Eurostat''s figures, which ''summed up''
    show a growth rate of 87.2%. (p. 3: aviation has a ''disporportionate statistical weighing'' on the final emission results.)'
  speaker: Climate Action Authority
  date: '2026-02-01'
  wording_status: Verbatim found
  sources:
  - title: 'FACTSHEET AEA: An analysis of Malta’s GHG Emissions by Economic Activity'
    publisher: Climate Action Authority (climateaction.gov.mt)
    date: 2026-02
    url: https://climateaction.gov.mt/wp-content/uploads/2026/02/FACTSHEET-AEA.pdf
    note: 'The claim (p. 5; aviation weight p. 3; residence principle p. 1). The Authority’s own address returns HTTP 403
      to scripts; read in full 2 Nov 2026 in the Internet Archive capture of 15 Apr 2026 (web.archive.org/web/20260415130840/...).
      PDF metadata: created 4 Feb 2026.'
  - title: Air emissions accounts by NACE (env_ac_ainah_r2), bridging table (env_ac_aibrid_r2), gross value added (nama_10_a64)
    publisher: Eurostat
    date: 2026-11-02 (retrieved)
    url: https://ec.europa.eu/eurostat/databrowser/
    note: Malta and EU-27; used to rebuild the 87.2% and the 19% (data/cc-147/).
  quote: Moreover, when the GHG intensity for Malta is worked out excluding air transport and maritime transport, one may
    note that GHG intensity per every euro generated between 2024 and 2020 in fact reduced by 19% rather than increased as
    per Eurostat’s figures which summed up show a growth rate of 87.2%.
counter_evidence: 'Eurostat''s all-activities series gives +86.2% for 2020-2024 (factsheet +87.2%); air transport is 68% of
  Malta''s 2024 residence-basis emissions (EU-27 4%). Excluding air and water transport gives -22.2% (air only -21.2%); territory-basis
  emissions per euro give -22.2%; the EU-27 all-activities measure fell 15.1%. The fall holds for start years 2017-2023 (-28%
  to -8%) but is smaller from later starts, and air transport''s value added was negative in the 2020 base year (-EUR 219
  million). The exact 19% could not be reproduced (the factsheet''s workings are not published); our 2024 emissions excluding
  air and water transport are 8.5 kt below the factsheet chart (data vintage). Removing aviation changes the measure rather
  than correcting it: the factsheet itself says the Eurostat accounts follow the residence principle.'
tests: 'Done: Eurostat env_ac_ainah_r2, env_ac_aibrid_r2, nama_10_a64 rebuilt in tools/cc-147-report/calc.py.'
why_low_hanging: 'Done: Claim Check 147 report and flyer.'
