caveats: No right of reply needed (verdict Largely supported; a reply is sought only for Not substantiated, Misleading or
  Contradicted). The 19% is the Authority's own calculation; our rebuild gives about -22%. Read in the Internet Archive capture
  of the PDF (15 Apr 2026), not at the Authority's own address (403). Eurostat 2024 values carry flag i. The factsheet's other
  figures (9.6% vs 190.9% on p. 5; +16.6% in 2013-2024 on p. 4) are not rated and were not reproduced.
