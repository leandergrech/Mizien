    text: "Eurostat’s published figures show growth of 87.2% in 2020–2024"
    finding: "We get +86.2% from Eurostat tables; the remaining point is plausibly data vintage or the Authority’s exact definition [2]."
    rating: "Largely supported"
    tone: lime
  - id: CC-147C
    text: "Excluding air and maritime transport, emissions per euro fell by 19% in 2020–2024"
    finding: "We get −22% (CLV subtraction) and −22% on a territorial basis; the fall holds for all start years 2017–2023 but is smaller from later starts; the exact 19% could not be reproduced and the 2020 base is unusual [2]."
    rating: "Largely supported"
    tone: lime
  - id: CC-147D
    text: "This is “in fact” the correct result “rather than” Eurostat’s"
    finding: "Framing: two measures, both valid, for different questions; the factsheet itself says so on page 1 [1]. Not rated separately."
    rating: "Not rated"
    tone: grey
