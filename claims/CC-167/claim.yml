id: CC-167
title: 'Ministry for Finance Economic Survey 2026: energy intensity ''declined considerably'' between 2019 and 2024'
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Ministry for Finance, Economic Survey (October 2026), chapter 2 overview, p. 34: ''While final energy consumption
    increased in 2024, energy intensity declined considerably between 2019 and 2024, indicating improved energy efficiency
    relative to economic activity.'' Section 2.6.3 (pp. 64-65): ''Between 2019 and 2024, the economy''s energy intensity declined
    by 27.1 per cent.'''
  speaker: Ministry for Finance
  date: '2026-10-26'
  wording_status: Verbatim found
  sources:
  - title: Economic Survey, October 2026
    publisher: Ministry for Finance, Malta
    date: '2026-10-26'
    url: https://finance.gov.mt/wp-content/uploads/2026/10/Economic-Survey-2026-Final.pdf
    note: The claim. finance.gov.mt refuses scripts; maintainer's copy (164 pp.) read 17 Nov 2026 (sha256 in archive/manifest.csv);
      p. 34 (PDF p. 48) and pp. 64-65.
  quote: While final energy consumption increased in 2024, energy intensity declined considerably between 2019 and 2024, indicating
    improved energy efficiency relative to economic activity.
counter_evidence: 'Eurostat nrg_ind_ei (energy intensity of GDP, chain-linked 2010 volumes): Malta 266.6 to 194.3 kgoe per
  thousand euro, 2019-2024, -27.1% exactly (EU-27 -15.9%). The indicator is gross available energy over GDP, and 69% of
  Malta''s gross available energy in 2024 was international marine bunkers (2,100 of 3,065 ktoe; nrg_bal_s), which fell 7%
  over the period. Excluding bunkers, gross inland consumption per GDP fell 16.6% and final energy per GDP 14.0% (current
  GDP vintage). Real GDP rose 28.4%, gross inland consumption 7.0%, final energy 10.4%, population 12.9%; final energy per
  person fell 2.2%.'
tests: Eurostat nrg_ind_ei, nrg_bal_s (GAE, bunkers, GIC, final consumption), nama_10_gdp (chain-linked volumes) and demo_gind
  for Malta, 2015-2024; intensity recomputed with and without bunkers.
why_low_hanging: Eurostat energy-balance and intensity series are open and the change is a ratio of two series.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: Eurostat API; the Survey from the maintainer''s copy.'
caveats: 'Largely supported: no right of reply needed. The 27.1% is Eurostat''s official indicator, used correctly; it includes
  fuel sold to international shipping, which inflates the fall for Malta. Provisional tag ''Selective metric'' dropped: the
  Survey itself notes that consumption rose. Related: CC-146, CC-147 (emissions intensity).'
right_of_reply:
  sent: null
  deadline: null
  response: null
evidence_shown:
  - Eurostat nrg_ind_ei, nrg_bal_s, nama_10_gdp, demo_gind for Malta 2015-2024 (data/cc-167/eurostat_malta_energy_gdp.csv; checks in data/cc-167/checks.csv)
