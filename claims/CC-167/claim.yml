claim:
  text: 'Ministry for Finance (Economic Survey 2026, published 26 Oct 2026): Malta''s energy intensity fell considerably between
    2019 and 2024, which points to better efficiency relative to economic activity, even though final energy consumption rose
    in 2024.'
  speaker: Ministry for Finance
  date: '2026-10-26'
  wording_status: 'Paraphrase: locate quote'
  sources:
  - title: Economic Survey 2026
    publisher: Ministry for Finance, Malta
    date: '2026-10-26'
    url: https://finance.gov.mt/wp-content/uploads/2026/10/Economic-Survey-2026-Final.pdf
    note: Locates the claim from a search summary only; the PDF returned 403 to WebFetch on 15 Nov 2026 and was not read.
      The exact sentence, table and definition of 'energy intensity' are unknown.
counter_evidence: Energy intensity (energy per unit of GDP) can fall because GDP grows faster than energy use, without any
  efficiency gain, as the survey itself seems to concede in noting that final consumption rose. A related dispute over emissions
  intensity is recorded in CC-146 (Central Bank) and CC-147 (Climate Action Authority) against Eurostat's rise of 87.2% for
  the same economy.
tests: Eurostat nrg_ind_ei (energy intensity of GDP) and nrg_bal_c / nrg_bal_s (final energy consumption) for Malta, 2019-2024,
  with chain-linked volumes; decompose the change into GDP growth and energy use; compare with the EU; compare with the emissions-intensity
  series used in CC-146/147.
why_low_hanging: Eurostat energy-balance and intensity series are open and the change is a ratio of two series.
