caveats: The claimant is an EU body's commissioned study, not a Maltese speaker; the opinions are the authors', not
  the European Parliament's official position. The verdict covers legal conformity only, not whether Malta is quiet.
  Transposition table, infringement register and the 21% vs 9% survey figure (via ERA 2023c, not opened) not
  independently verified; WHO and EEA figures are second-hand via the study. Right of reply not sent.
