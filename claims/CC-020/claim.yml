id: CC-020
title: 'EP study: noise law not the cause'
category: Noise
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Study for the European Parliament''s Committee on Petitions (Ecocentric Consulting, February 2026): Malta''s
    noise problems are not caused by how it transposed and implements the Environmental Noise Directive, with only
    two meaningful non-conformity issues, because the noise people complain about (construction, entertainment,
    neighbourhood) falls outside the Directive''s scope; it cites a 2019 survey in which 21% of Maltese ranked noise
    among their top four environmental issues against an EU28 average of 9%.'
  speaker: Peter Hjerp and Clare Coffey (Ecocentric Consulting), study for the European Parliament Committee on
    Petitions (PE 783.089)
  date: '2026-02'
  wording_status: Verbatim found
  sources:
  - title: Analysing Malta's implementation of Directive 2002/49/EC on the Assessment and Management of Environmental
      Noise (PE 783.089)
    publisher: European Parliament, Policy Department for Citizens, Equality and Culture
    date: '2026-02'
    url: https://doi.org/10.2861/6278624
    note: Primary text (read in full from the EU Publications Office PDF, 5 Oct 2026; maintainer-supplied copy also; key findings and conclusions read). Key findings of chapters 3 and 6 and the conclusions hold
      the claim; verbatim passages in literature/CC-020/primary-source.md.
  - title: Malta urged to address construction and entertainment noise
    publisher: MaltaToday
    date: '2026'
    url: https://www.maltatoday.com.mt/news/national/139887/malta_urged_to_address_construction_and_entertainment_noise
    note: News report of the study; locator only.
  - title: Malta noise fact sheet 2022
    publisher: European Environment Agency
    date: '2022'
    url: https://www.eea.europa.eu/en/analysis/maps-and-charts/malta-noise-fact-sheet-2022
    note: Exposure figures under the Environmental Noise Directive.
  quote: The transposition and implementation of the END evidently is not the cause of the noise problems in Malta.
counter_evidence: The conclusion follows from the study's evidence. The Directive sets only reporting thresholds (55 dB
  Lden and 50 dB Lnight, above the WHO 2018 levels of 53 and 45 dB for roads and 45 and 40 dB for aircraft) and excludes
  construction, entertainment and neighbourhood noise. Eurostat (ilc_mddw01) puts Malta first in the EU for reported
  street or neighbour noise, 31.3% against 18.1% in 2023, above the EU average in all 12 available years since 2010.
  Action-plan delays (plan due January 2025 unpublished at January 2026) are a genuine END implementation issue.
  Legal compliance is not the same as exposure below WHO levels. The transposition table, infringement record and
  the 21% vs 9% survey figure were not independently verified.
tests: Study text and transposition table; Eurostat ilc_mddw01 for Malta, EU-27 and all Member States; END thresholds
  against WHO 2018 levels as reported in the study; Crossref-verified WHO review literature.
why_low_hanging: 'Done: Claim Check 020 report and flyer.'
