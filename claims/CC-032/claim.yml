claim:
  text: "Government statement on the fifteen solar flowers at the Gozo Multi-Modal Hub, Ta' Xħajma (21 Oct 2025), assembled from three texts. Quoted (TVM News, Maltese; Lovin Malta's English, an article tagged 'Press Release'): Gozo Minister Clint Camilleri, 'With the installation of these first solar flowers in Europe, we are demonstrating how Gozo can be a model for sustainable innovation'; in the same statement he called it the first of its kind used in Malta and, by number at one site, the second in the world; and (TVM News, English) 'This energy will be used to supply electricity, electric buses which offer transport between Imġarr port and the Park & Ride facility.' The statement as published, not in quotation marks: 'the first installation of its kind in Europe' (Lovin Malta's text) or 'the first of its kind in Europe' (TVM News, indirect speech), the energy to 'directly offset' the electricity used to charge the Park and Ride bus fleet (Lovin Malta's text), up to 40% more energy than traditional panels, about EUR 850,000. The European Commission's project page repeats the claim in its own words ('They are the first of their kind in Europe.'); it is not rated, as the claim is the Government's."
  quote: With the installation of these first solar flowers in Europe, we are demonstrating how Gozo can be a model for sustainable
    innovation.
  speaker: Clint Camilleri, Minister for Gozo; Parliamentary Secretariat for Public Works
  date: '2025-10-21'
