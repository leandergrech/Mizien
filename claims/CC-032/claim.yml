caveats: "Draft verdict Contradicted (high confidence) on 'first in Europe'; the bus-charging claim is Not substantiated.\
  \ The capacity of the Gozo units is not published (2.5 kWp each assumed from the maker's current model); PVGIS output is\
  \ modelled, not metered; bus consumption figures are modelled for other buses and routes and read as abstracts. The\
  \ parliamentary answers are known only through Newsbook (second-hand). TED notice 742398-2024 is matched to this contract\
  \ by our identification. Pending right of reply (Ministry for Gozo and Planning; Public Works Department)."
