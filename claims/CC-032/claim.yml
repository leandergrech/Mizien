counter_evidence: "The fifteen units are SmartFlowers (manufacturer, 14 Nov 2025), an Austrian product. Dated records: two SmartFlowers newly installed at the Umwelt Arena, Spreitenbach, Switzerland (Moneycab, 19 May 2015; text credited to the arena); on sale in Spain from June 2015 (a product launch, not an installation: energynews.es, 3 Jun 2015); an electric-vehicle charging version presented in Spain in January 2016 (smartgridsinfo.es, aimed at public administrations and companies); in service at the ASFINAG Hinterbrühl motorway rest area in Austria by 7 Dec 2016 (MeinBezirk.at community post with an ASFINAG photo; IÖB project page); and at Vodafone in Newbury, UK (Newbury Today, Aug 2021). The maker calls Gozo's 'one of the largest installations in Europe', not the first. Bus charging: no capacity, metered output, bus consumption, hours or wiring published, so the share covered cannot be calculated; Parliament was told no feasibility study was made (Newsbook, 19 Jan 2026, second-hand). PVGIS models 85.1 MWh a year if each unit is 2.5 kWp (37.5 kWp, two-axis tracking), 36.5% more than fixed panels. Cost: PQ figure EUR 699,611.98 excl. VAT (second-hand); the award we identify as this contract, TED 742398-2024, EUR 718,830.07, is EUR 848,219 with 18% VAT."
tests: Manufacturer pages and dated records of earlier European installations; PVGIS 5.3 two-axis and fixed runs at the site;
  OSRM route length; GRDA and TED records of the Park and Ride shuttle; TED award notice 742398-2024; Council 11894/26 ADD
  1 (C1-I5); calculations in tools/cc-032-report/calc.py.
