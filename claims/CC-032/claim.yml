claim:
  text: "Government statement on the fifteen solar flowers at the Gozo Multi-Modal Hub, Ta' Xħajma (21 Oct 2025), assembled\
    \ from three texts. Quoted (TVM News, Maltese; Lovin Malta's English): Gozo Minister Clint Camilleri, 'With the installation\
    \ of these first solar flowers in Europe, we are demonstrating how Gozo can be a model for sustainable innovation'; in\
    \ the same statement he called it the first of its kind used in Malta and, by number at one site, the second in the world;\
    \ and (TVM News, English) 'This energy will be used to supply electricity, electric buses which offer transport between\
    \ Imġarr port and the Park & Ride facility.' The outlets' report of the statement, not quoted: 'the first of its kind\
    \ in Europe', the energy to 'directly offset' the electricity used to charge the Park and Ride bus fleet, up to 40% more\
    \ energy than traditional panels, about EUR 850,000. The European Commission's project page, in its own words: 'They are\
    \ the first of their kind in Europe.'"
  quote: With the installation of these first solar flowers in Europe, we are demonstrating how Gozo can be a model for sustainable
    innovation.
  speaker: Clint Camilleri, Minister for Gozo; Parliamentary Secretariat for Public Works
  date: '2025-10-21'
  wording_status: Verbatim found
