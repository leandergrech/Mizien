caveats: "Draft verdict Contradicted (high confidence) on 'first in Europe'; the bus-charging claim is Not substantiated. The capacity of the Gozo units is not published (2.5 kWp each is an assumption from the maker's current model); PVGIS output is modelled, not metered. The bus-consumption figures (modelled for other buses and routes, read as abstracts) are used only for a conditional order of magnitude in the report, not for any rating. The Spanish record of June 2015 is a product launch, not an installation. The parliamentary answers are known only through Newsbook (second-hand). TED notice 742398-2024 is matched to this contract by our identification. The European Commission's page repeats the Government's claim and is not rated. Pending right of reply (Ministry for Gozo and Planning; Public Works Department)."
