counter_evidence: "The fifteen units are SmartFlowers (manufacturer, 14 Nov 2025), an Austrian product; dated records show\
  \ SmartFlowers in Spain (Jun 2015, energynews.es), at the ASFINAG Hinterbrühl motorway rest area in Austria (in service\
  \ by 7 Dec 2016, MeinBezirk.at) and at Vodafone in Newbury, UK (Aug 2021, Newbury Today); the maker calls Gozo's 'one of\
  \ the largest installations in Europe', not the first. Bus charging: no capacity, metered output, bus consumption or wiring\
  \ published; Parliament was told no feasibility study was made (Newsbook, 19 Jan 2026, second-hand). PVGIS models 85.1\
  \ MWh a year for 37.5 kWp with two-axis tracking (if 2.5 kWp each), 36.5% more than fixed panels; that equals about 2.2-3.2\
  \ hours a day of the 10-minute shuttle at 1.45-2.1 kWh/km (modelled for other buses; indicative). Cost: PQ figure EUR\
  \ 699,611.98 excl. VAT (second-hand); likely TED award 742398-2024, EUR 718,830.07, is EUR 848,219 with 18% VAT."
tests: Manufacturer pages and dated records of earlier European installations; PVGIS 5.3 two-axis and fixed runs at the site;
  OSRM route length; GRDA and TED records of the Park and Ride shuttle; TED award notice 742398-2024; Council 11894/26 ADD
  1 (C1-I5); calculations in tools/cc-032-report/calc.py.
why_low_hanging: 'Done: Claim Check 032 report and flyer.'
