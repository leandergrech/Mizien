counter_evidence: 'Election held 30 May 2026; Labour won. Neither pledge defines its terms or gives a baseline.
  Our open-data analysis: 99.7-99.9% of residents already within ten minutes of any green or open space, but only
  55-68% of a public park of at least 0.5 ha. No Gozo emissions inventory; afforestation alone would need 1.5-8.5
  times Gozo''s area.'
tests: WorldPop 2025 + OpenStreetMap access analysis; Gozo carbon arithmetic with measured sequestration rates.
