claim:
  text: 'Labour manifesto 2026, priority 19: every person no more than ten minutes'' walk from an open or green
    space. (Until v1.1 this check also covered the PN''s net-zero Gozo pledge, now CC-107.)'
  speaker: Labour Party
  date: 2026-05
  wording_status: Verbatim found
  sources:
