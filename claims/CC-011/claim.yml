  quote: Kull persuna f'pajjiżna ma tkunx aktar minn għaxar minuti mixi 'l bogħod minn spazju miftuħ jew aħdar.
counter_evidence: 'Election held 30 May 2026; Labour won, so the pledge is now a government commitment. The manifesto
  defines neither "open or green space" nor a baseline or year. Our open-data analysis: 99.7-99.9% of residents already
  live within ten minutes of some green or open space, so read broadly the pledge is almost met; but only 55-68% live
  within a ten-minute walk of a public park of at least 0.5 ha (about 240,000 people outside), and 24% within 300 m of
  one (WHO Europe indicator).'
tests: WorldPop 2025 + OpenStreetMap access analysis (six definitions; 300, 615 and 800 m).
why_low_hanging: 'Done: Claim Check 011 report and flyer (v1.2: split; the PN Gozo pledge is now CC-107).'
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.2)
data_readiness: High
caveats: Draft pending right of reply (Partit Laburista / Government). Access analysis is a straight-line
  screening estimate. Manifesto translation is ours. The news summary narrowed the pledge to green space; the party's
  own text is assessed. Split on 5 Oct 2026; the PN's net-zero Gozo pledge is CC-107.
