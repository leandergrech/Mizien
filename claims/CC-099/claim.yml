claim:
  text: 'PwC Malta (press release on its Summer 2026 Economic Update, posted by Finance Malta on 17 Jul 2026; same text in
    The Malta Business Weekly on 19 Jul 2026): "foreign residents now make up 31% of Malta''s population", and population
    is expected to grow "with the mix of foreign to local residents potentially reaching around 38% by 2030". The two
    figures are in different paragraphs (2 and 6) of the same release; the 2030 figure comes from PwC''s own demographic
    model.'
  speaker: PwC Malta
  date: '2026-07-17'
  wording_status: Verbatim found
  sources:
