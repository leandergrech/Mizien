caveats: Right of reply on hold until PwC Malta's Summer 2026 Economic Update is read (then to PwC Malta); the report
  refused automated access (403, no Internet Archive capture) and may explain the 38%. The NSO's end-2025 figure is
  second-hand (nso.gov.mt 403); Eurostat's own data bound the share to 30.9–31.1%. The intake record's original link (Malta
  Business Weekly, 2 Jun 2025) is a different article that does not contain the claim; the wording is PwC's press release
  as published on 19 Jul 2026. The verdict rests on sub-claims A and B; C is context.
