      publisher: Finance Malta (Industry Update / PwC)
      date: 17 Jul 2026
      url: https://financemalta.org/industry-updates/malta-s-rapid-population-growth-creates-urgent-need-to-focus-on-the-country-s-infrastructure-demands-for-the-future
      note: The claim, in PwC Malta's press release (with PwC's boilerplate, "© 2026 PricewaterhouseCoopers"); the earliest copy
        found. Read in full on 6 Oct 2026. No definition of "foreign" and no source named for the 31%.
