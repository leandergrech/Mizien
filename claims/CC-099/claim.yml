caveats: Right of reply on hold until PwC Malta's Summer 2026 Economic Update is read (then to PwC Malta); the report refused
  automated access (403, no Internet Archive capture) and may explain the 38%. Confidence is low because the evidence on
  the 38% points both ways and the deciding document is unread. The NSO's end-2025 figure is second-hand (nso.gov.mt 403);
  the 30.9–31.1% for the end of 2025 is our calculation from Eurostat data, valid if 2025's change in Maltese citizens
  lay within the 2010–24 range, because Eurostat has not published the 2026 split. The Central Bank of Malta figures
  and the figures Business Now and Newsbook attribute to PwC's report are second-hand. The intake record's original link
  (Malta Business Weekly, 2 Jun 2025) is a different article that does not contain the claim; the wording is PwC's press
  release, posted by Finance Malta on 17 Jul 2026 (earliest copy found) and reprinted by the Malta Business Weekly on 19
  Jul 2026. The verdict rests on sub-claims A and B; C is context.
