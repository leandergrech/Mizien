claim:
  text: 'PwC Malta (press release on its Summer 2026 Economic Update, published by The Malta Business Weekly on 19 Jul 2026):
    "foreign residents now make up 31% of Malta''s population", and population is expected to grow "with the mix of foreign
    to local residents potentially reaching around 38% by 2030". The two figures are in different paragraphs of the same
    release; the 2030 figure comes from PwC''s own demographic model.'
  speaker: PwC Malta
  date: '2026-07-19'
  wording_status: Verbatim found
  sources:
    - title: Population growth drives urgent infrastructure needs – PwC Malta Summer 2026 Economic Update
      publisher: The Malta Business Weekly
      date: 19 Jul 2026
      url: https://maltabusinessweekly.com/population-growth-drives-urgent-infrastructure-needs-pwc-malta-summer-2026-economic-update/30680/
      note: The claim. PwC Malta's press release text, read in full on 6 Oct 2026 (HTML and WordPress API). No definition of
        "foreign" and no source named for the 31%.
    - title: Malta's rapid population growth creates urgent need to focus on the country's infrastructure demands for the future
      publisher: The Malta Chamber
      date: 22 Jul 2026
      url: https://maltachamber.org.mt/maltas-rapid-population-growth-creates-urgent-need-to-focus-on-the-countrys-infrastructure-demands-for-the-future/
      note: Same press release text. Read 6 Oct 2026. Mondaq carries it too (23 Jul 2026, author PwC).
    - title: Economic update summer edition 2026
      publisher: PwC Malta
      date: Jul 2026
      url: https://www.pwc.com/mt/en/publications/economic-outlook/economic-outlook-summer-2026.html
      note: Not read (403 to scripts; no Internet Archive capture). Holds the model behind the 38%; right of reply on hold
        until it is read.
    - title: Malta's population could reach 636,000 by 2030, PwC projects
      publisher: Business Now
      date: 15 Jul 2026
      url: https://businessnow.mt/maltas-population-could-reach-636000-by-2030-pwc-projects/
      note: Second-hand report of the PwC report (range 624,000–660,000; "around 38% in the base case").
    - title: 'World Population Day: 11 July 2026 (NR 120/2026)'
      publisher: National Statistics Office
      date: 9 Jul 2026
      url: https://nso.gov.mt/world-population-day-11-july-2026/
      note: Not read (403). Its end-2025 figures (31.1% non-Maltese citizens, 182,693) known second-hand via Newsbook (9 Jul
        2026) and Lovin Malta (11 Jul 2026).
    - title: Population on 1 January by age group, sex and citizenship (migr_pop1ctz)
      publisher: Eurostat
      date: updated 25 Sep 2026
      url: https://ec.europa.eu/eurostat/databrowser/product/page/MIGR_POP1CTZ
      note: Primary evidence. Retrieved 6 Oct 2026 with flags (none in 2010–2025). Latest split 1 Jan 2025.
    - title: Population change, demographic balance (demo_gind); EUROPOP2025 projections (proj_25np)
      publisher: Eurostat
      date: updated 30 Sep 2026; 11 Jun 2026
      url: https://ec.europa.eu/eurostat/databrowser/product/page/DEMO_GIND
      note: 588,254 on 1 Jan 2026. EUROPOP2025 has no citizenship split.
    - title: Foreign Nationals Employment Trends
      publisher: Jobsplus
      date: 2026
      url: https://jobsplus.gov.mt/labour-market-trends/foreign-nationals-employment-trends
      note: Workbooks retrieved 6 Oct 2026 (workforce measure, not residents).
    - title: 'The native Maltese population: projections and implications on the labour supply (Policy Note 1/2025)'
      publisher: Central Bank of Malta (Lynn Cumbo)
      date: 2025
      url: https://doi.org/10.2139/ssrn.5356748
      note: Abstract read via Crossref; full text refused (403).
    - title: "Malta's demographic shift: A growing foreign workforce"
      publisher: Malta Business Weekly
      date: 2 Jun 2025
      url: https://maltabusinessweekly.com/maltas-demographic-shift-a-growing-foreign-workforce/29055/
      note: The intake record's original link. A different article (Silvan Mifsud, on the CBM policy note) that does not
        contain the claim; read in full 6 Oct 2026.
  quote: The latest figures show that foreign residents now make up 31% of Malta’s population … Nonetheless, population is
    still expected to increase significantly, with the mix of foreign to local residents potentially reaching around 38%
    by 2030.
counter_evidence: Eurostat migr_pop1ctz gives 29.4% non-Maltese citizens on 1 Jan 2025 and, with 588,254 residents on
  1 Jan 2026 (demo_gind), a range of 30.9–31.1% for the end of 2025; the NSO's 31.1% (second-hand) agrees, so the 31% holds
  on citizenship. By country of birth 32.0% (1 Jan 2025); foreign nationals 39.8% of registered employment (Jobsplus, Dec
  2025). No official projection splits the population by citizenship (EUROPOP2025 gives totals only). 38% of PwC's 636,000
  needs Maltese citizens to fall by 1,832 a year to end-2030; they rose every year 2010–2024, and the remainder after
  migration and naturalisations fell by at most 1,441 a year (2021–2024).
tests: Eurostat migr_pop1ctz, migr_pop3ctb, demo_gind, cens_21ctz_r3, cens_21cob_r3, migr_imm1ctz, migr_emi1ctz, migr_acq,
  demo_faczc, demo_maczc and proj_25np (EUROPOP2025), with flags; Jobsplus employment workbooks; recomputed with
  tools/cc-099-report/calc.py.
why_low_hanging: 'Done: Claim Check 099 report and flyer.'
