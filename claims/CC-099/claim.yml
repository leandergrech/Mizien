  - id: CC-099A
    text: "“foreign residents now make up 31% of Malta’s population”"
    finding: "Eurostat-based range 30.9–31.1% of non-Maltese citizens on 1 January 2026; 29.4% a year earlier [10, 12]. The NSO’s 31.1% agrees ◆ [8]. By country of birth the share is higher (32.0% in 2025) [11]."
    rating: "Accurate"
    tone: green
  - id: CC-099B
    text: "“the mix of foreign to local residents potentially reaching around 38% by 2030”"
    finding: "PwC’s own model; no Eurostat or NSO projection by citizenship found [16, 20]. At PwC’s 636,000 it needs Maltese citizens to fall by 1,832 a year; they rose every year 2010–2024, and without naturalisations or migration fell by at most 1,441 a year [10, 14]. Report not readable [4]."
    rating: "Not substantiated"
    tone: orange
  - id: CC-099C
    text: "“Malta’s population reached 588,254 by year-end 2025 … approximately 14,000 residents (2.4%)” (context)"
    finding: "Eurostat: 588,254 on 1 January 2026; +14,004 (2.44%) in 2025 [12]."
    rating: "Accurate"
    tone: green
