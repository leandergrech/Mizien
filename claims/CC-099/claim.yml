  - id: CC-099A
    text: "“foreign residents now make up 31% of Malta’s population”"
    finding: "Our calculation from Eurostat data: 30.9–31.1% non-Maltese citizens on 1 January 2026 (if 2025’s change was within the 2010–24 range); 29.4% a year earlier [10, 12]. The NSO’s 31.1% agrees ◆ [8]. By country of birth the share is higher (32.0% in 2025) [11]."
    rating: "Accurate"
    tone: green
  - id: CC-099B
    text: "“the mix of foreign to local residents potentially reaching around 38% by 2030”"
    finding: "PwC’s own model; no Eurostat or NSO projection by citizenship found [16, 20]. On citizenship, 37.5–38.5% of 636,000 needs Maltese citizens to fall by at least 1,610 a year in 2026–30; recorded data show a rise every year 2010–2024 [10, 14]. Only a projection without future naturalisations, like the CBM’s ◆, gives such a fall. PwC states neither its definition nor this assumption; report not readable [4]."
    rating: "Not substantiated"
    tone: orange
  - id: CC-099C
    text: "“…Malta’s population reached 588,254 by year-end 2025 … approximately 14,000 residents (2.4%)” (context)"
    finding: "Eurostat: 588,254 on 1 January 2026; +14,004 (2.44%) in 2025 [12]."
    rating: "Accurate"
    tone: green
