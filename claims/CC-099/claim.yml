        350,000 by 2050; second-hand).
  quote: The latest figures show that foreign residents now make up 31% of Malta’s population … Nonetheless, population is
    still expected to increase significantly, with the mix of foreign to local residents potentially reaching around 38%
    by 2030.
counter_evidence: Eurostat migr_pop1ctz gives 29.4% non-Maltese citizens on 1 Jan 2025; with 588,254 residents on 1 Jan 2026
  (demo_gind), our calculation gives 30.9–31.1% for the end of 2025 if 2025's change in Maltese citizens lay within the
  2010–24 range (Eurostat has not published the 2026 split), and the NSO's 31.1% (second-hand) agrees, so the 31% holds on
  citizenship. By country of birth 32.0% (1 Jan 2025); foreign nationals 39.8% of registered employment (Jobsplus, Dec
  2025). No official projection splits the population by citizenship (EUROPOP2025 gives totals only). On citizenship,
  37.5–38.5% of PwC's 636,000 needs Maltese citizens to fall by at least 1,610 a year over 2026–30 (about 2,250 a year for
  exactly 38%); they rose every year 2010–2024, and the remainder after migration and naturalisations fell by at most
  1,441 a year (2021–2024). Only a projection that leaves out future naturalisations, as the Central Bank of Malta's
  baseline does (second-hand, about 2,040–2,230 a year to 2050), gives a fall of that size; the release does not say what
  PwC assumed.
tests: Eurostat migr_pop1ctz, migr_pop3ctb, demo_gind, cens_21ctz_r3, cens_21cob_r3, migr_imm1ctz, migr_emi1ctz, migr_acq,
  demo_faczc, demo_maczc and proj_25np (EUROPOP2025), with flags; Jobsplus employment workbooks; recomputed with
  tools/cc-099-report/calc.py.
