claim:
  text: 'Business Now (Robert Fenech, 17 Aug 2026): ''Maltese waters have suffered a downgrade from best in Europe to bang
    average''. The article reports that 86 of 87 registered beaches were rated excellent in 2016 against 77 in 2025, and that
    56 of 87 were excellent in week 13 of 2026.'
