verdict: Supported
verdict_confidence: High
claim:
  text: 'Malta also shows excellent records under the Bathing Water Directive: 92% of Maltese bathing waters are
    of excellent quality.'
  speaker: European Commission
  date: '2025'
  wording_status: Verbatim found
  sources:
  - title: 'Environmental Implementation Review 2025: Malta'
    publisher: European Commission
    date: '2025'
    url: https://op.europa.eu/webpub/env/eir-country-reports-summaries/en/malta.html
    note: Exact wording in Highlights. The page separately notes that urban wastewater is not being properly treated
      as required by EU law.
  - title: 'Bathing water quality in the season of 2025: Malta'
    publisher: European Environment Agency
    date: '2026'
    url: https://www.eea.europa.eu/en/topics/in-depth/bathing-water/state-of-bathing-water/bathing-water-country-factsheets-2025/mt-bathing-water-country-factsheet-2025.pdf/@@download/file
    note: 2022–2025 results; 77/87 excellent in 2025 and 80/87 in 2023 and 2024.
  - title: 'Bathing water quality in the season of 2024: Malta'
    publisher: European Environment Agency
    date: '2025'
    url: https://environmentalhealth.gov.mt/wp-content/uploads/2025/07/Malta_bathing_water_2024.pdf
