    note: "Corrections: (1) the ‘what would move the verdict’ boxes were reversed. ‘Up’ listed conditions that would lower the verdict, and ‘down’ cited a newer season at 92% or more. Now: up, none (Supported is the top of the scale; naming the 2023 season would remove the date caveat); down, a different 2023 count, a later intended season or an incompatible denominator. (2) Balluta Bay warning start: ‘31 May 2024’ → ‘late May 2024’. Our bibliography gave 21 May, and news reports date the two sites’ warnings ten days apart; the primary report could not be re-opened to settle it. (3) 2023 sample count: ‘—’ → 2,021 (EEA WISE dataset). (4) Page footer: ‘pending right of reply’ → ‘right of reply not sought’, matching the maintainer’s decision. Verdict and confidence unchanged."
