claim:
  text: 'Prime Minister Robert Abela (13 May 2026, on the signing of the deed ending MIDI''s concession): Manoel Island and
    Fort Tigné have been returned from MIDI to the public, and Manoel Island will become a national park.'
  speaker: Robert Abela, Prime Minister
  date: '2026-05-13'
  wording_status: Verbatim found
  sources:
  - title: 'Watch: Agreement over Manoel Island and Fort Tigné signed'
    publisher: Newsbook
    date: 13 May 2026
    url: https://newsbook.com.mt/en/agreement-over-manoel-island-and-fort-tigne-signed/
    note: Abela quoted in quotation marks on the national park. Read in full 9 Oct 2026.
  - title: Manoel Island and Fort Tigné agreement finalised to return sites to the public
    publisher: TVM News
    date: 13 May 2026
    url: https://tvmnews.mt/en/news/manoel-island-and-fort-tigne-agreement-finalised-to-return-sites-to-the-public/
    note: '"Historic moment" quoted; the rest is TVM''s text. Read in full 9 Oct 2026.'
  - title: Company announcement MDI222, Manoel Island and Fort Tigné
    publisher: MIDI p.l.c. (Malta Stock Exchange)
    date: 13 May 2026
    url: https://cdn.borzamalta.com.mt/download/announcements/MDI222.pdf
    note: 'Primary: public deed entered into, "resulting in the return thereof to Government". Announcements MDI214 (17 Mar) and MDI215 (20 Mar) read too.'
  - title: Manoel Island officially returned as public land
    publisher: MaltaToday
    date: '2026'
    url: https://www.maltatoday.com.mt/news/national/141742/manoel_island_officially_returned_as_public_land
    note: Locator only (403 to scripts).
  quote: We are transforming this area into a national park designed according to the wishes of the Maltese and Gozitan people.
    (Newsbook's report of Prime Minister Abela, 13 May 2026.)
counter_evidence: 'The return is documented by MIDI''s own announcement (13 May 2026) and reported parliamentary and shareholder
  approval; MIDI keeps the Tigné Point concession. Cost: MIDI gives EUR 47,321,000 gross, circa EUR 43 million net of VAT (Bonnici:
  EUR 43m, just over half of the EUR 78m asked). No Maltese Act searched (Cap. 549, 552, 445, 504, 573, 623) uses the term
  "national park"; no designation, management plan or local plan change found by 9 Oct 2026; no date given. On 16 Jul 2026 the
  Planning Authority sanctioned 20 padel courts and approved 10 more on the former Nicholl ground (Lovin Malta; decision not read).'
tests: MIDI announcements; statute texts on legislation.mt; deed and shareholder circular (not read); park plan and local plan (none found).
