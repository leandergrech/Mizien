claim:
  text: 'Nationalist Party MP Albert Buttigieg and MEP Peter Agius (petition to the European Parliament, reported 12 Oct 2024):
    Malta has failed to implement Directive 2002/49/EC, including noise mapping and national action plans, with only a draft
    Noise Action Plan 2019-2024 and no concrete implementation in St Julian''s, Sliema and Valletta.'
  speaker: Albert Buttigieg (PN MP) and Peter Agius (MEP, PN)
  date: '2024-10-12'
  wording_status: 'Paraphrase: locate quote'
  sources:
    - title: EU urged to pressure Malta over noise pollution
      publisher: Newsbook
      date: '2024-10-12'
      url: https://newsbook.com.mt/en/eu-urged-to-pressure-malta-over-noise-pollution/
      note: Locator for the petition. Read the petition text on the European Parliament Petitions portal.
    - title: Petition No 1150/2024 (EP portal summary)
      publisher: European Parliament, Committee on Petitions
      date: n/d
      url: https://www.europarl.europa.eu/petitions/en/petition/content/html?petitionNumber=1150/2024
      note: Secretariat's summary only; the petition text is not on the portal.
    - title: MEP Peter Agius calls on the European Commission to investigate the implementation of the Noise Pollution Directive
        in Malta
      publisher: EPP Group
      date: '2025-02-20'
      url: https://www.eppgroup.eu/what-we-do/with-eu-countries/malta/commission-investigation-on-noise-pollution-in-malta
      note: Agius quoted in general terms; the action-plan point is in the release's own words.
counter_evidence: CC-020 records a February 2026 study for the European Parliament's Petitions Committee that finds only two
  meaningful gaps in Malta's transposition of the noise law and places most complaints (construction, entertainment, neighbourhood
  noise) outside its scope. The petition is older than 60 days (Oct 2024); included because noise is the least-covered topic
  and the claim is testable against EU reporting.
tests: Directive 2002/49/EC Arts 7-8 and Malta's noise-mapping and action-plan submissions (EEA Noise Observation and Information
  Service / Reportnet); EP Petitions Committee study (2026); ERA Noise Action Plan documents.
why_low_hanging: Whether maps and plans were submitted and adopted is a matter of record.
