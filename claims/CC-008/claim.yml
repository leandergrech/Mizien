claim:
  text: Infrastructure Malta says the Msida Creek flyover will reduce delays, emissions and noise, and that the Marsa Junction Project has reduced travel time and air pollution.
  speaker: Infrastructure Malta
  date: '2024-10-28'
  wording_status: Verbatim found
  quote: >-
    Msida has long been a traffic bottleneck, with congestion impacting air quality, noise levels, and overall
    accessibility. A cornerstone of this project is the construction of a new flyover, which will be a critical
    move to reduce delays, emissions, and noise pollution.
