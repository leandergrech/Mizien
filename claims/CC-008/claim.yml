counter_evidence: The Msida Creek flyover only entered vehicle use in December 2025, and the wider project remained
  under construction in 2026. The public Marsa release does not link the surveys behind its percentage claims;
  there is no project-level before-and-after series here for traffic, ambient air pollution, or noise.
tests: Separate forecasts from measured outcomes for Msida and Marsa; inspect the planning baseline and public
  monitoring record; assess what induced-demand research can and cannot infer for these individual junctions.
why_low_hanging: Official wording and project dates are available; outcome data need to be requested or located.
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.0 draft)
data_readiness: Medium
caveats: The 79% travel-time and emissions reductions are Infrastructure Malta’s reported figures; their underlying
  survey design, time windows, calculation methods and raw results were not located. Msida traffic benefits remain
  provisional because the project was still being completed during the review period. No post-project noise dataset
  was found for either site. The induced-demand literature cited is from US urban road networks and is not a direct
  estimate for Malta.
right_of_reply:
  sent: null
  deadline: null
  response: null
evidence_shown:
  - >-
    Infrastructure Malta, 15 April 2021 completion release: published 79% travel-time, up-to-70% particulate-matter,
    52% NOx and 50% CO2 reduction claims for Marsa Junction; the release does not link the underlying surveys or data.
  - >-
    Infrastructure Malta, 28 October 2024 Msida Creek statement: future-tense claims to reduce delays, emissions and
    noise; the PM release of 17 December 2025 records the flyover's opening, with the wider project still in progress.
  - >-
    ERA planning record for PA/02053/20 and PA/06425/20, including the 2023 Project Description Statement, which
    records 2019 traffic counts and anticipated benefits, not post-opening outcomes.
