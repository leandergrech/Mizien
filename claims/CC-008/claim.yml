  response: null
evidence_shown:
- 'Infrastructure Malta, 15 April 2021 completion release: published 79% travel-time, up-to-70% particulate-matter,
  52% NOx and 50% CO2 reduction claims for Marsa Junction, and said that eliminating traffic-light waiting times
  "is resulting in significant air quality improvements in Paola and Marsa"; the release does not link the
  underlying surveys, monitoring or data.'
- 'Infrastructure Malta, 28 October 2024 Msida Creek statement (wording as on the live page, checked 5 October 2026):
  published before works began and with completion set for 2027, it presents the new flyover as "a critical move to
  reduce delays, emissions, and noise pollution", so the stated reductions were expected effects, not measured
  results; the PM release of 17 December 2025 records the flyover''s opening, with the wider project still in
  progress.'
- ERA planning record for PA/02053/20 and PA/06425/20, including the 2023 Project Description Statement, which records
  2019 traffic counts and anticipated benefits, not post-opening outcomes.
- 'EEA air-quality download service, hourly NO2 for Msida (MT00005 to 2023; MT00011 from 17 January 2024), Attard,
  Żejtun and St Paul''s Bay, retrieved 5 October 2026 (E1a validated to 2025; E2a unvalidated for 2026): monthly,
  annual and January–September means in data/cc-008/ (no2_monthly.csv, no2_annual.csv, no2_jan_sep.csv), shown in
  the report''s Figures 1 and 2. Msida January–September mean: 19.2 (2024), 22.0 (2025), 25.2 µg/m³ (2026).'
- 'ERA station metadata reported to the EEA (Air Quality e-Reporting dataset D, 2025, Eionet CDR): locations and
  classification of the Msida points and the closure of Kordin (Paola) in 2016 (data/cc-008/aq_stations.csv;
  Figure 3).'
