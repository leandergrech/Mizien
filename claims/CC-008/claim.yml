counter_evidence: 'The Msida Creek flyover opened to traffic on 18 December 2025, and the wider project remains under
  construction until 2027. At the only public air monitor near it (EEA sampling point MT00011, about 410 m away),
  mean NO2 for January–September 2026 was 25.2 µg/m³, against 22.0 in 2025 and 19.2 in 2024 (2026 data not yet
  validated); urban background stations rose about 4% and St Paul''s Bay fell 6%, so the expected improvement has
  not appeared in the measured data. The Marsa release does not link the surveys behind its percentage claims, and
  no EEA-reported air monitor has operated within 1.4 km of the Marsa junction since Kordin (Paola) closed at the
  end of 2016. No project-level before-and-after series was found for traffic or noise at either site.'
tests: Separate forecasts from measured outcomes for Msida and Marsa; inspect the planning baseline and public monitoring
  record; compare hourly EEA NO2 at the Msida monitor with background and traffic stations for January–September
  2024, 2025 and 2026 (before and after the flyover opened); locate the monitoring points from ERA's station
  metadata; assess what induced-demand research can and cannot infer for these individual junctions.
why_low_hanging: Official wording and project dates are available; outcome data need to be requested or located.
tags:
- Promise-without-baseline
tags_provisional: false
priority: Done (v1.2)
data_readiness: Medium
caveats: The 79% travel-time and emissions reductions are Infrastructure Malta’s reported figures; their underlying
  survey design, time windows, calculation methods and raw results were not located. The Msida NO2 comparison rests
  on one monitor about 410 m from the flyover, a sampling point that replaced the old one (about 300 m west) in
  January 2024, unvalidated 2026 data, and no adjustment for weather or traffic; works continue until 2027, so it
  does not show that the flyover raised pollution. No post-project noise dataset was found for either site. The
  induced-demand literature cited is from US urban road networks and is not a direct estimate for Malta.
right_of_reply:
  sent: null
