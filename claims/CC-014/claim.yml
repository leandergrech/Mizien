claim:
  text: 'Planning Authority CEO Johann Buttigieg (Malta Independent, 7 Sep 2025): the PA once issued over 1,000
    enforcement notices a year and now about 200, which he attributed to fewer illegalities; over 5,000 cases await
    direct action and 1,500 illegalities were removed by direct action in 30 years.'
  speaker: Johann Buttigieg, Planning Authority CEO
  date: '2025-09-07'
  wording_status: Verbatim found
  sources:
  - title: CEO will not say PA failed in enforcement duties, but admits it has struggled
    publisher: The Malta Independent
    date: 7 Sep 2025
    url: https://www.independent.com.mt/articles/2025-09-07/local-news/CEO-will-not-say-PA-failed-in-enforcement-duties-but-admits-it-has-struggled-6736272936
    note: The claim. Read in full 3 Oct 2026. The 'around 200' and 'fewer illegalities' parts are the newspaper's
      paraphrase; the 1,000 figure and the 'people have recognised' sentence are direct quotes.
  - title: Planning Authority Annual Report 2024
    publisher: Planning Authority
    date: 2025
    url: https://www.parlament.mt/media/134019/pa-annual-report-2024.pdf
    note: 'Primary evidence: Compliance Enforcement Directorate, pp. 28-30.'
  - title: MEPA Annual Reports 2004, 2005, 2006, 2007, 2009, 2010, 2011
    publisher: Malta Environment and Planning Authority
    date: 2004-2011
    url: https://era.org.mt/wp-content/uploads/2019/05/MEPA-Annual-Report-2004.pdf
    note: 'Primary evidence: notices issued 2001-2011 and complaints; all URLs in literature/CC-014/references.bib.'
  - title: Planning Authority Annual Reports 2017-2023 (Compliance and Enforcement Directorate)
    publisher: Planning Authority
    date: 2018-2025
    url: https://issuu.com/planningauthority
    note: 'Primary evidence for 2017-2023 notices, complaints, confirmed shares and outcomes; read 5 Oct 2026 as Issuu
      page images (2017 pp. 18-20; 2018 pp. 20-24; 2019 pp. 17-18; 2020 pp. 27-29; 2021 pp. 28-29; 2022 pp. 23-24;
      2023 pp. 23-24). Every value with page, image URL and SHA-256 in data/cc-014/pa_annual_reports_2017_2023.csv;
      Issuu links for each year in literature/CC-014/references.bib.'
  - title: Buttigieg stops short of direct action against Carlo Stivala's new illegal structure
    publisher: The Shift News
    date: 2 Oct 2026
    url: https://theshiftnews.com/2026/10/02/buttigieg-stops-short-of-direct-action-against-carlo-stivalas-new-illegal-structure/
    note: Lead only (current enforcement controversy; not read in full). Context, not the claim.
  quote: We had times when we issued over 1,000 enforcement notices per year.
counter_evidence: 'Notices fell 82% (1,033 a year in 2001-2009 to 187 in 2020-2024; PA annual reports give 164-233 a year
  in 2018-2024) while complaints of illegal development fell 11% since 2009 (2,701 to 2,411) and 35% since 2004/05, and
  averaged about 2,860 a year in 2017-2024, more than in 2009 or 2011 (2,105). Complaints confirmed as illegal development
  were about 1,280 in 2018 and about 1,200-1,250 in 2024; the fall of about a third since 2020 is measured from a
  2020-21 peak (~1,820-1,880). Notices per 100 complaints fell from 29-41 (2005-2011) to 5-10 (2017-2024), and only
  7-13 in every 100 confirmed cases ended in a notice in 2018-2024: most ended in a sanctioning application (497-818 a
  year) or removal by the owner. The PA''s own reports explain the low number of notices as its strategy "to issue
  notices only where contraveners are uncooperative" (2018 p. 20; 2019 p. 18).'
tests: MEPA annual reports 2004-2011; PA annual reports 2017-2023 (Issuu page images) and 2024; one news report of PA
  data (pending notices, end 2021); regulatory enforcement literature (context).
why_low_hanging: 'Done: Claim Check 014 report and flyer.'
