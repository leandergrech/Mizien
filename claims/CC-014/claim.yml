caveats: Draft pending right of reply (Planning Authority). Figures accurate; verdict rests on the omitted change
  in how cases are handled. Complaints are a proxy for illegal building; 2008 and 2012-2018 missing; 2019-2023 figures
  second-hand. Confirmed cases did fall about a third between 2020 and 2024.
