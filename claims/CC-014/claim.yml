    correction: true   # this version corrects errors in an earlier one
    note: "Corrections: (1) 2020 complaints were called “the highest in the series”; now “the highest we could read after FY 2004/05 (3,705)”. (2) “More than three times as many” cases ending in a sanctioning application or removal as in a notice → “about six times” ((521 + 482) / 162 = 6.2). (3) 2019 complaints 3,174 (derived from a news report) → 3,134 (PA Annual Report 2019, p. 17; Figure 1 redrawn) [17]. (4) 2024 confirmed cases ~1,200 → ~1,200–1,250 and the 2020–24 change −34% → −31% to −34%, because the four outcome categories sum to 1,252, more than the “circa half” (1,206) reported. Flyer: “Settled by legalising” → “Applications to legalise” (applications, not permits). Verdict and confidence unchanged."
