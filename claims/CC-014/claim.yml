    note: "Corrections: (1) 2020 complaints were called “the highest in the series”; now “the highest we could read after FY 2004/05 (3,705)”. (2) “More than three times as many” cases ending in a sanctioning application or removal as in a notice → “about six times” ((521 + 482) / 162 = 6.2). (3) 2019 complaints 3,174 (derived from a news report) → 3,134 (PA Annual Report 2019, p. 17; Figure 1 redrawn) [17]. (4) 2024 confirmed cases ~1,200 → ~1,200–1,250 and the 2020–24 change −34% → −31% to −34%, because the four outcome categories sum to 1,252, more than the “circa half” (1,206) reported. Flyer: “Settled by legalising” → “Applications to legalise” (applications, not permits). Verdict and confidence unchanged."
  - date: 2026-10-05
    step: version
    version: "1.2"
    note: "Upgrade: Planning Authority annual reports 2017–2023 read as Issuu page images and used as the primary series in place of news reports [10–16]; each value recorded with printed page, image URL and SHA-256. (1) Added 2017 (315 notices; about 3,000 complaints) and 2018 (219; 2,560); gap 2008 and 2012–2018 → 2008 and 2012–2016. (2) 2019 notices 228 (derived) → 229 [12, p. 18]; 2023 complaints 2,456 → 2,463 (2,456 is complaints closed) [16, p. 23]; 2020–2023 notices (169, 164, 180, 233) and 2020 complaints (3,313) confirmed; 2021 (3,192) and 2022 (2,804) complaints added. (3) Notices per 100 complaints 29–42 (2005–11) and 5–10 (2019–24) → 29–41 (rounding) and 5–10 (2017–24). (4) New: confirmed cases 2018–2024 with outcomes (Figure 2): ~1,280 in 2018 against ~1,200–1,250 in 2024, so the −31% to −34% since 2020 is now described as from a 2020–21 peak (−31% to −36%); 7–13 notices per 100 confirmed cases. New Figure 3 (notices per 100 complaints); Figure 1 redrawn; the 2024-only outcome chart is now part of Figure 2. (5) Added the Authority’s stated policy (notices “only where contraveners are uncooperative”, 2018 p. 20, 2019 p. 18) and a deterrence note (daily fines since 2012 [16, p. 24]; on 50% → 78% of notices, 2018 → 2023). (6) Sub-claim D now uses primary backlog and direct-action figures (73 → about 75 years); E partly tested (27–135 a year, 2017–2020). (7) The “139 more complaints in 2020” is in the Authority’s own 2020 report, not only in the news report. MaltaToday (2021, 2024) references replaced by the primary reports; references renumbered. Verdict and confidence unchanged."
