priority: Done (v1.2)
data_readiness: Medium
caveats: Draft pending right of reply (Planning Authority). Figures accurate; verdict rests on the omitted change
  in how cases are handled. Complaints are a proxy for illegal building and their definition shifts (construction-site
  complaints separate in 2018, third-party-damage complaints included in 2019, anonymous reports stopped in 2024);
  confirmed cases are approximate (stated share x complaints received; the PA's bases differ and outcomes do not always
  add up). 2008 and 2012-2016 are missing, and notices halved between 2011 and 2017. Daily fines (since 2012) now apply
  to most notices, which may deter. v1.2 (5 Oct 2026) replaced second-hand 2019-2023 figures with the PA reports and
  added 2017-2018; verdict unchanged.
