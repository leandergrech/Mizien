counter_evidence: The latest published River Basin Management Plan classifies both Malta and Gozo Mean Sea Level
  aquifer systems in poor quantitative status and 14 groundwater bodies in poor chemical status. Malta's reporting
  of the same cycle to the EEA lists four bodies in poor quantitative status (adding Pwales Coastal and Marfa
  Coastal) and all 15 in poor chemical status. The plan reports nitrate above the 50 mg/L standard in 12 of 15
  bodies, with three named exceptions; not every body fails for nitrate.
  WSC's potable-production figures cover its supply system and do not establish a national all-user abstraction
  total.
tests: Recalculate RO shares and groundwater-production changes from WSC annual-report data; compare the WSC series
  with the regulator's separate groundwater-body quantity and chemistry assessments; distinguish a tendered plant
  from commissioned capacity and measured aquifer recovery.
why_low_hanging: A rising desalinated-water share can reduce WSC's groundwater production, but it is not by itself
  proof that groundwater bodies have returned to good quantitative or chemical status.
tags:
- Selective metric
tags_provisional: false
priority: Done (v1.1)
data_readiness: High
caveats: WSC's 2025 annual report states that groundwater extraction fell 11.4% from 2024, while the annual-report
  chart values transcribed for 2024 and 2025 imply an 11.9% decline; the discrepancy is retained. WSC production
  is not a complete national groundwater-abstraction series. The 3rd RBMP assessment period is older than the 2025
  production figures, and a tender does not establish future operation or aquifer recovery. The plan's
  groundwater-body counts as recorded (Malta and Gozo Mean Sea Level poor quantitatively; 14 poor chemically)
  differ from Malta's 3rd-cycle EU reporting (4 and 15); the plan could not be re-opened to reconcile them, so the
  report shows both. "Lowest in a decade" is WSC's statement; the repo series covers 2022–2025 only.
right_of_reply:
  sent: null
  deadline: null
  response: null
evidence_shown: 'WSC''s 2025 Annual Report reports 70.7% RO share and 11.5 million m³ of groundwater production;
  its series shows the groundwater component declined by 8.95% from 2022 to 2025. The report''s chart implies an
  11.86% 2024–2025 decline, versus 11.4% in its narrative. The 3rd RBMP reports two main aquifers in poor quantitative
  status, 14 of 15 bodies in poor chemical status, and nitrate above the standard in 12 of 15; Malta''s 3rd-cycle
  EU reporting to the EEA lists 4 of 15 bodies poor quantitatively and 15 of 15 poor chemically. WSC''s August 2026
  tender notice specifies a planned 30,000 m³/day plant, with bids due 30 October 2026.

  '
