claim:
  text: WSC reported that reverse osmosis supplied 70.7% of its potable-water production in 2025, while groundwater
    production fell to 11.5 million m³, its lowest annual total in a decade. In August 2026, WSC issued a tender
    for a new 30,000 m³/day reverse-osmosis plant at Għar Lapsi.
