id: CC-131
title: 'EU: Malta recovers 100% of construction waste'
category: Waste
subtopic: Construction waste
status: Drafted
verdict: Largely supported
verdict_confidence: High
claim:
  text: 'European Commission (2026 Country Report for Malta, Annex 8, 3 Jun 2026): ''By contrast, the rate of recovery of
    construction and demolition waste is 100, above the EU average of 89%.'', citing a 2024 Joint Research Centre assessment;
    the sentence follows Malta''s low municipal and plastic packaging recycling rates.'
  speaker: European Commission
  date: '2026-06-03'
  wording_status: Verbatim found
  sources:
  - title: 2026 Country Report - Malta (Commission staff working document SWD(2026) 218 final), Annex 8 (industry decarbonisation,
      circularity and climate)
    publisher: European Commission (transmitted to the Council, 8 Jun 2026)
    date: '2026-06-03'
    url: https://data.consilium.europa.eu/doc/document/ST-10135-2026-ADD-1/en/pdf
    note: The claim, PDF p. 76 (printed p. 74), footnote 152; Table A8.1 on PDF p. 79 (Malta 100 in 2018 and 2020, EU 88 and
      89). The page image shows '100' without a percent sign; Table A8.1 and the cited JRC Table 10 ('in %') confirm a percentage.
      Read in full 25-26 Oct 2026 (same file as the Wayback copy of 5 Oct 2026).
  - title: Techno-economic and environmental assessment of construction and demolition waste management in the European Union
      (JRC135470, EUR 31784 EN)
    publisher: European Commission, Joint Research Centre
    date: '2024'
    url: https://doi.org/10.2760/721895
    note: The source cited in footnote 152. Section 4.5 and Table 10 (pp. 41-43) give 100% for Malta and 89% for the EU in 2020
      from Eurostat env_wastrt. Read in full; CC BY 4.0.
  - title: Treatment of waste by waste category, hazardousness and waste management operations (env_wastrt)
    publisher: Eurostat
    date: updated 23 Sep 2025
    url: https://ec.europa.eu/eurostat/databrowser/view/env_wastrt
    note: Primary data, retrieved 26 Oct 2026 (data/cc-131/).
  - title: Construction and Demolition Waste management in Malta, V2 (screening factsheet)
    publisher: Deloitte and BIO by Deloitte for the European Commission
    date: 2015-09
    url: https://ec.europa.eu/environment/pdf/waste/studies/deliverables/CDW_Malta_Factsheet_Final.pdf
    note: Records the reclassification of deposits in spent quarries from landfill to backfilling (pp. 4-5). Read in full.
  quote: By contrast, the rate of recovery of construction and demolition waste is 100, above the EU average of 89%.
counter_evidence: "Eurostat env_wastrt (retrieved 26 Oct 2026), non-hazardous mineral C&D waste: Malta recovered 99.9996% in 2020 (12 t of 2.95 Mt not recovered) and 99.9998% in 2022 (estimated). EU-27 90.9% (2020) and 91.4% (2022); the 89% is the JRC's 2020 value from an earlier release (France since revised 74 to 81.7). The rate counts backfilling (WFD Art. 11(2)(b)): in 2020 Malta's total was 41.8% recycling and 58.2% backfilling (EU 78.7% and 12.2%); recycling alone ranked 21st of 27 (18th of 26 in 2022, 67.3%). Malta reported 84.1% landfill in 2010; the Commission's 2015 factsheet records that quarry deposits were then reclassified from landfill to backfilling. NSO's 2024 release reports backfilling up 58.0% and recycling down 13.6% (second-hand, read via WebFetch)."
tests: Eurostat env_wastrt and env_wasgen (W121, W126), all Member States, 2010-2022 (tools/cc-131-report/calc.py, data/cc-131/);
  JRC 2024 Table 10; WFD Art. 11(2)(b), Decision 2011/753/EU, Directive 2018/851 Art. 3(17a); Commission factsheet 2015.
why_low_hanging: 'Done: Claim Check 131 report and flyer.'
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: the Council register, the JRC report and Eurostat are reachable; NSO and ERA are 403 to scripts.'
caveats: "Largely supported: no right of reply needed. The figure is a percentage although the report prints '100'; the EU value (89%) is from an earlier Eurostat release (now 90.9% for 2020). The rate is the legal 'recovery' measure and counts backfilling, 58% of Malta's total in 2020; the sentence, set against recycling rates, does not say so. Malta's rate rose from 16% (2010) to 100% when quarry deposits were reclassified as backfilling. No regulator finding on whether the deposits meet the 2018 backfilling definition was found. NSO 2024 figures are second-hand (release text via WebFetch; tables 403). The intake record placed the sentence in Annex 10; it is in Annex 8. The provisional tag Selective metric was dropped: the Commission cites the regulator-relevant metric."
