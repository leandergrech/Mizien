id: CC-148
title: 'Eurostat: Malta had the sharpest drop in greenhouse-gas emissions in Q1 2025'
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  quote: '“The largest reductions in greenhouse gases were estimated for Malta (-6.2%), Finland (-4.4%) and Denmark (-4.3%).”'
  text: 'Eurostat (quarterly greenhouse-gas emissions release, reported by MaltaDaily on 19 Aug 2025): in the first quarter
    of 2025 Malta''s emissions fell 6.2% on the same quarter of 2024, the largest fall among Member States, while EU emissions
    rose 3.4% to 900 million tonnes of CO2-equivalent; emissions rose in 20 Member States and fell in seven.'
  speaker: Eurostat
  date: '2025-08-19'
  wording_status: Verbatim found
  sources:
  - title: 'EU economy greenhouse gas emissions: +3.4% in Q1 2025'
    publisher: Eurostat
    date: 14 Aug 2025
    url: https://ec.europa.eu/eurostat/web/products-eurostat-news/w/ddn-20250814-1
    note: The primary wording; read in full 2 Nov 2026. Malta (-6.2%), Finland (-4.4%), Denmark (-4.3%); EU 900 Mt, +3.4%; 20 up, 7 down.
  - title: Air emissions accounts for greenhouse gases by NACE Rev. 2 activity, quarterly (env_ac_aigg_q)
    publisher: Eurostat
    date: updated 14 Aug 2026
    url: https://ec.europa.eu/eurostat/databrowser/view/env_ac_aigg_q
    note: 'Primary evidence; downloaded 2 Nov 2026 (data/cc-148/q_all_nsa.json). Current vintage: Malta -5.0%, Finland -10.1%.'
  - title: Malta tops EU greenhouse gas emission reductions, charts in first quarter of 2025
    publisher: MaltaDaily
    date: '2025-08-19'
    url: https://maltadaily.mt/articles/malta-tops-eu-greenhouse-gas-emission-reductions-charts-in-first-quarter-of-2025
    note: Locates the claim; figures read in full on 1 Nov 2026. The article
      also records Minister Miriam Dalli commenting.
counter_evidence: 'In the current Eurostat dataset (updated 14 Aug 2026) Malta''s Q1 2025 fall is 5.0% and second to Finland''s 10.1%; the EU rise is 4.2% (903.7 Mt). Summing four quarters, Malta''s 2025 emissions were 1.0% above 2024 and Q1 2026 is 4.2% above Q1 2025. The Q1 2025 level is 87% above Q1 2023 in this series (cause not investigated).'
tests: Eurostat quarterly air emissions accounts (dataset to confirm, env_ac_aigg_q); annual env_ac_ainah_r2 for 2024 and,
  when published, 2025; Malta electricity generation by fuel and tourist numbers Q1 2024 vs Q1 2025 (NSO, Eurostat nrg_cb_pem);
  the later revision of the Q1 2025 figure.
why_low_hanging: A single dataset gives the answer; tests whether a quarter says anything about the trend.
