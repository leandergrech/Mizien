    – sit uniku u meqjus bħala wirt kulturali dinji mill-UNESCO. (ADPD statement, adpd.mt, 2 May 2026; in Maltese, our translation:
    it was not enough to approve the construction of apartments and garages in the buffer zone around the Ġgantija, a unique
    site considered world cultural heritage by UNESCO.)'
counter_evidence: 'Newsbook (30 Apr 2026): board voted 10 to 1 for 22 apartments and 20 garages (PA/00570/21). The Authority
  revoked the 2023 permit on 7 Mar 2024 after incorrect buffer-zone information (as reported by Newsbook, second-hand). Heritage
  impact assessment: no negative effect on integrity; the Superintendence withdrew objections; NGOs and Momentum call it contradictory
  (outlet reports). Management plan 2012-17, Figure 2: the buffer zone reaches 127-477 m from the temple edge in eight directions
  (our map measurement); reported plot distance 150-157 m.'
tests: Planning Authority case file PA/00570/21 and decision notice (not read); heritage impact assessment (not read); management
  plan 2012-17 Figure 2 (measured); UNESCO comment (none found).
