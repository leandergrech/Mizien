caveats: 'Facts rated (Largely supported, moderate): approval on 30 Apr 2026 and the site in the buffer zone; "sacrilege"
  is an opinion and not rated. ADPD''s statement is in Maltese (our translation); its "yesterday" is a one- to two-day slip
  against the 30 Apr vote. The Planning Authority''s case file, the heritage impact assessment, the permit and any UNESCO
  comment on the final design were not read; the Authority''s 2023 and 2024 statements are read through TVM News and Newsbook
  (second-hand). The plot was not placed on the plan''s map by us (the 2012-17 management plan was read; the Shift cites a
  2015 plan). Fort Chambray, named in the same statement, is CC-066. No right of reply needed.'
