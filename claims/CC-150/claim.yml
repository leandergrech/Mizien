id: CC-150
title: 'Environment Minister: 412 million kg of waste diverted from landfill in five years'
category: Waste
subtopic: Landfill & treatment
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Miriam Dalli, Minister for the Environment, Energy and Public Cleanliness (press release PR260072EN, 19 Jan 2026,
    press conference at the ECOHIVE complex with WasteServ): ''Thanks to improved waste separation by both the public and
    businesses, we have diverted roughly 412 million kilogrammes of waste away from landfill over the past five years through
    increased organic and packaging waste separation.'' The Labour Party repeated the figure on 21 Jan 2026 (The Malta Independent,
    not in quotation marks): Malta ''has succeeded in diverting around 412 million kilograms of waste away from landfills''.'
  speaker: Miriam Dalli, Environment Minister
  date: '2026-01-19'
  wording_status: Verbatim found
  sources:
  - title: Malta records strong progress in waste separation (PR260072EN)
    publisher: Ministry for the Environment, Energy and Public Cleanliness (Department of Information)
    date: '2026-01-19'
    url: https://departmentofinformation.gov.mt/press-release/2026/pr260072en
    note: The Minister's own words in quotation marks. Read in full in a browser on 17 Nov 2026 (the site refuses scripts).
  - title: PL says Government is delivering a historic transformation in waste management
    publisher: The Malta Independent
    date: '2026-01-21'
    url: https://www.independent.com.mt/articles/2026-01-21/local/PL-says-Government-is-delivering-a-historic-transformation-in-waste-management-6736286533
    note: The Labour Party's restatement (outlet's report, no quotation marks). Maintainer's browser copy, read in full.
  quote: we have diverted roughly 412 million kilogrammes of waste away from landfill over the past five years through increased
    organic and packaging waste separation
counter_evidence: 'NSO Municipal Waste: 2024 (NR 225/2025), 2020-2024: separately collected paper, metals, glass, mixed packaging
  and organic waste 424 thousand tonnes (gross, before rejects); recycled, recovered or reused 270 thousand tonnes; generated
  minus landfilled 346 thousand tonnes; landfill below the 2019 peak, summed, 286 thousand tonnes. Separate collection was
  about 90 thousand tonnes in 2019 and 95 thousand in 2024 (+6%), so an increase in separation cannot account for 412. Landfilled
  municipal waste fell from 321 thousand tonnes (2019) to 255 thousand (2024). Consistent with the release: black-bag waste
  from local councils 140.7 thousand tonnes (2018) to 91.6 thousand (2024); organic collection 29.5 thousand tonnes in 2024,
  the series high. No method for 412 was published; 2025 not yet in NSO data.'
tests: NSO municipal waste generation, collection and treatment tables 2019-2024; four readings of 'diverted' (separately
  collected; recycled or recovered; generated minus landfilled; landfill below 2019).
why_low_hanging: Annual landfill tonnage is published; a cumulative figure can be tested against it.
tags:
- Input-as-outcome
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium: NSO tables read in a browser (403 to scripts); WasteServ method unpublished.'
caveats: 'Not substantiated: a draft pending right of reply to the Ministry (prototype phase; not sent). The figure is close
  to gross separate collection, which includes rejects later landfilled; it is presented as waste kept out of landfill because
  of increased separation. Five years taken as 2020-2024 (latest published); the Minister''s probably end in 2025. The ''strong
  progress'' headline of the same release is CC-004.'
