data_readiness: 'Medium: NSO/WasteServ tables partly browser-only; Eurostat reachable.'
caveats: 'Candidate from weekly intake 1 Nov 2026. The claimant is the governing party, not the Ministry: look for the party''s
  release and any ministry figure it relies on. Figure unverified beyond a search summary.'
