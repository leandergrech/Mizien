id: CC-127
title: 'EU: Malta has the lowest organic share in the EU'
category: Land & Trees
subtopic: Land take & agriculture
status: Drafted
verdict: Supported
verdict_confidence: High
claim:
  text: 'European Commission, Staff Working Document SWD(2026) 702 final, Malta, assessing the third river basin management
    plans and second flood risk management plans (transmitted 2 Oct 2026): ''Malta has the lowest proportion of organic farming
    in the EU''; of Malta''s 10,700 hectares of agricultural area (34% of the land area), ''only 66 hectares (less than 1%)
    of this agricultural area was managed organically in 2022, well below the EU average''.'
  speaker: European Commission
  date: '2026-10-02'
  wording_status: Verbatim found
  sources:
  - title: 'Commission Staff Working Document: Third River Basin Management Plans, Second Flood Hazard and Risk Maps and Second
      Flood Risk Management Plans, Member State: Malta, SWD(2026) 702'
    publisher: European Commission (copy on the Austrian Parliament website)
    date: '2026-10-02'
    url: https://www.parlament.gv.at/dokument/XXVIII/EU/94981/imfname_11680004.pdf
    note: The claim. Full text read on 18 Oct 2026 via the Austrian Parliament's copy of the Commission document (section
      1 and section 3 on pressures). The Commission's own copy was not located.
  quote: Malta has the lowest proportion of organic farming in the EU.
counter_evidence: "Eurostat (sdg_02_40, org_cropar, retrieved 21 Oct 2026) agrees: Malta 0.62% of farmland organic in 2022 (66 ha: 65 fully converted, 1 in conversion), lowest in every year 2012-2024 (next lowest Bulgaria/Ireland 2.2% in 2022). Austria (from 2021) and Greece (from 2022) are missing from the latest release but were 25.7% (2020) and 12.2% (2021). EU-27 average 9.1% in 2020 (estimate; no later aggregate). The 10,700 ha denominator is unsourced in the document; farm-structure surveys give 9,800 ha (2020) and 8,880 ha (2023); the share stays below 1% on each."
tests: Eurostat org_cropar / org_cropar_h (organic area and share of utilised agricultural area, Malta against all Member
  States, 2022 and latest); Eurostat ef_m_farmleg or the 2020 farm structure survey for utilised agricultural area; Maltese
  Agriculture Directorate organic register; recompute 66 / 10,700.
why_low_hanging: A two-number claim that can be recomputed and ranked from one Eurostat dataset.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: High
caveats: 'Supported: no right of reply needed. Commission document read in the Austrian Parliament copy only; the 10,700 ha and 34% are not traced to a named source (tested for consistency only); the EU average used is the 2020 estimate (no later aggregate); the footnote source on CAP plans (p. 29) was not opened. Candidate from the weekly intake of 18 Oct 2026. The claimant is the Commission; the sentence sits in the document''s
  description of the country, not in its findings, and the 66 ha source (Eurostat or the Maltese authorities) is not named
  in the passage read. The same document is the source of CC-128 and overlaps in subject with CC-047, CC-101 and CC-118 (water),
  CC-019 and CC-058 (land).'
