claim:
  text: 'The Shift News (Ivan Camilleri, 26 Feb 2026): headline "''Free'' public transport reaches €100 million a year in subsidies as traffic gridlock worsens"; body: Malta''s "''free'' public transport system cost taxpayers almost €100 million in 2025, according to figures tabled in Parliament", while "traffic congestion continues to worsen".'
  speaker: The Shift News
  date: '2026-02-26'
  wording_status: Verbatim found
  sources:
  - title: '''Free'' public transport reaches EUR 100 million a year in subsidies as traffic gridlock worsens'
    publisher: The Shift News
    date: 26 Feb 2026
    url: https://theshiftnews.com/2026/02/26/free-public-transport-reaches-e100-million-a-year-in-subsidies-as-traffic-gridlock-worsens/
    note: 'Primary: the article is the claim (the speaker is the outlet). Read in full 10 Oct 2026. Its figures come from replies to PQs by Chris Said, not read.'
  - title: Nefqa ta’ €100 miljun fis-sena għal trasport pubbliku b’xejn
    publisher: Newsbook
    date: 27 Feb 2026
    url: https://newsbook.com.mt/nefqa-ta-e100-miljun-fis-sena-ghal-trasport-pubbliku-bxejn/
    note: Outlet report of the same tabled document (second-hand). Read in full.
  quote: 'Malta’s ‘free’ public transport system cost taxpayers almost €100 million in 2025, according to figures tabled in Parliament (The Shift News, 26 Feb 2026).'
counter_evidence: 'The article''s three 2025 payments (59.0 + 31.2 + 3.2) sum to EUR 93.4 million (second-hand: the parliamentary reply was not read; Newsbook reports the same). TomTom Valletta metro congestion 49.2% (2024) to 50.3% (2025); Eurostat passenger cars +5.8% 2022-2025 but cars per 1,000 residents 610 to 585 (population +10.4%).'
tests: Parliamentary reply (not read); Financial Estimates (403); Eurostat road_eqs_carmot and demo_gind; TomTom Traffic Index.
why_low_hanging: 'Done: Claim Check 071 report and flyer.'
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: Medium
caveats: 'Verdict Not substantiated (low): the article''s own components sum to EUR 93.4m, not 100m; every euro figure is second-hand (the PQ replies, Financial Estimates and accounts were not read; parlament.mt and finance.gov.mt are 403). Congestion is only slightly up (TomTom, Valletta area, two years); car stock up but cars per head down; the implied failure of free travel is not tested (no counterfactual). The rating applies to the claim as the outlet worded it, not to its motives. Pending right of reply.'
