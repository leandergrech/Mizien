id: CC-135
title: 'IMF: peak electricity demand up 43% in five years'
category: Climate & Energy
subtopic: Electricity & grid
status: Drafted
verdict: Largely supported
verdict_confidence: High
claim:
  text: 'International Monetary Fund staff (Selected Issues paper ''Taking Stock of Infrastructure in Malta'', Feb 2025):
    peak electricity demand rose ''from 465 MW in 2018 to 663 MW in 2023 (an increase of 43 percent)'', ''significantly outpaced
    the growth in population and tourists in the peak summer season (an increase of 13 percent over the same period)''.'
  speaker: International Monetary Fund
  date: 2025-02
  wording_status: Verbatim found
  sources:
  - title: Taking Stock of Infrastructure in Malta (Selected Issues Paper SIP/2025/007; also Country Report No. 25/18), para.
      5
    publisher: International Monetary Fund
    date: Feb 2025
    url: https://meetings.imf.org/-/media/Files/Publications/Selected-Issues-Papers/2025/English/SIPEA2025007.ashx
    note: The claim. PDF downloaded and text read on 25 Oct 2026 (HTTP 200); para. 5, footnote 3 and the chart's notes re-read
      via WebFetch on 26 Oct 2026 (curl 403 that day); information as of 17 Dec 2024. Selected Issues papers carry the author's
      (Alexander Pitt) and IMF staff views, not the Board's.
  quote: Peak electricity demand has increased rapidly in recent years, rising from 465 MW in 2018 to 663 MW in 2023 (an increase
    of 43 percent). This increase has significantly outpaced the growth in population and tourists in the peak summer season
    (an increase of 13 percent over the same period).
counter_evidence: "NSO Electricity Supply releases: maximum demand 465 MW (Aug 2018) and 663 MW (Jul 2023), +42.6%. Eurostat demo_gind plus tour_occ_nim (August nights / 31, the paper's method): residents plus tourists +13.3% to +13.5% 2018-2023. Final electricity consumption grew +13.4% (nrg_cb_e), so energy kept pace with people while the peak did not. But the end years are the coolest (2018) and hottest (2023) summers of 2017-2025 at Luqa (GHCN-Daily, hottest-month mean 26.9 and 29.4 C); other windows give +28% to +37%, the 2017-2025 trend line +24% over five years, and the peak fell to 593 MW in 2024 before 637 MW in 2025. The paper itself says the rise 'may be related' to temperature, says capacity is adequate for now, and reports the authorities' projection of about 30% more peak demand by 2040 (not tested)."
tests: Enemalta or Regulator for Energy and Water Services peak load figures for 2018-2023 (and 2024-2026); the paper's own
  source for the series; Eurostat population and NSO tourist nights for the summer months (the 13 percent); Malta Met Office
  temperature records; whether the 663 MW is gross or net, and demand met including the interconnector.
why_low_hanging: Three numbers (465, 663, 13 percent) that can be recomputed from load data, population and tourist series.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'High: NSO releases read via WebFetch (nso.gov.mt refuses curl); Eurostat and NOAA GHCN-Daily download by script.'
caveats: "Largely supported: no right of reply needed. Every figure matches the NSO and Eurostat, but 2018 and 2023 are the coolest and hottest summers of 2017-2025, so the 43% is the largest of the measures (about 24% on the trend line). The NSO figures were transcribed via a web reader; Table 7 was read only for 2017-2021, and the 2024 release implies the 2023 monthly series was revised (whether 663 MW changed is unknown). Tourists are Eurostat's accommodation-establishment nights, not the NSO frontier survey. Temperatures are from NOAA's Luqa record, not the IMF's unnamed source. A staff paper's view, not the IMF Board's."
