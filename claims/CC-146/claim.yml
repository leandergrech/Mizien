counter_evidence: 'Attributed context: the PN (CC-114) cites Eurostat air emissions accounts showing intensity up 17% since
  2013 while the EU average fell 34%. The Climate Action Authority factsheet (CC-147) makes a similar methodological argument.
  Eurostat/UN accounting differences (residence vs territory principle, bunkers and aviation) are real; whether they explain
  the whole divergence is the point to test. The Central Bank says Malta still faces important policy gaps.'
tests: 'Eurostat air emissions accounts (env_ac_ainah_r2) and ESA GDP: recompute emissions per euro of GVA, with and without
  NACE H51 (air transport) and H50 (water transport); Malta UNFCCC inventory (NIR 2026) by sector; the EU 2013-2024 comparison.
  Compare the Central Bank method with Eurostat metadata.'
why_low_hanging: Public datasets reproduce both measures; the dispute is about definition, a good test of how metric choice
  drives a headline.
