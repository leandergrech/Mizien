id: CC-146
title: 'Central Bank of Malta: rising emissions intensity is a ''statistical illusion'''
category: Climate & Energy
subtopic: Emissions & targets
status: Not started
verdict: null
verdict_confidence: null
claim:
  text: 'Central Bank of Malta (Aaron G. Grech, chief officer, Economics Division; reported by MaltaToday, April 2026): the
    claim that Malta''s greenhouse-gas emissions intensity is rising is ''a statistical illusion'' driven by methodology (international
    aviation and shipping counted in the Eurostat measure), not a real deterioration. Reported figures: under the UN-based
    measure intensity was nearly a quarter better in 2023 than in 2018; adjusted for aviation outside Maltese airspace it
    reached a historic low in 2024, about a quarter of its 2005 level.'
  speaker: Central Bank of Malta (Aaron G. Grech)
  date: null
  wording_status: 'Paraphrase: locate quote'
  sources:
  - title: 'PN: Malta only EU state to increase emissions intensity since 2013'
    publisher: MaltaToday
    date: 2026-04
    url: https://www.maltatoday.com.mt/news/national/139395/pn_malta_only_eu_state_to_increase_emissions_intensity_since_2013
    note: 'Locates the dispute (PN''s Eurostat figure of +17% since 2013 against -34% for the EU, and the Central Bank''s
      reply as summarised by a search engine). Not read in full (WebFetch blocked): the Central Bank''s own words and the
      report title still to be found.'
  - title: 'Central Bank of Malta: Statistics and Staff Insights'
    publisher: Central Bank of Malta
    date: n/d
