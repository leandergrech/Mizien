id: CC-126
title: 'PN: Labour promised a gas pipeline by 2026'
category: Climate & Energy
subtopic: Electricity & grid
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Partit Nazzjonalista (statement, 22 Jun 2026): after the Prime Minister announced a gas supply agreement with BP,
    the Government ''has signed an agreement for just nine months'' without giving the price, and ''the Labour Government
    had promised that by this year Malta would have a pipeline for gas supply so that the country would no longer depend on
    the tanker in Marsaxlokk. But here too, it has failed.'''
  speaker: Partit Nazzjonalista
  date: '2026-06-22'
  wording_status: Verbatim found
  sources:
  - title: Government must immediately publish the price and conditions of the gas supply agreement with BP
    publisher: Partit Nazzjonalista
    date: '2026-06-22'
    url: https://pn.org.mt/en/?p=29003
    note: The claim. Read in full on 18 Oct 2026 (HTTP 200). English text as published by the party.
  - title: Malta secures LNG supply deal with BP until May 2027
    publisher: Italpress / MNA
    date: '2026-06-22'
    url: https://www.italpress.com/?p=703189
    note: Locates the deal and its term (to the end of May 2027; SOCAR contract expires 13 Aug 2026). Outlet text, not the
      Government's own.
  - title: Enemalta secures new LNG supply agreement
    publisher: Enemalta
    date: '2026-06-21'
    url: https://enemalta.com.mt/2026/06/21/enemalta-secures-new-lng-supply-agreement/
    note: Primary for the contract (term, TTF link, seven bidders, no price). Read in full on 19 Oct 2026.
  - title: Dalli silent on LNG costs as BP deal raises questions over pricing and duration
    publisher: The Shift News
    date: '2026-06-22'
    url: https://theshiftnews.com/2026/06/22/dalli-silent-on-lng-costs-as-bp-deal-raises-questions-over-pricing-and-duration/
    note: Outlet text; says neither Enemalta nor the Ministry disclosed the expected cost. Read in full on 19 Oct 2026.
  - title: Melita TransGas hydrogen-ready pipeline (project page, website last updated 22 Dec 2022)
    publisher: Melita TransGas Company Ltd
    date: '2022-12-22'
    url: https://melitatransgas.com.mt/
    note: Primary (state promoter). Indicative construction 2028, commissioning 2030. Read in full on 19 Oct 2026.
  quote: The Labour Government had promised that by this year Malta would have a pipeline for gas supply so that the country would no longer depend on the tanker in Marsaxlokk. But here too, it has failed.
counter_evidence: 'Enemalta (21 Jun 2026) says the BP supply runs till the end of May 2027 (9.6 months from the SOCAR expiry on 13 Aug 2026, 11.3 from the announcement) and that the price is linked to the TTF index, so the formula’s reference was disclosed though no price was (The Shift, 22 Jun 2026: expected cost not disclosed). No Labour statement dating the pipeline to 2026 was found; the pipeline promoter’s page (updated 22 Dec 2022) gives indicative construction from 2028 and commissioning in 2030; earlier targets of 2024 and 2025 are second-hand (Global Energy Monitor summary).'
tests: Wording of Labour's earlier gas-pipeline promise (2017 and 2022 manifestos; data/manifesto_pledges.csv; Government
  statements on the pipeline project, EU Projects of Common Interest list); Enemalta and Government announcement of the BP
  agreement (term, start date); status of the Malta-Italy gas pipeline (European Commission PCI list, Eurostat); the 21 Jun
  2026 power cuts (CC-027, CC-090) for the 'candles and fans' remark, which is context, not the claim.
why_low_hanging: 'A dated, verbatim opposition statement with two checkable parts: a contract term and a dated pledge with
  a status.'
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium to high: pn.org.mt and Italpress are reachable; the Government''s own announcement (gov.mt) is probably
  refused; manifestos are in the repo.'
caveats: 'Opposition statement about a Government pledge and contract; PN’s own 2022 programme also proposed a pipeline to Sicily. The dated promise "by this year" was not found in any readable source (Labour 2013, 2017 and 2022 manifestos and Government statements not opened in the original; 2017 pledge and 2024/2025 targets are second-hand). Start date of BP supply not published. Opinion ("management by crisis", transparency demand, "candles and fans") not rated. Pending right of reply (Partit Nazzjonalista); not sent by the worker.'
