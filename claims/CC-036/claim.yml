id: CC-036
title: "ERA: construction and quarry dust 'more of a nuisance rather than a health-related issue'"
category: Air
subtopic: Air quality & health
status: Drafted
verdict: Not substantiated
verdict_confidence: Moderate
claim:
  text: 'Environment and Resources Authority, State of the Environment Report 2018, Chapter 2 Ambient Air, p. 15: ''A source
    of a coarser fraction of dust is mineral extraction and construction, which is considered to be more of a nuisance rather
    than a health-related issue.'' The same paragraph: ''A minor percentage of this dust is in the PM10 size range, estimated
    to range between 11 and 22 %.'''
  speaker: Environment and Resources Authority (ERA)
  date: '2018'
  wording_status: Verbatim found
  sources:
  - title: 'State of the Environment Report 2018, Chapter 2: Ambient Air'
    publisher: ERA
    date: '2018'
    url: https://era.org.mt/wp-content/uploads/2019/05/3_Chapter2_AmbientAir_9Aug18.pdf
    note: 'Primary report. era.org.mt refuses scripts; chapter read in full from a browser copy supplied by the maintainer on
      16 Nov 2026 (sha256 in archive/manifest.csv). The sentence is in section 2.4.3, PDF p. 15.'
  quote: A source of a coarser fraction of dust is mineral extraction and construction, which is considered to be more of
    a nuisance rather than a health-related issue.
counter_evidence: 'ERA gives no source for the judgement. Its cited study (Vella & Camilleri 2005, Xjenza 10:47-54) measured
  11.0-22.9% of deposited quarry dust below 10 um (ERA''s 11-22%), estimated about 1,200 t of PM10 a year from quarries 0.2-2
  km from homes, and concluded there may be impacts on the health of the general population and of quarry workers. The US
  EPA ISA (2019) rates coarse PM (PM10-2.5) ''suggestive of, but not sufficient to infer'' a causal relationship for short-term
  respiratory and cardiovascular effects and for mortality (fine PM: causal or likely causal); reviews and time-series studies
  find associations with deaths and admissions (Brunekreef & Forsberg 2005; Adar et al. 2014; Meister et al. 2012), and desert
  (mineral) dust PM10 is associated with mortality in Southern Europe (Stafoggia et al. 2016: +0.65% per 10 ug/m3). In Malta
  47-72% of PM10 at monitoring stations is coarse (EEA, verified annual means), and every station''s latest PM10 annual mean
  exceeds the WHO 2021 guideline of 15 ug/m3. In the statement''s favour: 77-89% of the dust by mass is larger than 10 um and
  settles; the evidence on coarse PM is weaker than on fine PM.'
tests: Literature on construction dust health effects; PM10/PM2.5 ratios at Msida.
why_low_hanging: A specific, attributable statement that public data can test.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Medium: era.org.mt refuses scripts (browser copy from the maintainer); EEA air-quality statistics and the
  health reviews are open.'
caveats: 'Not substantiated: pending right of reply. True of particles larger than 10 um, which settle as nuisance dust; not
  shown for the PM10 share of the same dust, which ERA''s own source links to possible health effects. Confidence is moderate
  because the evidence on coarse PM is itself rated suggestive, and no study of limestone construction dust and health in Malta
  was found. Coarse PM in the EEA data includes sea salt and Saharan dust, so it does not measure construction''s share.'
