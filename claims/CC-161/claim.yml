id: CC-161
title: 'Ombudsman: nightlife noise, ''residents complain without effective remedy'''
category: Noise
status: Drafted
verdict: Not substantiated
verdict_confidence: Low
claim:
  text: 'Parliamentary Ombudsman (Office of the Ombudsman, 3 Mar 2026, ''Curbing uncontrolled and abusive noise in entertainment
    and other places: Part 2 - A human rights issue''): ''Residents complain without effective remedy'' where regular nightlife
    establishments are licensed near homes and the authorities acknowledge excessive noise.'
  speaker: Parliamentary Ombudsman
  date: '2026-03-03'
  wording_status: Verbatim found
  sources:
  - title: 'Curbing uncontrolled and abusive noise in entertainment and other places: Part 2 - A human rights issue'
    publisher: Office of the Ombudsman, Malta
    date: '2026-03-03'
    url: https://ombudsman.org.mt/news-and-events/curbing-uncontrolled-and-abusive-noise-in-entertainment-and-other-places-part-2-a-human-rights-issue/
    note: The claim in the Ombudsman's own words; read in full 9 Nov 2026. The article cites ECtHR Moreno
      Gómez v Spain (4143/2002) and Cuenca Zarzoso v Spain (23383/12) and the WHO Environmental Noise Guidelines (2018); no
      complaint counts.
  - title: Curbing uncontrolled and abusive noise in entertainment and other places - Part 1 - Structural regulatory weaknesses
    publisher: European Network of Ombudsmen
    date: '2026'
    url: https://eno.ombudsman.europa.eu/home/news/maincontent/curbing-uncontrolled-and-abusive.html
    note: Part 1 of the same series (2 Mar 2026), read in full 9 Nov 2026. Lists five laws and the enforcing bodies; calls the framework 'fragmented and weak'; no figures.
  quote: Residents complain without effective remedy
counter_evidence: 'Not testable with public outcome data: Part 2 gives no complaint or enforcement counts and none were found for nightlife venues. Ombudsman case note of 15 Jul 2025: Transport Malta issued Notice to Mariners 115 of 2025 (11 Jul 2025) after residents complained about boat parties, a remedy in a related case. Police received 98 reports of excessive noise in Valletta, St Julian''s, Sliema and St Paul''s Bay, Jan 2021 to Jun 2022 (second-hand: Lovin Malta, 6 Oct 2022, reporting a parliamentary answer); an input count, not an outcome.'
tests: Part 1 of the series (regulatory weaknesses); noise-complaint and enforcement statistics from the Planning Authority,
  ERA, police and local councils (parliamentary questions); outcome of cases cited; WHO Environmental Noise Guidelines (2018)
  thresholds for night-time noise.
why_low_hanging: Enforcement outcomes can be tested against published statistics and parliamentary replies.
tags: []
tags_provisional: false
priority: Done (v1.0)
data_readiness: 'Low-medium: the Ombudsman pages readable; complaint and enforcement counts may be browser-only (parlament.mt);
  a data request may be needed.'
caveats: Draft pending right of reply from the Office of the Ombudsman. 'Effective remedy' is defined operationally by this check (Section 3), not by the Ombudsman. The Ombudsman's casework may hold evidence we cannot see; the verdict rates how far the statement has been shown publicly, not the Ombudsman's competence or motives. Police counts are second-hand (parliamentary answer not read). Spanish judgments are described as in the Ombudsman's note and were not read.
