  quote: Emissions per capita have fallen by 44% since 2005, well above the EU average of 34%.
counter_evidence: 'The same Commission report shows effort-sharing emissions 41% above 2005 in 2024 and
  projects +42% (existing measures) or +30% (planned measures) by 2030 against a -19% target: the largest
  gap in the EU in percentage points. Total emissions fell 27% (EU 33%); population grew 41%, explaining
  about half the per-person fall. Transport +49%, F-gases about six-fold.'
tests: Eurostat env_air_gge and nama_10_pe; Commission CAPR 2025 SWD; Eurostat nrg_ind_ren.
