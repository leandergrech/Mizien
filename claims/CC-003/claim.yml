  - title: Climate Action Progress Report 2025, Commission Staff Working Document
    publisher: European Commission
    date: Nov 2025
    url: https://climate.ec.europa.eu/document/download/35f83a2d-f77d-4895-b616-d579069b23d3_en?filename=capr2025_swd_en.pdf
    note: 'Primary evidence: ESR Table 25 pp. 114-115, AEA balance p. 125 (printed page numbers; PDF page is one higher).'
  - title: Malta set to increase emissions as EU cuts carbon output (citing EC 2025 Climate Action Progress Report)
