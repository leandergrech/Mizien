id: CC-003
title: Per-capita emissions vs 2030 projection
category: Climate & Energy
subtopic: Emissions & targets
status: Drafted
verdict: Misleading
verdict_confidence: High
claim:
  text: 'Climate Action Authority (13 Nov 2025): emissions per capita have fallen 44% since 2005, well above the
    EU average of 34%, showing Malta is reducing emissions at household level and across the economy.'
  speaker: Climate Action Authority; Ministry for the Environment
  date: '2025-11-13'
  wording_status: Verbatim found
  sources:
