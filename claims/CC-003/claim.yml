  - title: 'Renewable Energy 2026: Malta'
    publisher: Chambers Practice Guides
    date: 11 Sep 2026
    url: https://practiceguides.chambers.com/practice-guides/renewable-energy-2026/malta
  quote: Emissions per capita have fallen by 44% since 2005, well above the EU average of 34%.
counter_evidence: 'The same Commission report shows effort-sharing emissions 41% above 2005 in 2024 and projects
  +42% (existing measures) or +30% (planned measures) by 2030 against a -19% target: the largest gap in the EU in
  percentage points. Malta was over its yearly ESR limit by 22, 25 and 30 points in 2022-2024 (+43/+42/+41% vs
  +21/+16/+11%); the 2021 surplus carried forward brings the cumulative balance to 0.0 Mt in 2024, -2.1 Mt projected
  for 2030 before flexibilities. Total emissions fell 27% (EU 33%); population grew 41%, explaining about half the
  per-person fall. Among the EU-27 (2005-2024) Malta ranks 3rd on the per-person cut (-48.5%) but 20th on the total
  cut (-27.4%). Transport +49%, F-gases about six-fold. In the authority''s favour: effort-sharing emissions per
  person are flat (2.50 t in 2005, 2.52 t in 2024; proxy: total minus power generation), and no compliance
  shortfall has arisen before the first check in 2027.'
tests: Eurostat env_air_gge and nama_10_pe (Malta, EU-27 aggregate and all 27 Member States); Commission CAPR 2025
  SWD Tables 25 and 26; Eurostat nrg_ind_ren.
why_low_hanging: 'Done: Claim Check 003 report and flyer.'
