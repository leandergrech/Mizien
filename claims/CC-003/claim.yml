- 'European Commission, CAPR 2025 SWD Table 25 (p. 114; yearly ESR limits +102/+21/+16/+11% vs emissions
  +30/+43/+42/+41%, 2021-2024) and Table 26 (p. 125; allocations, emissions and cumulative balance 2021-2030),
  typed into data/cc-003/capr2025_esr_malta.csv'
- European Commission, CAPR 2025 chapter 3 web page (Germany, Ireland and Malta largest projected gaps)
- Eurostat env_air_gge and nama_10_pe, retrieved 2 Oct 2026 (data/cc-003/); all EU-27 Member States, retrieved
  5 Oct 2026 (data/cc-003/eurostat_ghg_pop_eu27.csv)
