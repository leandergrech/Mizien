claim:
  text: 'European Commission (2026 Country Report - Malta, 3 Jun 2026): in 2024 Malta recorded 7,700 new passenger car registrations,
    of which 37.7% were zero-emission vehicles, well above the EU average of 13.6%.'
  speaker: European Commission
  date: '2026-06-03'
  wording_status: Verbatim found
  sources:
    - title: 2026 Country Report - Malta, SWD(2026) 218 final (Council doc. 10135/26 ADD 1)
      publisher: European Commission (via Council of the EU)
      date: '2026-06-03'
      url: https://data.consilium.europa.eu/doc/document/ST-10135-2026-ADD-1/en/pdf
      note: 'The claim. Full text read 5 Oct 2026: Annex 8 (quoted passage; footnote 142 cites Eurostat) and statistical annex.'
    - title: New passenger cars by type of motor energy (road_eqr_carpda); passenger cars (road_eqs_carpda)
      publisher: Eurostat
      date: updated 1 Sep 2026
      url: https://ec.europa.eu/eurostat/databrowser/view/road_eqr_carpda/default/table
      note: Primary data, retrieved 5 Oct 2026; extract and checks in data/cc-110/.
  quote: In 2024, Malta recorded 7 700 new passenger car registrations, of which 37.7% were ZEVs - a 17.4 percentage point
    increase since 2023 (20.3%) and well above the EU average of 13.6%.
counter_evidence: 'Eurostat: 7,683 new cars in 2024, 2,893 battery electric, no hydrogen: 37.65% (2023: 20.31%; 2025: 37.56%).
  EU-27 13.53% (report 13.6%). Malta is 2nd of 27 after Denmark (51.3%). Context: zero-emission cars were 2.2% of the passenger-car
  stock at the end of 2024 (EU 2.2%) and the stock grew by 6,632 cars (18 a day); the report notes charging infrastructure
  lags.'
