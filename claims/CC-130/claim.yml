id: CC-130
title: 'NGOs: ODZ racecourse policy ends protection'
category: Planning & Housing
subtopic: Permits & enforcement
status: Not started
verdict: null
verdict_confidence: null
claim:
  text: 'Moviment Graffitti, for nine NGOs (13 Oct 2026): the Planning Authority''s proposed policy would ''allow fully fledged,
    massive commercial facilities in the form of obstacle racecourses in Outside Development Zone (ODZ) areas, on both agricultural
    and natural land''; the facilities would ''not be temporary at all'' because ''permits will be valid for a full five years'';
    and the policy ''will spell the end of ODZ protection'' and ''threaten hundreds of farmers''.'
  speaker: Moviment Graffitti
  date: '2026-10-13'
  wording_status: Verbatim found
  sources:
  - title: End of ODZ if planning policy concocted with developers is approved
    publisher: Moviment Graffitti
    date: '2026-10-13'
    url: https://movimentgraffitti.org/2026/10/13/end-of-odz-if-planning-policy-concocted-with-developers-is-approved/
    note: The claim. English text read in full on 18 Oct 2026 (HTTP 200). Signed by BirdLife Malta, Din l-Art Ħelwa, Flimkien
      għal Ambjent Aħjar, Friends of the Earth Malta, Għawdix, Moviment Graffitti, Nature Trust Malta, Ramblers Association
      Malta and Wirt Għawdex.
  quote: Nine NGOs have formally submitted their strong objections to the Planning Authority (PA) against a proposed planning
    policy that will spell the end of ODZ protection, threaten hundreds of farmers, and potentially cause great harm to nature.
counter_evidence: The policy text, its consultation notice and the proposed conditions (five-year validity, locations, size
  limits, restoration) were not read; the PA's draft policy is probably on pa.org.mt (refused to scripts). The NGOs' statement
  says the policy 'seems to assume' that the word 'temporary' removes the impact. No response from the Planning Authority
  or the Government was found. The statement also makes claims about how the policy was drawn up and refers to other people;
  these concern process and motive and are not part of the check.
tests: The Planning Authority's draft policy and public-consultation notice (what is permitted in ODZ, permit duration, locations,
  size, restoration); existing ODZ policy (Rural Policy and Design Guidance 2014, as revised) for what is already allowed;
  Ta' Qali application PA reference and its outcome; counts of ODZ farmland and farmers affected (NSO, Agriculture Directorate);
  ERA and Natura 2000 overlap with ODZ.
why_low_hanging: Specific policy provisions (duration, land types) that can be read directly in a published draft.
tags: []
tags_provisional: true
priority: Queue
data_readiness: 'Low to medium: movimentgraffitti.org is readable; the PA draft policy is probably browser-only (pa.org.mt
  403), so the maintainer may need to supply the draft text.'
caveats: Candidate from the weekly intake of 18 Oct 2026. The claimant is an NGO coalition and holds the same standard as
  any other side. Check the policy's provisions and the plain-language claims ('five years', 'agricultural and natural land');
  do not test statements about motives or individuals, and make no claim about people. 'End of ODZ protection' and 'hundreds
  of farmers' are characterisations to be compared with the text. Related to CC-014, CC-018 and CC-019 (land) and CC-067 (Gozo
  height policy) in subject.
