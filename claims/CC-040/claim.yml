  quote: Per capita water consumption, today stands at around 110l/cap/day.
counter_evidence: 'Eurostat env_wat_cat / demo_pjan (estimates): Maltese households 116 l/person/day (2022), 120 (2024), 9%
  above 110; all uses of the public supply about 176 l per resident (2024, includes services and tourists). Among 19 EU states
  with a recent household figure Malta ranks 13th lowest, 8% above the median (111 l). The deck makes no EU comparison.'
tests: Eurostat env_wat_cat, demo_pjan (EU-27 households); WSC billed consumption not obtained.
