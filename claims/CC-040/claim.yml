claim:
  text: 'Energy and Water Agency (Manuel Sapiano, IWRA 1st Island Water Congress keynote, 2024): per capita water consumption
    in Malta stands at around 110 l/cap/day, and tariffs and engagement have contributed to keeping it low. (The intake''s
    added "relatively low compared with other European countries" is not in the deck.)'
  speaker: Energy and Water Agency (Manuel Sapiano)
  date: '2024'
  wording_status: Verbatim found
  sources:
