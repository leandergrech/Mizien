claim:
  text: 'Planning Authority CEO Johann Buttigieg (MaltaToday interview, 2 Mar 2025): continuing to issue
    permits helps keep property prices in check; he cited about 91,000 dwellings approved over a decade.'
  speaker: Johann Buttigieg, Planning Authority CEO
  date: '2025-03-02'
  wording_status: Verbatim found
  sources:
  - title: 'Johann Buttigieg: ''Issuing permits helps keep property prices in check'''
    publisher: MaltaToday
    date: 2 Mar 2025
