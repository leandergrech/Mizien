id: CC-013
title: Permits keep property prices in check
category: Planning & Housing
subtopic: Housing & affordability
status: Drafted
verdict: Largely supported
verdict_confidence: Moderate
claim:
  text: 'Planning Authority CEO Johann Buttigieg (MaltaToday interview, 2 Mar 2025): continuing to issue permits
    helps keep property prices in check; without them Malta would face the same housing crises as other European
    countries. The interviewer cited about 91,000 dwellings approved over a decade.'
  speaker: Johann Buttigieg, Planning Authority CEO
  date: '2025-03-02'
  wording_status: Verbatim found
  sources:
  - title: 'Johann Buttigieg: ''Issuing permits helps keep property prices in check'''
    publisher: MaltaToday
    date: 2 Mar 2025
    url: https://www.maltatoday.com.mt/news/interview/133858/johann_buttigieg_issuing_permits_helps_keep_property_prices_in_check_
    note: The claim. Read in full 3 Oct 2026. The 91,000 figure is in the interviewer's question.
  - title: Approved Dwelling Units for 2007-2025
    publisher: Planning Authority
    date: 2026
    url: https://www.pa.org.mt/file.aspx?f=37489
    note: 87,814 units approved 2015-2024.
  - title: 'Census of Population and Housing 2021: Final Report vol. 2'
    publisher: National Statistics Office
    date: 2023
    url: https://nso.gov.mt/wp-content/uploads/Census-2021-Volume-2.pdf
    note: 27.5% of dwellings secondary, seasonal or vacant.
  quote: Had we not issued these permits, Malta would face the same housing crises as other European countries.
    This is a supply-and-demand issue – continuing to issue permits helps keep property prices in check. Stopping
    them would drive prices up.
counter_evidence: Supported in direction by peer-reviewed research on supply constraints (Glaeser et al. 2005; Hilber
  and Vermeulen 2016; Saiz 2010); Anenberg and Kung (2020) find extra supply alone does little for rent burdens.
  Malta population +31% 2015-2025 (EU +2%; highest of 27, about 16 times the EU rate); real house prices +34% (EU
  +25%; Malta 2025 provisional), which ranks 16th of 27, below the median Member State (+41%); the EU aggregate is
  weighted towards Germany, France and Italy (49%). Rents (HICP actual rentals) +53% vs EU +21% (8th of 27); house
  prices +6.9% a year to 2026-Q2 (provisional) vs EU +4.7%. Housing-cost
  overburden rose from 1.1% (2015) to 2.9% (2022) while the EU's fell; Eurostat flags a break in Malta's series in
  2023, after which it held at about 6% (6.0% in 2025; EU 7.7%). Overcrowding 4.7% vs EU 16.8%. 27.5% of
  dwellings not a main residence (Census 2021).
tests: Eurostat prc_hpi_a, tipsho10, demo_gind, ilc_lvho07a, ilc_lvho05a; all EU-27 demo_gind, tipsho10,
  prc_hicp_aind, prc_hpi_q, prc_hpi_cow; PA approved dwellings 2007-2025; NSO Census 2021; housing-supply literature.
why_low_hanging: 'Done: Claim Check 013 report and flyer.'
tags: []
tags_provisional: false
priority: Done (v1.2)
data_readiness: High
caveats: Right of reply to the Planning Authority not yet sent. Effect size unproven for Malta; affordability worsening;
  approvals are not completions. Prices only, not environmental costs of the permits.
