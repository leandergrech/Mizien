    note: Speaker's own words in an interview; confirm wording against the video.
  quote: continuing to issue permits helps keep property prices in check
counter_evidence: An MDA-commissioned study reported prices up 59% since 2017 over a period of very high
  permit volumes. Vacancy, foreign and investment demand and the type of dwellings approved are not addressed.
tests: Peer-reviewed research on housing supply elasticity and prices; NSO residential property price
  index against PA permits 2015-2025; 2021 census vacant dwellings; price-to-income ratios.
why_low_hanging: Permit and price series are public; the economics literature is large.
