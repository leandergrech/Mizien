id: CC-022
title: '''Lowest electricity burden in the EU'''
category: Climate & Energy
subtopic: Electricity & grid
status: Drafted
verdict: Largely supported
verdict_confidence: High
claim:
  text: 'Energy Ministry (press release, 6 May 2025): Malta has the lowest household electricity prices in the EU
    in purchasing power standards (14.33 PPS per 100 kWh, 2024-S2), the third-lowest nominal price (EUR 0.131),
    and ''the burden on Maltese families is the lowest in the EU''.'
  speaker: Ministry for the Environment, Energy and Public Cleanliness
  date: '2025-05-06'
  wording_status: Verbatim found
  sources:
  - title: 'Electricity prices in the EU: Maltese households with lowest burden'
    publisher: Ministry for the Environment, Energy and Public Cleanliness
    date: 6 May 2025
    url: https://www.gov.mt/en/Government/DOI/Press%20Releases/Pages/2025/05/06/pr250746en.aspx
    note: The claim. Read in full 4 Oct 2026 in a browser.
  quote: While Malta has the third-lowest nominal electricity price for domestic consumers in the EU at €0.131 per
    unit, when adjusted for PPS ... the burden on Maltese families is the lowest in the EU, at 14.33 PPS per 100kWh.
counter_evidence: 'Eurostat nrg_pc_204 confirms every figure for the standard household band (2,500-4,999 kWh):
  Malta 14.35 PPS/100 kWh in 2024-S2, lowest of 27; EUR 0.1303, third lowest; CZ 41.00, CY 35.70, DE 35.23 PPS.
  In other bands Malta is not the cheapest (2024-S2: 3rd for 1,000-2,499 kWh, 2nd for 5,000-14,999 kWh, 16th
  under 1,000 kWh, 23rd of 27 at 15,000 kWh or more; 4th of 26 on the all-band average). Malta''s price -0.2%
  2020-25 vs EU +35%; EUR 0.169 to 0.125 per kWh in 2014, 0.125-0.133 since. Fixed electricity and fuel prices
  are financed by energy subsidies of 1.8% of GDP (2022) to 0.8% (2025, projected), about EUR 1.0bn 2022-2025
  (IMF CR 26/29; electricity and fuel together, electricity share not published). Energy poverty below EU (7.6%
  vs 8.8% unable to keep warm).'
tests: Eurostat nrg_pc_204 (EUR, PPS), ilc_mdes01, ilc_mdes07; IMF CR 26/29 energy subsidies.
why_low_hanging: 'Done: Claim Check 022 report and flyer.'
