# Build the site on every pull request and push to main; deploy main to GitHub Pages.
#
# Deploying needs two one-off repository settings (maintainer):
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables: PAGES_SOURCE = actions
# Until both are set, the deploy job is skipped and Pages keeps serving main:/docs.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The homepage now lives in site/, so Pages must serve the built site, not main:/docs.
      - name: Pages deploys from Actions
        env:
          PAGES_SOURCE: ${{ vars.PAGES_SOURCE }}
        run: |
          if [ ! -f docs/index.html ] && [ "$PAGES_SOURCE" != "actions" ]; then
            echo "::error::The homepage has moved from docs/ to site/. Before merging, set Settings > Pages > Source to 'GitHub Actions' and add the repository variable PAGES_SOURCE=actions; otherwise the live site loses its homepage."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt

      - name: Validate claim records
        run: python scripts/validate_claims.py

      - name: Report tools (poppler and the report fonts)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils fonts-liberation fonts-dejavu-core

      - name: Web versions of the reports
        run: python tools/report_html.py --all --warn

      - name: Build site data
        run: python scripts/build_site_data.py

      - name: Committed data outputs are current
        run: |
          if ! git diff --quiet; then
            echo "::warning::Generated files differ from what is committed. Run 'python scripts/build_site_data.py' and commit the result."
            git diff --stat
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build site
        run: npx eleventy

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_SOURCE == 'actions'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
